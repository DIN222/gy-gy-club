<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.6.24 - MEETING ROOM</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-dark: #000000;
            --panel-bg: #0d0e12;
            --accent-gold: #FFD700;
            --gold: #FFD700;
            --accent-gold-rgb: 255, 215, 0;
            --gold-bg: rgba(255, 215, 0, 0.1);
            --gold-border: rgba(255, 215, 0, 0.3);
            --tg-blue: #0088cc;
            --tg-blue-bg: rgba(0, 136, 204, 0.15);
            --text-color: #ffffff;
            --danger: #ff4d4d;
        }

        * { 
            -webkit-tap-highlight-color: transparent !important; 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }
        
        html, body { 
            width: 100vw; 
            height: 100vh; 
            background: var(--bg-dark); 
            color: var(--text-color); 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        .chat-page {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            position: relative;
        }

        /* Верхняя панель: идеальная сетка */
        .header-bar {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--gold-border);
            padding: 10px 20px;
            height: 65px;
            z-index: 100;
            gap: 15px;
            flex-shrink: 0;
        }

        .header-left-group {
            display: flex;
            align-items: center;
            justify-self: start;
        }

        .ui-nav-arrows {
            display: flex; 
            gap: 12px; 
            font-size: 24px; 
            font-weight: 900 !important; 
            font-family: 'Share Tech Mono', monospace; 
            color: var(--gold); 
            line-height: 1; 
            letter-spacing: -2px; 
            user-select: none;
        }
        
        .back-arrow { 
            transition: opacity 0.2s, transform 0.2s; 
            text-decoration: none;
            color: var(--gold);
            display: inline-block;
            cursor: pointer;
        }
        
        .back-arrow:hover { 
            opacity: 0.8; 
            transform: scale(1.1);
        }

        .header-center-area {
            justify-self: center;
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            max-width: 100%;
        }

        .header-participants {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 2px 0;
        }
        .header-participants::-webkit-scrollbar { display: none; }

        .participant-item {
            position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s;
        }
        .participant-item:hover { transform: scale(1.05); }

        .participant-item.active .member-avatar {
            border-color: #fff !important;
            box-shadow: 0 0 8px rgba(var(--accent-gold-rgb), 0.6);
        }

        .member-avatar-container {
            position: relative;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }

        .member-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #111;
            display: block;
            border: 2px solid rgba(var(--accent-gold-rgb), 0.5);
        }

        .member-flag {
            position: absolute;
            bottom: -2px;
            right: -4px;
            width: 16px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid var(--bg-dark);
            object-fit: cover;
            z-index: 5;
        }

        .add-member-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px dashed var(--accent-gold);
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
            background: rgba(var(--accent-gold-rgb), 0.05);
        }
        .add-member-btn:hover {
            border-color: #fff;
            color: #fff;
            border-style: solid;
        }

        .header-right-group {
            justify-self: end;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ui-header-right { 
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            user-select: none;
            cursor: pointer;
            padding-left: 8px;
            border-left: 1px solid rgba(var(--accent-gold-rgb), 0.2);
        }

        /* Область чата */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: radial-gradient(circle at center, #08080c 0%, #000 100%);
        }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            font-family: 'Share Tech Mono', monospace;
        }

        .msg-incoming {
            align-self: flex-start;
            background: var(--gold-bg);
            border: 1px solid var(--gold-border);
            color: var(--gold);
        }

        .msg-outgoing {
            align-self: flex-end;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid var(--gold);
            color: #fff;
        }

        .msg-author {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .msg-tg-badge {
            display: inline-block;
            font-size: 10px;
            color: var(--tg-blue);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .msg-time {
            font-size: 9px;
            opacity: 0.5;
            margin-top: 4px;
            text-align: right;
        }

        /* Нижняя панель ввода */
        .chat-input-bar {
            padding: 12px 15px;
            background: var(--panel-bg);
            border-top: 1px solid var(--gold-border);
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            background: #0a0a0f;
            border: 1px solid var(--gold-border);
            border-radius: 6px;
            padding: 12px 15px;
            color: var(--gold);
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            outline: none;
        }

        .chat-input:focus { border-color: var(--gold); }

        .send-btn {
            background: var(--gold-bg);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 0 14px;
            height: 42px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .send-btn:hover { background: var(--gold); color: #000; }

        .send-tg-btn {
            background: var(--tg-blue-bg);
            border: 1px solid var(--tg-blue);
            color: var(--tg-blue);
            padding: 0 12px;
            height: 42px;
            border-radius: 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .send-tg-btn:hover { 
            background: var(--tg-blue); 
            color: #fff; 
        }

        .tg-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-card {
            width: 90%;
            max-width: 400px;
            background: var(--panel-bg);
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 85vh;
            color: var(--text-color);
        }

        .modal-title {
            font-size: 15px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(var(--accent-gold-rgb), 0.3);
            padding-bottom: 8px;
            color: var(--accent-gold);
        }

        .staff-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 280px;
            padding-right: 5px;
        }
        .staff-list::-webkit-scrollbar { width: 4px; }
        .staff-list::-webkit-scrollbar-thumb { background: rgba(var(--accent-gold-rgb), 0.3); border-radius: 2px; }

        .staff-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            background: rgba(var(--accent-gold-rgb), 0.05);
            border: 1px solid rgba(var(--accent-gold-rgb), 0.2);
            border-radius: 6px;
            transition: all 0.2s;
        }
        .staff-item:hover { border-color: var(--accent-gold); }

        .staff-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .staff-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .delete-staff-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            width: 26px;
            height: 26px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .delete-staff-btn:hover { background: var(--danger); color: #fff; }

        .modal-close-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .modal-close-btn:hover { filter: brightness(1.1); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="chat-page">
        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
        <div class="header-bar">
            <div class="header-left-group">
                <div class="notranslate ui-nav-arrows">
                    <span class="back-arrow" onclick="location.href='office.html'" title="В Офис">&lt;</span>
                    <span class="back-arrow" onclick="location.href='index.html'" title="Ко входу">&lt;&lt;</span>
                </div>
            </div>

            <div class="header-center-area">
                <!-- ЛЕНТА АВАТАРОВ (включая пользователя и сотрудников) -->
                <div id="header-participants" class="header-participants">
                    <div class="participant-item active" id="my-header-avatar-item">
                        <div class="member-avatar-container">
                            <img id="header-avatar" class="member-avatar" src="" alt="Me">
                            <img id="header-lang-flag" class="member-flag" src="https://flagcdn.com/w20/ua.png" alt="flag">
                        </div>
                    </div>
                </div>
                <div class="add-member-btn" onclick="openStaffModal()" title="Добавить собеседника">+</div>
            </div>

            <div class="header-right-group">
                <div class="ui-header-right notranslate">GY-GY</div>
            </div>
        </div>

        <!-- ОКНО СООБЩЕНИЙ -->
        <div id="chat-messages" class="chat-messages"></div>

        <!-- НИЖНЯЯ ПАНЕЛЬ ВВОДА -->
        <div class="chat-input-bar">
            <div class="input-row">
                <input type="text" id="chat-input" class="chat-input" placeholder="Сообщение..." autocomplete="off" onkeypress="handleKeyPress(event)">
                
                <button class="send-btn" onclick="sendMessage(false)" title="Отправить в веб-чат">
                    <span>➔</span>
                    <span>Отправить</span>
                </button>

                <button class="send-tg-btn" onclick="sendMessage(true)" title="Отправить через Telegram">
                    <svg class="tg-icon" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.25.38-.51 1.07-.78 4.2-1.82 7-3.03 8.4-3.61 4-.16 4.83.53 4.78 2.47z"/>
                    </svg>
                    <span>Telegram</span>
                </button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО СОТРУДНИКОВ -->
    <div id="staff-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-title">СОТРУДНИКИ</div>
            <div id="staff-list" class="staff-list"></div>
            <button class="modal-close-btn" onclick="closeStaffModal()">ГОТОВО</button>
        </div>
    </div>

    <script>
        let allStaff = [
            { id: 1, name: "Александр В.", role: "CEO", lang: "ru", flagCode: "ru", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Alex" },
            { id: 2, name: "Elena Rostova", role: "Manager", lang: "en", flagCode: "gb", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Elena" },
            { id: 3, name: "Li Wei", role: "Dev", lang: "zh", flagCode: "cn", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Li" },
            { id: 4, name: "Carlos M.", role: "Analyst", lang: "es", flagCode: "es", avatar: "https://api.dicebear.com/7.x/bottts/svg?seed=Carlos" }
        ];

        let selectedStaffIds = new Set();
        let activeTargetMember = null;

        function getFlagUrl(code) {
            const countryCodes = {
                'ru': 'ru', 'en': 'gb', 'gb': 'gb', 'zh': 'cn', 'cn': 'cn', 'es': 'es', 'de': 'de', 'ua': 'ua', 'uk': 'ua'
            };
            const c = countryCodes[(code || 'ua').toLowerCase()] || 'ua';
            return `https://flagcdn.com/w20/${c}.png`;
        }

        document.addEventListener("DOMContentLoaded", function() {
            const savedAvatar = localStorage.getItem('gygy_avatar') || localStorage.getItem('gy_user_img') || localStorage.getItem('user_avatar');
            const avatarEl = document.getElementById('header-avatar');
            
            const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23000'/><circle cx='16' cy='12' r='5' fill='%23FFD700'/><path d='M6 28 c0-6 5-10 10-10 s10 4 10 10' fill='%23FFD700'/></svg>";
            if (avatarEl) {
                avatarEl.src = savedAvatar || defaultAvatar;
            }

            // Приоритет отдан украинской локали ('ua') и актуальным ключам из Офиса
            const savedLang = localStorage.getItem('gygy_lang') || 
                            localStorage.getItem('gy_lang') || 
                            localStorage.getItem('gygy_flag') || 
                            localStorage.getItem('user_flag') || 
                            localStorage.getItem('gy_user_flag') || 'ua';

            const flagEl = document.getElementById('header-lang-flag');
            if (flagEl) {
                flagEl.src = getFlagUrl(savedLang);
            }

            const savedStaff = localStorage.getItem('gygy_selected_staff');
            if (savedStaff) {
                try {
                    JSON.parse(savedStaff).forEach(id => selectedStaffIds.add(id));
                } catch(e) {}
            }

            renderStaffList();
            updateHeaderParticipants();
        });

        function openStaffModal() {
            const modal = document.getElementById('staff-modal');
            modal.style.display = 'flex';
            requestAnimationFrame(() => { modal.style.opacity = '1'; });
        }

        function closeStaffModal() {
            const modal = document.getElementById('staff-modal');
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }

        function renderStaffList() {
            const container = document.getElementById('staff-list');
            container.innerHTML = '';

            if (allStaff.length === 0) {
                container.innerHTML = '<div style="text-align:center; opacity:0.5; padding: 20px;">Список сотрудников пуст</div>';
                return;
            }

            allStaff.forEach(staff => {
                const item = document.createElement('div');
                item.className = 'staff-item';
                const isChecked = selectedStaffIds.has(staff.id) ? 'checked' : '';
                
                item.innerHTML = `
                    <div class="staff-info">
                        <div class="member-avatar-container">
                            <img src="${staff.avatar}" class="member-avatar">
                            <img src="${getFlagUrl(staff.flagCode)}" class="member-flag">
                        </div>
                        <div>
                            <div style="font-weight: 600;">${staff.name}</div>
                            <div style="font-size:10px;opacity:0.6">${staff.role}</div>
                        </div>
                    </div>
                    <div class="staff-actions">
                        <input type="checkbox" ${isChecked} onchange="toggleStaff(${staff.id})">
                        <button class="delete-staff-btn" onclick="deleteStaff(event, ${staff.id})" title="Удалить сотрудника">✕</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function toggleStaff(id) {
            if (selectedStaffIds.has(id)) {
                selectedStaffIds.delete(id);
            } else {
                selectedStaffIds.add(id);
            }
            localStorage.setItem('gygy_selected_staff', JSON.stringify(Array.from(selectedStaffIds)));
            updateHeaderParticipants();
        }

        function deleteStaff(event, id) {
            event.stopPropagation();
            allStaff = allStaff.filter(s => s.id !== id);
            selectedStaffIds.delete(id);
            localStorage.setItem('gygy_selected_staff', JSON.stringify(Array.from(selectedStaffIds)));
            
            if (activeTargetMember === id) {
                activeTargetMember = null;
            }

            renderStaffList();
            updateHeaderParticipants();
        }

        function updateHeaderParticipants() {
            const container = document.getElementById('header-participants');
            const myItem = document.getElementById('my-header-avatar-item');
            container.innerHTML = '';
            container.appendChild(myItem);

            selectedStaffIds.forEach(id => {
                const staff = allStaff.find(s => s.id === id);
                if (!staff) return;

                const item = document.createElement('div');
                item.className = `participant-item ${activeTargetMember === staff.id ? 'active' : ''}`;
                item.onclick = () => selectActiveMember(staff.id);
                item.title = staff.name;
                item.innerHTML = `
                    <div class="member-avatar-container">
                        <img src="${staff.avatar}" class="member-avatar" alt="${staff.name}">
                        <img src="${getFlagUrl(staff.flagCode)}" class="member-flag" alt="flag">
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function selectActiveMember(id) {
            activeTargetMember = activeTargetMember === id ? null : id;
            updateHeaderParticipants();
        }

        function sendMessage(isTelegram = false) {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const chatMessages = document.getElementById('chat-messages');
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg msg-outgoing';
            
            let tgBadgeHTML = isTelegram ? '<div class="msg-tg-badge">► Telegram</div>' : '';
            msgDiv.innerHTML = `${tgBadgeHTML}${escapeHtml(text)}<div class="msg-time">${timeStr}</div>`;

            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            input.value = '';

            if (activeTargetMember) {
                const staff = allStaff.find(s => s.id === activeTargetMember);
                if (staff) {
                    setTimeout(() => {
                        const replyDiv = document.createElement('div');
                        replyDiv.className = 'msg msg-incoming';
                        let replyBadge = isTelegram ? '<div class="msg-tg-badge">◄ Telegram Bot</div>' : '';
                        replyDiv.innerHTML = `
                            ${replyBadge}
                            <div class="msg-author">
                                <div class="member-avatar-container" style="width:20px;height:20px;">
                                    <img src="${staff.avatar}" class="member-avatar" style="width:20px;height:20px;border-width:1px;">
                                    <img src="${getFlagUrl(staff.flagCode)}" class="member-flag" style="width:10px;height:8px;bottom:-1px;right:-2px;">
                                </div>
                                ${staff.name}
                            </div>
                            Принято.
                            <div class="msg-time">${timeStr}</div>
                        `;
                        chatMessages.appendChild(replyDiv);
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }, 800);
                }
            }
        }

        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(false); }
        function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    </script>
</body>
</html>
