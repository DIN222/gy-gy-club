<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.6.25 - Переговорная</title>
    <!-- Подключение шрифтов -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --bg-dark: #000000;
            --panel-bg: #000000; /* Черный фон панелей */
            --accent-gold: #FFD700;
            --gold: #FFD700;
            --accent-gold-rgb: 255, 215, 0;
            --text-color: #ffffff;
            --message-other-bg: #1a1a1a; /* Чужие сообщения чуть светлее */
            --message-my-bg: #0d0e12;    /* Свои сообщения чуть темнее */
            --input-border: 1px solid rgba(var(--accent-gold-rgb), 0.3);
        }

        * { 
            -webkit-tap-highlight-color: transparent !important; 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }
        
        html, body { 
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 8px 12px; /* Отступы от краев экрана */
            gap: 8px;
        }

        /* КОМПАКТНАЯ ШАПКА (Взята из предыдущих файлов для сохранения стиля) */
        header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            background-color: var(--panel-bg);
            border: 1px solid rgba(var(--accent-gold-rgb), 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            flex-shrink: 0;
            gap: 10px;
        }

        .header-left-group { display: flex; align-items: center; }

        .ui-nav-arrows {
            display: flex; 
            gap: 8px; 
            font-size: 20px; 
            font-weight: 900 !important; 
            font-family: 'Share Tech Mono', monospace; 
            color: var(--gold); 
            line-height: 1; 
            letter-spacing: -2px; 
            user-select: none;
        }
        
        .arrow-item { 
            transition: opacity 0.2s, transform 0.2s, filter 0.2s; 
            text-decoration: none;
            color: var(--gold);
            display: inline-block;
        }
        
        .arrow-item:hover { filter: brightness(1.15); transform: scale(1.1); }

        .header-center-title {
            justify-self: center;
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .header-right-group {
            justify-self: end;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo {
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: filter 0.2s;
        }
        .header-logo:hover { filter: brightness(1.15); }

        /* ОСНОВНАЯ ОБЛАСТЬ ЧАТА */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border: 1px solid rgba(var(--accent-gold-rgb), 0.3);
            border-radius: 6px;
            overflow: hidden; /* Чтобы скроллбар был внутри */
        }

        /* Блок с сообщениями */
        #messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Скроллбар чата */
        #messages-area::-webkit-scrollbar { width: 4px; }
        #messages-area::-webkit-scrollbar-thumb { background: rgba(var(--accent-gold-rgb), 0.3); border-radius: 2px; }

        /* Элемент сообщения */
        .message-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            max-width: 85%;
        }

        .message-item.other { align-self: flex-start; }
        .message-item.my { align-self: flex-end; flex-direction: row-reverse; }

        /* Аватар в чате */
        .chat-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--accent-gold);
            flex-shrink: 0;
            object-fit: cover;
        }

        /* Пузырь сообщения */
        .message-content {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .message-item.other .message-content {
            background-color: var(--message-other-bg);
            border-top-left-radius: 0;
        }

        .message-item.my .message-content {
            background-color: var(--message-my-bg);
            border-top-right-radius: 0;
            border: 1px solid rgba(var(--accent-gold-rgb), 0.2);
        }

        .message-header {
            font-size: 10px;
            color: var(--accent-gold);
            margin-bottom: 4px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .message-item.my .message-header { justify-content: flex-end; }

        .message-time {
            font-size: 9px;
            color: #888;
            font-weight: normal;
        }

        /* ОБЛАСТЬ ВВОДА */
        .input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            background-color: var(--panel-bg);
            border-top: var(--input-border);
            flex-shrink: 0;
        }

        #message-input {
            flex: 1;
            background: #000;
            border: var(--input-border);
            color: var(--text-color);
            padding: 8px 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            border-radius: 4px;
            outline: none;
            resize: none; /* Если textarea */
            height: 36px; /* Фиксированная высота */
            line-height: 18px;
        }

        #message-input:focus { border-color: var(--accent-gold); }

        #send-btn {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 0 15px;
            height: 36px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 12px;
        }

        #send-btn:hover { 
            background: var(--accent-gold);
            color: #000;
            filter: brightness(1.15);
        }

        /* Техническое сообщение (например, о входе) */
        .system-message {
            text-align: center;
            font-size: 10px;
            color: #666;
            font-style: italic;
            padding: 5px 0;
        }

    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Шапка (Клубный стиль) -->
    <header>
        <div class="header-left-group">
            <div class="notranslate ui-nav-arrows">
                <a href="office.html" class="arrow-item" title="В Офис">&lt;</a>
            </div>
        </div>

        <div class="header-center-title notranslate">
            ПЕРЕГОВОРНАЯ №3
        </div>

        <div class="header-right-group">
            <div class="header-logo notranslate" onclick="location.href='index.html'">GY-GY</div>
        </div>
    </header>

    <!-- Область чата (Стиль традиционного чата) -->
    <div class="chat-container">
        <div id="messages-area">
            <!-- Пример системного сообщения -->
            <div class="system-message">--- Александр В. вошел в переговорную ---</div>

            <!-- Пример входящего сообщения (Собеседник) -->
            <div class="message-item other">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Elena" class="chat-avatar" alt="Avatar">
                <div>
                    <div class="message-header">Elena R. <span class="message-time">14:32</span></div>
                    <div class="message-content">Коллеги, добрый день. Мы готовы обсудить стратегию по Ателье?</div>
                </div>
            </div>

            <!-- Пример исходящего сообщения (Я) -->
            <div class="message-item my">
                <img id="my-avatar-i" src="" class="chat-avatar" alt="Avatar" style="display:none;">
                <div>
                    <div class="message-header"><span class="message-time">14:33</span> Я</div>
                    <div class="message-content">Привет. Да, готовы. Александр, запускай демонстрацию.</div>
                </div>
            </div>

             <!-- Еще одно входящее -->
            <div class="message-item other">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Alex" class="chat-avatar" alt="Avatar">
                <div>
                    <div class="message-header">Александр В. <span class="message-time">14:34</span></div>
                    <div class="message-content">Запускаю. Смотрите файл "Risks_v4.pdf".</div>
                </div>
            </div>

        </div>

        <!-- Область ввода -->
        <div class="input-area">
            <textarea id="message-input" placeholder="Введите сообщение..." rows="1"></textarea>
            <button id="send-btn" onclick="sendMessage()">ОТПРАВИТЬ</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Автоматическая подстановка моего аватара в шапке и в чате
            const savedAvatar = localStorage.getItem('gygy_avatar') || localStorage.getItem('gy_user_img');
            if (savedAvatar) {
                const myAvatarHeader = document.getElementById('my-avatar-i'); // В чате
                if (myAvatarHeader) {
                    myAvatarHeader.src = savedAvatar;
                    myAvatarHeader.style.display = 'block';
                }
            }

            // Авто-высота для textarea
            const textarea = document.getElementById('message-input');
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                if(this.scrollHeight > 100) { // Ограничение высоты
                    this.style.overflowY = "scroll";
                } else {
                    this.style.overflowY = "hidden";
                }
            });

            // Отправка по Enter (но не с новой строки)
            textarea.addEventListener('keypress', function (e) {
                if (e.which === 13 && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            scrollToBottom();
        });

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const messagesArea = document.getElementById('messages-area');
            
            // Создаем элемент сообщения
            const msgItem = document.createElement('div');
            msgItem.className = 'message-item my';

            // Получаем мой аватар
            const savedAvatar = localStorage.getItem('gygy_avatar') || localStorage.getItem('gy_user_img') || '';
            
            // Форматируем время
            const now = new Date();
            const timeStr = now.toTimeString().substring(0, 5);

            msgItem.innerHTML = `
                ${savedAvatar ? `<img src="${savedAvatar}" class="chat-avatar" alt="I">` : '<div class="chat-avatar" style="background:#333"></div>'}
                <div>
                    <div class="message-header"><span class="message-time">${timeStr}</span> Я</div>
                    <div class="message-content">${escapeHtml(text)}</div>
                </div>
            `;

            messagesArea.appendChild(msgItem);
            input.value = '';
            input.style.height = '36px'; // Сброс высоты поля
            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('messages-area');
            container.scrollTop = container.scrollHeight;
        }

        // Простая защита от XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
