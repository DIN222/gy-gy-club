<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GYGY Office v4.6.10 CORE</title>
    <!-- Подключение шрифтов по манифесту -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-dark: #000000;
            --panel-bg: #0d0e12;
            --accent-gold: #FFD700;
            --gold: #FFD700;
            --accent-gold-rgb: 255, 215, 0;
            --text-color: #e0e0e0;
        }

        * { 
            -webkit-tap-highlight-color: transparent !important; 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 15px;
        }

        /* НАВИГАЦИОННЫЕ СТРЕЛКИ (< и <<) В УГЛУ ПО СТАНДАРТУ MANIFEST */
        .ui-nav-arrows {
            position: fixed; 
            top: 15px; 
            left: 15px; 
            z-index: 9999999; 
            display: flex; 
            gap: 15px; 
            font-size: 26px; 
            font-weight: 900 !important; 
            font-family: 'Share Tech Mono', monospace; 
            cursor: pointer; 
            color: var(--gold); 
            line-height: 1; 
            letter-spacing: -2px; 
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            pointer-events: auto !important; 
            user-select: none;
        }
        
        .arrow-item { 
            transition: opacity 0.2s, transform 0.2s; 
            text-decoration: none;
            color: var(--gold);
            display: inline-block;
        }
        
        .arrow-item:hover { 
            opacity: 0.8; 
            transform: scale(1.1);
        }

        /* Шапка: строго без внешней рамки, сдвиг под фиксированные стрелки слева */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
            border: none;
            padding: 10px 20px 10px 95px;
            border-radius: 8px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        /* По центру: Паспорт юзера */
        header .header-center-user {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            margin: 0 auto;
        }

        .avatar-with-flag {
            position: relative;
            width: 36px;
            height: 36px;
        }

        #header-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            object-fit: cover;
        }

        #current-flag {
            position: absolute;
            bottom: -2px;
            right: -4px;
            width: 16px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid var(--bg-dark);
            object-fit: cover;
        }

        .user-nickname {
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 13px;
        }

        /* Справа: Логотип GY-GY */
        .header-logo {
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР ОФИСА */
        .office-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            overflow: hidden;
        }

        /* Две большие навигационные кнопки */
        .fullscreen-nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex-shrink: 0;
        }

        .nav-btn {
            background: var(--panel-bg);
            color: var(--accent-gold);
            border: 2px solid rgba(var(--accent-gold-rgb), 0.5);
            padding: 15px;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-btn.active {
            border-color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(var(--accent-gold-rgb), 0.25);
            filter: brightness(1.1);
        }

        .nav-btn:hover {
            border-color: var(--accent-gold);
            filter: brightness(1.1);
        }

        /* Схема офиса: 6 блоков Back-End управления */
        .office-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            flex: 1;
        }

        .office-room {
            background: var(--panel-bg);
            border: 1px solid rgba(var(--accent-gold-rgb), 0.3);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            text-align: center;
            font-size: 13px;
            color: #aaa;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .office-room:hover {
            border-color: var(--accent-gold);
            filter: brightness(1.1);
            color: var(--text-color);
        }

        /* Блок №1 — Выход в Холл (index.html) */
        .office-room.hall-room {
            border-color: rgba(var(--accent-gold-rgb), 0.5);
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
            font-weight: 600;
        }

        /* Блок №3 — Комната переговоров (Core Module) с интерактивной ссылкой */
        .office-room.meeting-room {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
            font-weight: bold;
            background: #121008;
            filter: brightness(1.05);
        }

        /* МОДАЛЬНОЕ ОКНО ПАСПОРТА */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10000;
        }

        .passport-card {
            background: var(--panel-bg);
            border: 2px solid var(--accent-gold);
            padding: 25px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
            position: relative;
            color: var(--text-color);
        }

        .passport-card img.avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            object-fit: cover;
            margin-bottom: 10px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: var(--accent-gold);
            cursor: pointer;
            font-size: 22px;
        }

        #pass-qr-box {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Навигационные стрелки: < в Холл (index.html), << к дверям входа -->
    <div class="notranslate ui-nav-arrows">
        <a href="index.html" class="arrow-item" title="В Холл">&lt;</a>
        <a href="index.html" class="arrow-item" title="К дверям входа в клуб">&lt;&lt;</a>
    </div>

    <!-- Шапка без рамки -->
    <header>
        <div class="header-center-user" onclick="openPassport()">
            <div class="avatar-with-flag">
                <img id="header-avatar" src="" alt="Avatar" style="display:none;">
                <img id="current-flag" src="https://flagcdn.com/w20/gb.png" alt="Flag">
            </div>
            <span id="header-nickname" class="user-nickname">@User</span>
        </div>
        <div class="header-logo notranslate">GY-GY</div>
    </header>

    <!-- Основной контент строго по размерам экрана -->
    <div class="office-container">
        <div class="fullscreen-nav">
            <button class="nav-btn active">1. Схема офиса</button>
            <a href="club-map.html" class="nav-btn">2. Схема клуба</a>
        </div>

        <div class="office-grid">
            <!-- Блок №1 ведет в Холл (index.html) -->
            <a href="index.html" class="office-room hall-room">Блок №1<br>Выход в Холл</a>
            <div class="office-room">Блок №2<br><small>Управление процессами</small></div>
            <!-- Блок №3 изменен на интерактивную ссылку-переход в meeting.html -->
            <a href="meeting.html" class="office-room meeting-room">Блок №3<br>Комната переговоров</a>
            <div class="office-room">Блок №4<br><small>Проектный Отдел</small></div>
            <div class="office-room">Блок №5<br><small>Технический Сектор</small></div>
            <div class="office-room">Блок №6<br><small>Безопасность и ID</small></div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПАСПОРТА -->
    <div id="modal-passport" class="modal">
        <div class="passport-card">
            <span class="close-btn" onclick="closePassport()">&times;</span>
            <img id="pass-avatar-img" class="avatar" src="" alt="Avatar">
            <h3 id="pass-nickname" style="margin: 5px 0; color: var(--accent-gold); font-family: 'Cinzel', serif;">@User</h3>
            <p id="pass-email" style="font-size: 13px; color: #aaa; margin-bottom: 15px;">user@example.com</p>
            <p style="font-size: 14px; margin: 5px 0;"><strong>ID:</strong> <span id="pass-id-val">GY-000000</span></p>
            <div id="pass-qr-box"></div>
        </div>
    </div>

    <script>
        function openPassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) { 
                modal.style.display = 'flex'; 
                requestAnimationFrame(() => { modal.style.opacity = '1'; });
            }
        }

        function closePassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) {
                modal.style.opacity = '0';
                setTimeout(() => { modal.style.display = 'none'; }, 300);
            }
        }

        function renderUserPassport(targetID) {
            const passIdVal = document.getElementById('pass-id-val');
            const passQrBox = document.getElementById('pass-qr-box');
            if (passIdVal) passIdVal.innerText = targetID;
            if (passQrBox && typeof QRCode !== 'undefined') { 
                passQrBox.innerHTML = ""; 
                new QRCode(passQrBox, { text: targetID, width: 90, height: 90 }); 
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const savedAvatar = localStorage.getItem('gygy_avatar') || localStorage.getItem('gy_user_img') || localStorage.getItem('user_avatar');
            const headerAvatarEl = document.getElementById('header-avatar');
            const passAvatarEl = document.getElementById('pass-avatar-img');
            
            const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23000'/><circle cx='16' cy='12' r='5' fill='%23FFD700'/><path d='M6 28 c0-6 5-10 10-10 s10 4 10 10' fill='%23FFD700'/></svg>";
            const currentAvatar = savedAvatar || defaultAvatar;

            if (headerAvatarEl) { headerAvatarEl.src = currentAvatar; headerAvatarEl.style.display = 'block'; }
            if (passAvatarEl) { passAvatarEl.src = currentAvatar; }

            const savedNickname = localStorage.getItem('gygy_nickname') || localStorage.getItem('gy_user_name');
            if (savedNickname) {
                const nickText = '@' + savedNickname.replace(/^@/, '');
                document.getElementById('pass-nickname').innerText = nickText;
                document.getElementById('header-nickname').innerText = nickText;
            }

            const savedEmail = localStorage.getItem('gygy_email');
            if (savedEmail) document.getElementById('pass-email').innerText = savedEmail;

            let currentID = localStorage.getItem('gygy_id') || localStorage.getItem('gy_user_id') || "GY-" + Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem('gygy_id', currentID);
            renderUserPassport(currentID);

            const savedFlag = localStorage.getItem('gygy_flag') || localStorage.getItem('gy_user_flag') || 'gb';
            const flagElement = document.getElementById('current-flag');
            if (flagElement) {
                flagElement.src = `https://flagcdn.com/w20/${savedFlag.toLowerCase()}.png`;
            }
        });
    </script>
</body>
</html>
