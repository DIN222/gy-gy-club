<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ателье «Конь в пальто» — GY-GY Club</title>
  <!-- Three.js для 3D-модели/визуализации -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --bg-dark: #121214;
      --panel-bg: rgba(24, 24, 27, 0.85);
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #e11d48;
      --border: rgba(212, 175, 55, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* ШАПКА КЛУБА */
    header {
      height: 60px; background: #09090b; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 10;
    }
    .brand-area { display: flex; align-items: center; gap: 12px; }
    /* Иконка Коня вместо скейта */
    .brand-logo-btn {
      width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--gold);
      background: url('horse_welcome.png') center/cover no-repeat; cursor: pointer;
      transition: transform 0.2s;
    }
    .brand-logo-btn:hover { transform: scale(1.08); }
    .brand-title { font-size: 18px; font-weight: 700; color: var(--gold-light); letter-spacing: 0.5px; }

    .nav-buttons { display: flex; gap: 10px; }
    .nav-btn {
      background: transparent; border: 1px solid var(--border); color: var(--text-main);
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s;
    }
    .nav-btn:hover { border-color: var(--gold); color: var(--gold-light); }

    /* ОСНОВНОЙ КОНТЕЙНЕР */
    .workspace { display: flex; flex: 1; height: calc(100vh - 60px); position: relative; }

    /* ПАНЕЛЬ УПРАВЛЕНИЯ (Слева) */
    .control-panel {
      width: 420px; background: var(--panel-bg); backdrop-filter: blur(12px);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      padding: 20px; gap: 16px; overflow-y: auto; z-index: 5;
    }

    .group { display: flex; flex-direction: column; gap: 8px; }
    .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); font-weight: 600; }

    /* Кнопки-селекторы (единый компактный стиль без визуального шума) */
    .select-dropdown-box {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px; display: flex; justify-content: space-between;
      align-items: center; cursor: pointer; transition: border-color 0.2s;
    }
    .select-dropdown-box:hover { border-color: var(--gold); }
    .select-current-val { font-size: 14px; font-weight: 500; color: var(--text-main); }

    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-option {
      flex: 1; min-width: 70px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border);
      color: var(--text-muted); padding: 8px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
      text-align: center; transition: all 0.2s;
    }
    .btn-option.active { background: var(--gold); color: #000; font-weight: 600; border-color: var(--gold); }

    /* Цветовые палитры */
    .color-swatches { display: flex; gap: 10px; }
    .swatch-btn {
      flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 6px;
      padding: 6px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: var(--text-muted);
    }
    .swatch-btn.active { border-color: var(--gold); color: var(--text-main); background: rgba(212,175,55,0.1); }
    .swatch-circle { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3); }
    .swatch-circle.white { background: #ffffff; }
    .swatch-circle.black { background: #18181b; }

    /* Зона загрузки файлов */
    .file-upload {
      border: 1px dashed var(--border); border-radius: 8px; padding: 12px; text-align: center;
      background: rgba(0,0,0,0.2); cursor: pointer; position: relative; transition: border-color 0.2s;
    }
    .file-upload:hover { border-color: var(--gold); }
    .file-upload input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    #upload-label { font-size: 13px; color: var(--gold-light); }

    /* Смета */
    .summary-card { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .summary-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); }
    .summary-row.total { font-weight: 700; color: var(--gold-light); font-size: 15px; border-top: 1px solid var(--border); padding-top: 6px; margin-top: 2px; }

    /* Кнопка заказа */
    .btn-submit {
      background: linear-gradient(135deg, var(--gold), #b8860b); color: #000; font-weight: 700;
      border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 14px; text-transform: uppercase;
      letter-spacing: 0.5px; transition: opacity 0.2s;
    }
    .btn-submit:hover { opacity: 0.9; }

    /* КАНВАС ДЛЯ 3D И ВИЗУАЛА (Справа) */
    #canvas-container { flex: 1; height: 100%; position: relative; background: radial-gradient(circle at center, #1e1e24 0%, #0d0d0f 100%); }
  </style>
</head>
<body>

  <header>
    <div class="brand-area">
      <!-- Иконка Коня на кнопке названия -->
      <button class="brand-logo-btn" id="btn-nav-door" title="В клуб GY-GY"></button>
      <div class="brand-title">Ателье «Конь в пальто»</div>
    </div>
    <div class="nav-buttons">
      <button class="nav-btn" id="btn-nav-back">↩ Назад</button>
    </div>
  </header>

  <div class="workspace">
    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div class="control-panel">

      <!-- Выбор одежды (Выпадающий список / селектор) -->
      <div class="group">
        <div class="section-title">Изделие</div>
        <select id="apparel-type" class="select-dropdown-box" style="width: 100%; background: #18181b; color: var(--text-main); border: 1px solid var(--border); border-radius: 8px; padding: 10px;">
          <option value="tshirt">Футболка классика</option>
          <option value="hoodie">Худи с капюшоном</option>
          <option value="sweatshirt">Свитшот оверсайз</option>
        </select>
      </div>

      <!-- Гендер / Силуэт -->
      <div class="group">
        <div class="section-title">Силуэт</div>
        <div class="btn-group" id="group-gender">
          <button class="btn-option active" data-val="male" data-file="man.png">Мужской</button>
          <button class="btn-option" data-val="female" data-file="woman.png">Женский</button>
          <button class="btn-option" data-val="child" data-file="child.png">Детский</button>
        </div>
      </div>

      <!-- Размер -->
      <div class="group">
        <div class="section-title">Размер</div>
        <div class="btn-group" id="group-size"></div>
      </div>

      <!-- Динамические параметры ткани/горловины -->
      <div id="dynamic-params"></div>

      <!-- Цвет -->
      <div class="group">
        <div class="section-title">Цвет ткани</div>
        <div class="color-swatches" id="group-color">
          <button class="swatch-btn active" data-color="white"><span class="swatch-circle white"></span> Белый</button>
          <button class="swatch-btn" data-color="black"><span class="swatch-circle black"></span> Черный</button>
        </div>
      </div>

      <!-- Ракурс -->
      <div class="group">
        <div class="section-title">Ракурс примерки</div>
        <div class="btn-group" id="group-view">
          <button class="btn-option active" data-view="front">Спереди (Грудь)</button>
          <button class="btn-option" data-view="back">Сзади (Спина)</button>
        </div>
      </div>

      <!-- Загрузка файла PNG -->
      <div class="group">
        <div class="section-title">Принт</div>
        <div class="file-upload">
          <input type="file" id="print-input" accept="image/png">
          <span id="upload-label">📁 Загрузить свой PNG в клуб</span>
        </div>
      </div>

      <!-- Смета -->
      <div class="group">
        <div class="section-title">Расчет сметы</div>
        <div class="summary-card">
          <div class="summary-row"><span>Основа:</span><span id="price-fabric">1 200 ₽</span></div>
          <div class="summary-row"><span>Нанесение:</span><span id="price-extra">+0 ₽</span></div>
          <div class="summary-row total"><span>Итого:</span><span id="price-total">1 200 ₽</span></div>
        </div>
      </div>

      <!-- Заказ -->
      <div class="group">
        <button class="btn-submit" id="btn-submit-order">Подтвердить заказ в клубе</button>
      </div>

    </div>

    <!-- 3D КАНВАС -->
    <div id="canvas-container"></div>
  </div>

  <script>
    /* ========================================================
       SUPABASE CONFIGURATION (Подключаем базу данных и Storage)
       ======================================================== */
    const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // Заменишь на свой ключ
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient = window.supabase ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    // Навигация
    document.getElementById('btn-nav-back').addEventListener('click', () => {
      if (window.history.length > 1) window.history.back();
      else window.location.href = 'studio.html';
    });
    document.getElementById('btn-nav-door').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    // Three.js сценический контур
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    const adultSizes = ['XS', 'S', 'M', 'L', 'XL', '2XL'];
    const childSizes = ['104', '116', '128', '140', '152'];

    const state = {
      apparelType: 'tshirt',
      mannequinFile: 'man.png',
      gender: 'male',
      size: 'M',
      color: 'white',
      view: 'front',
      basePrice: 1200,
      extraPrice: 0,
      frontPrint: { scale: 0.32, posY: 0.12, texture: null },
      backPrint: { scale: 0.32, posY: 0.12, texture: null }
    };

    const textureLoader = new THREE.TextureLoader();
    const atelierGroup = new THREE.Group();
    scene.add(atelierGroup);

    const printMaterial = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, alphaTest: 0.02, depthWrite: false });

    const apparelConfigs = {
      tshirt: { basePrice: 1200, html: `<div class="btn-group" id="group-fabric"><button class="btn-option active" data-price="1200">Хлопок</button><button class="btn-option" data-price="1400">Стрейч</button></div>` },
      hoodie: { basePrice: 3200, html: `<div class="btn-group" id="group-fabric"><button class="btn-option active" data-price="3200">Без начеса</button><button class="btn-option" data-price="3600">С начесом</button></div>` },
      sweatshirt: { basePrice: 2500, html: `<div class="btn-group" id="group-fabric"><button class="btn-option active" data-price="2500">320 г/м²</button><button class="btn-option" data-price="2900">400 г/м²</button></div>` }
    };

    function updateSizeButtons() {
      const sizeContainer = document.getElementById('group-size');
      const sizes = (state.gender === 'child') ? childSizes : adultSizes;
      sizeContainer.innerHTML = sizes.map((sz, index) => {
        const isActive = (state.size === sz) || (index === 2 && !sizes.includes(state.size));
        if (isActive) state.size = sz;
        return `<button class="btn-option ${isActive ? 'active' : ''}" data-val="${sz}">${sz}</button>`;
      }).join('');
      sizeContainer.querySelectorAll('.btn-option').forEach(btn => {
        btn.addEventListener('click', (e) => {
          sizeContainer.querySelectorAll('.btn-option').forEach(b => b.classList.remove('active'));
          e.currentTarget.classList.add('active');
          state.size = e.currentTarget.dataset.val;
        });
      });
    }

    function renderDynamicParams() {
      const config = apparelConfigs[state.apparelType];
      document.getElementById('dynamic-params').innerHTML = `<div class="section-title">Материал</div>` + config.html;
      state.basePrice = config.basePrice;
      updatePricing();
    }

    function buildModel() {
      while(atelierGroup.children.length > 0) {
        const obj = atelierGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        atelierGroup.remove(obj);
      }
      atelierGroup.rotation.y = (state.view === 'back') ? Math.PI : 0;

      textureLoader.load(state.mannequinFile, (texture) => {
        const manMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false });
        const mannequinMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.8), manMat);
        atelierGroup.add(mannequinMesh);
      });

      const currentPrint = (state.view === 'front') ? state.frontPrint : state.backPrint;
      printMaterial.map = currentPrint.texture;
      printMaterial.opacity = currentPrint.texture ? 0.98 : 0;
      printMaterial.needsUpdate = true;

      const printMesh = new THREE.Mesh(new THREE.PlaneGeometry(currentPrint.scale, currentPrint.scale), printMaterial);
      printMesh.position.set(0, currentPrint.posY, (state.view === 'front') ? 0.01 : -0.01);
      atelierGroup.add(printMesh);
    }

    function updatePricing() {
      let total = state.basePrice + state.extraPrice;
      document.getElementById('price-fabric').innerText = state.basePrice.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('price-total').innerText = total.toLocaleString('ru-RU') + ' ₽';
    }

    // Загрузка PNG с сохранением в Supabase Storage (опционально)
    document.getElementById('print-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('upload-label').innerText = '✓ ' + file.name.substring(0, 14);

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const texture = new THREE.Texture(img);
          texture.needsUpdate = true;
          if (state.view === 'front') state.frontPrint.texture = texture;
          else state.backPrint.texture = texture;
          buildModel();
        };
      };
      reader.readAsDataURL(file);

      // Если Supabase подключен, можно отправить в Storage
      if (supabaseClient) {
        // const { data, error } = await supabaseClient.storage.from('prints').upload(`public/${file.name}`, file);
      }
    });

    document.getElementById('apparel-type').addEventListener('change', (e) => {
      state.apparelType = e.target.value;
      renderDynamicParams();
      buildModel();
    });

    document.querySelectorAll('#group-gender .btn-option').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('#group-gender .btn-option').forEach(b => b.classList.remove('active'));
        e.currentTarget.classList.add('active');
        state.gender = e.currentTarget.dataset.val;
        state.mannequinFile = e.currentTarget.dataset.file;
        updateSizeButtons();
        buildModel();
      });
    });

    updateSizeButtons();
    renderDynamicParams();
    buildModel();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
