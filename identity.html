<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Identity — Onboarding</title>
    <!-- Библиотека для QR-кода -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0b0b0b; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #161616; border: 1px solid #333; border-radius: 12px; padding: 30px; max-width: 450px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .avatar-box { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 20px auto; border: 2px dashed #666; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #222; cursor: pointer; position: relative; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .input-field { width: 100%; padding: 12px 15px; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 16px; margin-bottom: 20px; text-align: center; }
        .btn { background: #d4af37; color: #000; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; width: 100%; text-transform: uppercase; transition: background 0.3s; }
        .btn:hover { background: #f1c40f; }
        .btn.disabled { background: #444; color: #888; cursor: not-allowed; }
        #qrcode-container { margin: 20px auto; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Resident Identity</h2>
        <p style="color: #888; margin: 10px 0 20px 0; font-size: 14px;">Set up your profile to generate your official Club Passport.</p>
        
        <div class="avatar-box" onclick="document.getElementById('file-input').click()">
            <span id="txt-photo" style="font-size: 12px; color: #888;">Add Photo</span>
            <img id="avatar-preview" src="" alt="Avatar">
        </div>
        <input type="file" id="file-input" style="display:none;" accept="image/*" onchange="handleAvatarSelect(this)">

        <input type="text" id="input-nickname" class="input-field" placeholder="Enter your nickname..." oninput="handleNicknameInput(this.value)">

        <div id="qrcode-container"></div>
        <p id="id-display" style="font-family: monospace; color: #d4af37; margin-bottom: 20px;"></p>

        <button id="btn-enter-hall" class="btn disabled" onclick="proceedToHall()">Enter Hall</button>
    </div>

    <!-- Подключаем ядро -->
    <script src="core/storage.js"></script>
    <script>
        let currentAvatarBase64 = "";

        document.addEventListener("DOMContentLoaded", () => {
            // Инициализация ID
            const residentId = GyStorage.generateIdIfNeeded();
            document.getElementById('id-display').innerText = residentId;

            // Генерация QR-кода на основе ID
            new QRCode(document.getElementById("qrcode-container"), {
                text: residentId,
                width: 100,
                height: 100,
                colorDark: "#ffffff",
                colorLight: "#161616",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Загрузка сохраненных данных, если они есть
            const resident = GyStorage.getResident();
            if (resident.name) {
                document.getElementById('input-nickname').value = resident.name;
            }
            if (resident.avatar) {
                currentAvatarBase64 = resident.avatar;
                const img = document.getElementById('avatar-preview');
                img.src = resident.avatar;
                img.style.display = 'block';
                document.getElementById('txt-photo').style.display = 'none';
                document.getElementById('btn-enter-hall').classList.remove('disabled');
            }
        });

        function handleAvatarSelect(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentAvatarBase64 = e.target.result;
                    const img = document.getElementById('avatar-preview');
                    img.src = currentAvatarBase64;
                    img.style.display = 'block';
                    document.getElementById('txt-photo').style.display = 'none';

                    GyStorage.saveResident({ avatar: currentAvatarBase64 });
                    checkReadyState();
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function handleNicknameInput(val) {
            GyStorage.saveResident({ name: val });
            checkReadyState();
        }

        function checkReadyState() {
            const nickname = document.getElementById('input-nickname').value.trim();
            const btn = document.getElementById('btn-enter-hall');
            if (nickname && currentAvatarBase64) {
                btn.classList.remove('disabled');
            } else {
                btn.classList.add('disabled');
            }
        }

        function proceedToHall() {
            const nickname = document.getElementById('input-nickname').value.trim();
            if (!nickname || !currentAvatarBase64) {
                alert("Please add your avatar and nickname first.");
                return;
            }
            window.location.href = 'hall.html';
        }
    </script>
</body>
</html>
