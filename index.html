<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Identity — Gateway</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            background-color: #0b0b0b;
            color: #fff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .block {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .block.active {
            display: flex;
        }

        /* 1. Входная группа: аккуратная пропорциональная дверь */
        #block-entrance {
            background-color: #080808;
            background-image: url('door_1.jpg?v=2026.8');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: contain; /* Дверь сохраняет пропорции и не выглядит гигантской */
            cursor: pointer;
        }

        /* Деликатный минималистичный указатель внизу */
        .door-hint {
            position: absolute;
            bottom: 40px;
            font-size: 13px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            transition: color 0.3s;
            pointer-events: none;
        }

        #block-entrance:hover .door-hint {
            color: #d4af37;
        }

        /* 2. Приветствие перед переходом на identity.html */
        #block-welcome {
            background: #111;
        }

        .welcome-card {
            background: #161616;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .btn {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn:hover { background: #f1c40f; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Входная группа (кликабельна вся область двери) -->
    <div id="block-entrance" class="block active" onclick="goToWelcome()">
        <div class="door-hint">Touch to enter</div>
    </div>

    <!-- ЭКРАН 2: Приветствие диспетчера -->
    <div id="block-welcome" class="block">
        <div class="welcome-card">
            <h2>Resident Verification</h2>
            <p style="color: #888; margin: 15px 0; font-size: 14px;">Preparing secure session...</p>
            <button class="btn" onclick="proceedToIdentity()">Proceed</button>
        </div>
    </div>

    <!-- Подключаем скрипты ядра и навигации -->
    <script src="core/storage.js"></script>
    <script src="navigation.js"></script>
    <script>
        function goToWelcome() {
            document.getElementById('block-entrance').classList.remove('active');
            document.getElementById('block-welcome').classList.add('active');
        }

        function proceedToIdentity() {
            window.location.href = 'identity.html';
        }
    </script>
</body>
</html>
