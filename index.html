<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v7.0.2 CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #FFD700; --door-wood: #3E2723; --violet: #8A2BE2; --neon-glow: rgba(138, 43, 226, 0.6); }
        
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        body, button, input, div, img, span { pointer-events: auto !important; }
        img { -webkit-user-drag: none !important; }

        html, body { 
            width: 100%; height: 100%; background: #000000; color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin: 0; padding: 0;
        }
        
        button, .ui-user-badge, .arrow-item, .painting-zone, #main-door, .box-final, .nickname-square {
            transition: all 0.3s ease !important;
        }
        button:hover, .ui-user-badge:hover, .arrow-item:hover, .painting-zone:hover, #main-door:hover, .box-final:hover, .nickname-square:hover {
            filter: brightness(1.1);
        }

        .ui-header-right { 
            position: fixed; top: 18px; right: 25px; z-index: 1000000; 
            font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif;
            text-shadow: -1px -1px 0 #000000, 1px -1px 0 #000000, -1px 1px 0 #000000, 1px 1px 0 #000000;
        }
        
        .ui-user-badge {
            position: fixed; top: 4px; left: 50%; transform: translateX(-50%);
            width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--gold); background: #111111;
            box-shadow: 0 0 0 1px #000000, inset 0 0 5px rgba(0,0,0,0.8); z-index: 1000000; cursor: pointer; display: none;
        }
        .ui-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background-color: #ffffff; }
        .ui-user-badge .badge-flag {
            position: absolute; bottom: -2px; right: -4px; width: 14px; height: 10px; object-fit: cover;
            border: 1px solid var(--gold); box-shadow: 0 0 0 1px #000000;
        }

        .club-lang-dropdown-wrapper {
            position: absolute; top: 18px; left: 20px; z-index: 1000001; width: 155px; font-family: 'Share Tech Mono', monospace;
        }
        .club-lang-current {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold); padding: 5px 8px; border-radius: 10px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.9); width: 100%;
        }
        .club-lang-current-content { display: flex; align-items: center; gap: 7px; min-width: 0; }
        .club-lang-current .item-avatar {
            width: 20px; height: 20px; border-radius: 50%; overflow: hidden; border: 1px solid var(--gold); background: #111; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .club-lang-current .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .club-lang-current .item-flag { width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
        .club-lang-current .item-text { color: var(--gold); font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .club-lang-current .arrow-down { color: var(--gold); font-size: 10px; font-weight: bold; flex-shrink: 0; }

        .club-lang-list {
            position: absolute; top: calc(100% + 5px); left: 0;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold); border-radius: 10px; width: 100%; max-height: 260px; overflow-y: auto;
            display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.9); z-index: 1000002;
        }
        .club-lang-list.open { display: block; }
        
        .club-lang-item {
            display: flex; align-items: center; gap: 7px; padding: 6px 8px; cursor: pointer; border-bottom: 1px solid rgba(255,215,0,0.15); transition: background 0.2s;
        }
        .club-lang-item:last-child { border-bottom: none; }
        .club-lang-item:hover { background: rgba(255,215,0,0.15); }
        .club-lang-item .item-avatar { width: 20px; height: 20px; border-radius: 50%; overflow: hidden; border: 1px solid var(--gold); background: #111; flex-shrink: 0; }
        .club-lang-item .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .club-lang-item .item-flag { width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
        .club-lang-item .item-text { color: var(--gold); font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .passport-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .passport-card { background: #F5F5DC; border: 3px solid var(--gold); border-radius: 16px; padding: 25px; width: 280px; color: #000000; text-align: center; box-shadow: 0 0 25px rgba(0,0,0,0.5); position: relative; }
        .passport-card .box-final { margin: 15px auto; border-color: #000000; }
        .passport-close-btn { position: absolute; top: 10px; right: 14px; font-size: 28px; font-weight: bold; color: #000000; cursor: pointer; line-height: 1; user-select: none; }

        .block { 
            position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000000; z-index: 10; opacity: 0; transition: opacity 1.2s ease-in-out; 
        }
        .block.active { display: flex !important; opacity: 1 !important; z-index: 5000 !important; }

        .quote-text { font-family: 'Cormorant Garamond', 'Playfair Display', serif; font-style: italic; font-size: 20px; text-align: center; max-width: 85%; margin-bottom: 8px; text-shadow: 2px 2px 4px #000000; }
        .btn-gy { min-width: 240px; padding: 10px 18px; background: #000000; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 700; margin: 4px 0; font-family: 'Montserrat', 'Cinzel', sans-serif; font-size: 12px; }
        
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; cursor: not-allowed; }
        .box-final { width: 75px; height: 75px; border: 2px solid var(--gold); background: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }

        .identity-grid-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; width: 250px; }
        .identity-grid-row { display: flex; gap: 8px; justify-content: center; }
        .nickname-square {
            width: 75px; height: 75px; border: 2px solid var(--gold); background: #ffffff; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; color: #000000; padding: 4px; text-align: center;
        }
        .nickname-square.selected { border-color: #ffffff; box-shadow: 0 0 10px var(--gold); }
        .nickname-square input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: none; background: transparent; }

        #block-welcome { justify-content: center !important; padding-top: 0 !important; }
        #block-welcome img { max-height: 22vh !important; width: auto; object-fit: contain; margin: 6px 0 !important; filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)); }
        #block-welcome .welcome-title-elem { font-size: 24px !important; font-weight: 700; letter-spacing: 8px; font-style: italic; margin-bottom: 6px !important; font-family: 'Cinzel', serif; }

        .ui-nav-arrows {
            position: fixed; top: 18px; left: 20px; z-index: 9999999; display: flex; gap: 15px; font-size: 24px; font-weight: 900 !important; 
            font-family: 'Share Tech Mono', monospace; cursor: pointer; color: var(--gold); line-height: 1; letter-spacing: -2px; 
            background: transparent !important; border: none !important; text-shadow: -1px -1px 0 #000000, 1px -1px 0 #000000, -1px 1px 0 #000000, 1px 1px 0 #000000; pointer-events: auto !important; user-select: none;
        }
        .arrow-item { transition: opacity 0.2s, transform 0.2s; background: transparent !important; border: none !important; }
        .arrow-item:hover { opacity: 0.8; transform: scale(1.1); }

        #block-hall { background: url('hall_bg_jpg.jpg') center/cover no-repeat #000000; }
        .hall-interior { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
        .hall-interior .quote-text { 
            position: absolute; top: 10vh; left: 50%; transform: translateX(-50%); width: 85%; margin: 0; text-align: center; padding: 0; background: transparent !important; color: var(--gold) !important; font-size: 24px; font-weight: 700; -webkit-text-stroke: 1px #000000; text-stroke: 1px #000000;
        }
        .hall-door-target { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 24vw; height: 60vh; cursor: pointer; z-index: 5; background: transparent; }
        .painting-zone { position: absolute; top: 25vh; width: 6vw; height: 12vh; cursor: pointer; z-index: 6; background: transparent; display: flex; align-items: center; justify-content: center; }
        .painting-left { left: 23vw; }
        .painting-right { right: 23vw; }

        .cue-arrow-hall { color: var(--violet); font-size: 34px; font-weight: 900; font-family: 'Share Tech Mono', monospace; text-shadow: 0 0 12px var(--violet), 0 0 20px var(--violet); pointer-events: none; user-select: none; z-index: 10; transition: opacity 0.2s; }
        .painting-zone:hover .cue-arrow-hall { opacity: 0.8; }

        .manifest-btn-box { position: absolute; bottom: -45px; left: 50%; transform: translateX(-50%); width: 130px; display: flex; flex-direction: column; gap: 5px; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s, bottom 0.4s; z-index: 10; }
        .btn-manifest { width: 100%; padding: 5px 0; font-size: 11px; margin: 0; background: #000000; box-shadow: 0 4px 10px rgba(0,0,0,0.9); }
        
        .goog-te-banner-frame, .skiptranslate, iframe.goog-te-menu-frame { display: none !important; }
        body { top: 0 !important; background-color: #000000 !important; opacity: 0; transition: opacity 1.2s ease-in-out !important; }
        body.page-loaded { opacity: 1 !important; }
        
        font { background-color: transparent !important; background: transparent !important; color: inherit !important; box-shadow: none !important; text-shadow: none !important; }
        .goog-text-highlight { background-color: transparent !important; background: transparent !important; box-shadow: none !important; color: inherit !important; }
        .btn-gy font, .quote-text font, .ui-header-right font { color: inherit !important; }
        
        #main-door { display: block; height: 48vh; max-height: 400px; width: auto; max-width: 100%; object-fit: contain; margin: 0 auto; transform: scale(1); transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease-out; cursor: pointer; }
        .door-exploded { transform: scale(3.5) !important; opacity: 0 !important; }
    </style>
</head>

    <script type="text/javascript">
        let currentID = "";
        let currentUserImage = "";
        let currentBlockId = 'block-entrance';
        let selectedNickType = 'own';
        let userChosenNickname = '';

        function toggleLangDropdown() {
            const list = document.getElementById('club-lang-list');
            if (list) list.classList.toggle('open');
        }

        function selectClubLanguage(langCode, langName, flagUrl) {
            GyLocalization.selectLanguage(langCode, langName, flagUrl, () => {
                GyLocalization.renderDropdownItems('club-lang-list', selectClubLanguage);
                document.getElementById('club-lang-list').classList.remove('open');
            });
        }

        window.addEventListener('click', (e) => {
            const wrapper = document.querySelector('.club-lang-dropdown-wrapper');
            const list = document.getElementById('club-lang-list');
            if (wrapper && list && !wrapper.contains(e.target)) {
                list.classList.remove('open');
            }
        });

        function setNickType(type) {
            selectedNickType = type;
            const boxOwn = document.getElementById('box-own-nick');
            const boxClub = document.getElementById('box-club-nick');
            if (type === 'own') {
                boxOwn.classList.add('selected');
                boxClub.classList.remove('selected');
            } else {
                boxClub.classList.add('selected');
                boxOwn.classList.remove('selected');
            }
        }

        function updateNicknameValue(val, type) {
            if (type === 'own') {
                userChosenNickname = val;
                GyStorage.set('gygy_nickname', val);
            }
        }

        function toggleManifest(boxId) {
            document.querySelectorAll('.manifest-btn-box').forEach(box => {
                if(box.id === boxId) {
                    const isOpened = box.getAttribute('data-opened') === "true";
                    box.style.opacity = isOpened ? "0" : "1";
                    box.style.pointerEvents = isOpened ? "none" : "auto";
                    box.setAttribute('data-opened', isOpened ? "false" : "true");
                    box.style.bottom = isOpened ? "-45px" : "-32px";
                } else {
                    box.style.opacity = "0"; box.style.pointerEvents = "none"; box.setAttribute('data-opened', "false"); box.style.bottom = "-45px";
                }
            });
        }

        function renderUserPassports(targetID) {
            const idLabel = document.getElementById('id-label');
            const passIdVal = document.getElementById('pass-id-val');
            const qrBoxReg = document.getElementById('qr-box-reg');
            const passQrBox = document.getElementById('pass-qr-box');
            
            if (idLabel) idLabel.innerText = targetID;
            if (passIdVal) passIdVal.innerText = targetID;
            
            if (qrBoxReg && typeof QRCode !== 'undefined') { 
                qrBoxReg.innerHTML = ""; 
                new QRCode(qrBoxReg, { text: targetID, width: 75, height: 75 }); 
            }
            if (passQrBox && typeof QRCode !== 'undefined') { 
                passQrBox.innerHTML = ""; 
                new QRCode(passQrBox, { text: targetID, width: 90, height: 90 }); 
            }

            let clubNick = GyStorage.get('gygy_club_nick');
            if (!clubNick) {
                const coolNicks = ["БигКоин", "Нападающий", "Шампань", "Магнат", "Счастливчик", "Инсайдер", "Фантом", "Победитель", "Капитан", "Маэстро", "Прайм", "Штурман", "Панчер", "Триумф", "Оракул"];
                clubNick = coolNicks[Math.floor(Math.random() * coolNicks.length)];
                GyStorage.set('gygy_club_nick', clubNick);
            }

            const clubNickLabel = document.getElementById('club-nick-label');
            if (clubNickLabel) clubNickLabel.innerText = clubNick;
        }

        function checkAndFillRegistrationForm() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                if (tgUser.first_name) {
                    GyStorage.set('gygy_nickname', tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : ''));
                }
            }

            const savedAvatar = GyStorage.get('gy_user_img') || GyStorage.get('gygy_avatar');
            currentID = GyStorage.get('gygy_id') || GyStorage.get('gy_user_id') || GyStorage.get('gy_trace');

            if (currentID) { renderUserPassports(currentID); }

            const savedNickname = GyStorage.get('gygy_nickname') || '';
            const ownNickInput = document.getElementById('input-own-nick');
            if (ownNickInput && savedNickname) {
                ownNickInput.value = savedNickname;
                userChosenNickname = savedNickname;
            }

            if (savedAvatar) {
                currentUserImage = savedAvatar;
                const badgeImg = document.getElementById('badge-avatar-img');
                const passImg = document.getElementById('pass-avatar-img');
                if (badgeImg) badgeImg.src = savedAvatar;
                if (passImg) passImg.src = savedAvatar;

                if (savedAvatar.startsWith('data:image/svg+xml')) {
                    const avatarImg = document.getElementById('avatar-img'); if (avatarImg) { avatarImg.src = savedAvatar; avatarImg.style.display = "block"; }
                    const txtAvatar = document.getElementById('txt-avatar'); if (txtAvatar) txtAvatar.style.display = "none";
                } else { 
                    const ppImg = document.getElementById('pp'); if (ppImg) { ppImg.src = savedAvatar; ppImg.style.display = "block"; }
                    const txtPhoto = document.getElementById('txt-photo'); if (txtPhoto) txtPhoto.style.display = "none";
                }
                const btnWHall = document.getElementById('btn-w-hall'); if(btnWHall) btnWHall.classList.remove('btn-sleep');
                const btnPass = document.getElementById('btn-pass'); if(btnPass) btnPass.classList.remove('btn-sleep');
            }

            if ((GyStorage.get('gygy_nickname') || '').toLowerCase() === 'модермех') {
                GyStorage.set('gygy_is_boss', 'true');
            }
            
            if (GyStorage.get('gygy_is_boss') === 'true') {
                const staffBtn = document.getElementById('btn-staff-room');
                if (staffBtn) staffBtn.style.display = 'block';
            }
        }

        function enterStudio() { window.location.href = 'studio.html'; }
        function enterStaffOffice() { window.location.href = 'staff_office.html'; }

        function handleNavigationBack() {
            if (currentBlockId === 'block-hall') portalTransition('block-identity');
            else if (currentBlockId === 'block-identity') portalTransition('block-welcome');
            else if (currentBlockId === 'block-welcome') portalTransition('block-entrance');
        }

        function portalTransition(nextId) {
            const ambientBar = document.getElementById('snd-ambient');
            if (ambientBar) { ambientBar.pause(); ambientBar.currentTime = 0; }

            if (nextId === 'block-server') { window.location.href = 'verses.html'; return; }
            if (nextId === 'block-bar') { window.location.href = 'bar.html'; return; }
            if (nextId === 'block-tables') { window.location.href = 'tables.html'; return; } 
            if (nextId === 'block-office') { window.location.href = 'office.html'; return; }

            const targetBlock = document.getElementById(nextId);
            if (!targetBlock) return;

            currentBlockId = nextId;
            window.EventBus.emit('ROOM_CHANGED', { room: nextId });

            const badge = document.getElementById('global-user-badge');
            const navArrows = document.getElementById('club-nav-arrows');

            document.querySelectorAll('.block').forEach(b => {
                b.classList.remove('active');
                b.style.display = 'none';
            });

            targetBlock.style.display = 'flex';
            setTimeout(() => { targetBlock.classList.add('active'); }, 20);

            if (nextId === 'block-entrance') {
                const mainDoor = document.getElementById('main-door');
                if (mainDoor) mainDoor.classList.remove('door-exploded');
                if (navArrows) navArrows.style.display = 'none';
                if (badge) badge.style.display = 'none';
            } else {
                if (navArrows) navArrows.style.display = 'flex';
                if (badge && currentUserImage) badge.style.display = 'block';
            }
        }

        function handleDoor() {
            const sndDoor = document.getElementById('snd-door');
            const sndAmbient = document.getElementById('snd-ambient');
            const mainDoor = document.getElementById('main-door');

            if (sndDoor) sndDoor.play();
            if (mainDoor) mainDoor.classList.add('door-exploded');

            setTimeout(() => {
                if (sndAmbient) {
                    sndAmbient.volume = 0.5;
                    sndAmbient.play().catch(e => console.log("Ambient blocked"));
                }
                portalTransition('block-welcome');
            }, 700);
        }

        function preview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUserImage = e.target.result;
                    const pp = document.getElementById('pp'); if (pp) { pp.src = currentUserImage; pp.style.display = 'block'; }
                    const txtPhoto = document.getElementById('txt-photo'); if (txtPhoto) txtPhoto.style.display = 'none';
                    const avatarImg = document.getElementById('avatar-img'); if (avatarImg) avatarImg.style.display = 'none';
                    const txtAvatar = document.getElementById('txt-avatar'); if (txtAvatar) txtAvatar.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function generateAvatar() {
            const hex = Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><rect width="100" height="100" fill="#${hex}"/><circle cx="50" cy="40" r="20" fill="#000000"/><path d="M20,90 C20,70 80,70 80,90" fill="#000000"/></svg>`;
            currentUserImage = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
            const avatarImg = document.getElementById('avatar-img'); if (avatarImg) { avatarImg.src = currentUserImage; avatarImg.style.display = "block"; }
            const txtAvatar = document.getElementById('txt-avatar'); if (txtAvatar) txtAvatar.style.display = 'none';
            const pp = document.getElementById('pp'); if (pp) pp.style.display = "none";
            const txtPhoto = document.getElementById('txt-photo'); if (txtPhoto) txtPhoto.style.display = 'block';
        }

        function saveUserProfile() {
            if (!currentUserImage) return;
            
            let finalNick = selectedNickType === 'club' ? (GyStorage.get('gygy_club_nick') || 'Магнат') : (userChosenNickname || GyStorage.get('gygy_nickname') || 'Anonymous');
            
            GyStorage.set('gygy_nickname', finalNick);
            GyStorage.set('gygy_avatar', currentUserImage);
            GyStorage.set('gy_user_img', currentUserImage);
            GyStorage.set('gy_user_avatar', currentUserImage); 
            GyStorage.set('gy_user_id', currentID);

            if (finalNick.toLowerCase() === 'модермех') {
                GyStorage.set('gygy_is_boss', 'true');
            }

            const badgeImg = document.getElementById('badge-avatar-img');
            const passImg = document.getElementById('pass-avatar-img');
            if (badgeImg) badgeImg.src = currentUserImage;
            if (passImg) passImg.src = currentUserImage;

            const badge = document.getElementById('global-user-badge');
            if (badge) badge.style.display = 'block';

            document.getElementById('btn-w-hall')?.classList.remove('btn-sleep');
            document.getElementById('btn-pass')?.classList.remove('btn-sleep');

            triggerBoardOfDirectorsCeremony(finalNick);
        }

        function triggerBoardOfDirectorsCeremony(nickname) {
            const langCode = GyStorage.get('gygy_lang_code', 'en');
            const events = [
                { en: "The Board of Directors approves your entry with a loud toast.", ru: "Совет директоров одобряет ваш вход громким тостом." },
                { en: "Chambers echo with applause. Welcome to the inner circle.", ru: "Залы гудят от аплодисментов. Добро пожаловать в ближний круг." },
                { en: "The Directors stamp your dossier. Excellent choice of identity.", ru: "Директора ставят штамп на ваше досье. Отличный выбор идентичности." },
                { en: "Champagne glasses clink. Your seat at the table is reserved.", ru: "Бокалы с шампанским звенят. Ваше место за столом забронировано." }
            ];
            const text = (langCode === 'ru' ? events[Math.floor(Math.random() * events.length)].ru : events[Math.floor(Math.random() * events.length)].en);
            showDynamicToast(`${text} — [ ${nickname} ]`);
        }

        function showDynamicToast(message) {
            let toast = document.getElementById('dynamic-board-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'dynamic-board-toast';
                toast.style.cssText = "position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-50px); background: #000; color: #00ffcc; border: 1px solid #00ffcc; padding: 12px 24px; font-family: 'Share Tech Mono', monospace; font-size: 11px; z-index: 10000; opacity: 0; transition: all 0.4s ease; text-align: center; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,255,204,0.3); pointer-events: none;";
                document.body.appendChild(toast);
            }
            toast.innerText = message;
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(-50px)';
            }, 5000);
        }

        function openPassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) { modal.style.display = 'flex'; setTimeout(() => { modal.style.opacity = '1'; }, 10); }
        }

        function closePassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) { modal.style.opacity = '0'; setTimeout(() => { modal.style.display = 'none'; }, 300); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!currentID) {
                currentID = "GY-" + Math.floor(100000 + Math.random() * 900000);
                GyStorage.set('gygy_id', currentID);
            }
            checkAndFillRegistrationForm();

            GyLocalization.updateGlobalFlagUI();
            GyLocalization.syncGTranslateWidget();
            GyLocalization.renderDropdownItems('club-lang-list', selectClubLanguage);

            window.addEventListener('storage', (e) => {
                if (e.key === 'gygy_flag' || e.key === 'gy_user_flag' || e.key === 'gygy_lang_name') {
                    GyLocalization.updateGlobalFlagUI();
                }
                if (e.key === 'gygy_lang_code') {
                    GyLocalization.syncGTranslateWidget();
                }
            });

            setTimeout(() => { document.body.classList.add('page-loaded'); }, 50);
        });
    </script>

    <div id="debug-panel" style="position: fixed; bottom: 5px; right: 5px; background: rgba(0,0,0,0.7); color: #00ffcc; padding: 4px 8px; border-radius: 4px; font-family: monospace; z-index: 9999; font-size: 10px; border: 1px solid #00ffcc; opacity: 0.7; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">
        <span>🧪 Debug:</span>
        <button onclick="debugSetRole('newbie')" style="background: #111; color: #fff; border: 1px solid #551; padding: 2px 4px; cursor: pointer; font-size: 9px; border-radius: 2px;">Новичок</button>
        <button onclick="debugSetRole('resident')" style="background: #111; color: #fff; border: 1px solid #551; padding: 2px 4px; cursor: pointer; font-size: 9px; border-radius: 2px;">Резидент</button>
    </div>
    <script>
        function debugSetRole(role) {
            if (role === 'newbie') {
                GyStorage.clear();
                alert("Режим сменен: ЧИСТЫЙ НОВИЧОК. Память очищена.");
            } else if (role === 'resident') {
                GyStorage.clear();
                GyStorage.set('gygy_id', 'GY-777777');
                GyStorage.set('gygy_avatar', 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><rect width="100" height="100" fill="%23ff0055"/><circle cx="50" cy="50" r="30" fill="%23ffffff"/></svg>');
                GyStorage.set('gygy_nickname', 'TestResident');
                GyStorage.set('gygy_lang', 'en');
                GyStorage.set('gygy_flag', 'gb');
                alert("Режим сменен: ГОТОВЫЙ РЕЗИДЕНТ.");
            }
            location.reload();
        }
    </script>
