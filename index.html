<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY Club v4.6.1</title>
    
    <!-- Шрифты по Манифесту -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Стили (Золото на черном) -->
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body class="theme-gold-black">

    <!-- Зона навигации (Шапка / Header-bar) -->
    <header class="header-bar">
        <div class="ui-nav-arrows">
            <button class="back-arrow" data-action="prev">&lt;</button>
            <button class="back-arrow" data-action="home">&lt;&lt;</button>
        </div>
        <div class="header-logo">GY-GY</div>
    </header>

    <!-- Основной контейнер сцены Входа -->
    <main class="scene-container" id="scene-index">
        
        <!-- Слоганы -->
        <h2 class="club-slogan" data-translate="slogan_welcome">
            "Cormorant Garamond / Playfair Display Italic"
        </h2>

        <!-- Зона взаимодействия: Дверь и языковой модуль -->
        <div class="entry-grid">
            
            <!-- Лево: Языковая панель (одиночная рамка + выпадающий список) -->
            <div class="language-selector-wrapper" id="language-module-root">
                <!-- Рендерится через modules/language.js -->
            </div>

            <!-- Центр: Дверь входа (40vh) -->
            <div class="door-container" id="entry-door">
                <div class="door-visual"></div>
            </div>

            <!-- Право: Логотип / Брендинг -->
            <div class="brand-badge-right">
                <span class="brand-text">GY-GY</span>
            </div>

        </div>
    </main>

    <!-- Звуковое сопровождение (замок, барабанное затухание/проявление) -->
    <audio id="audio-door" src="assets/audio/door-lock.mp3" preload="auto"></audio>
    <audio id="audio-drums" src="assets/audio/drums.mp3" preload="auto"></audio>

    <!-- 📥 Подключение архитектурных модулей (Порядок критически важен) -->
    <script src="core/eventBus.js"></script>
    <script src="modules/language.js"></script>
    <script src="modules/passport.js"></script>
    <script src="modules/navigation.js"></script>
    <script src="modules/situationalScanner.js"></script>

    <!-- Точка инициализации приложения (Bootstrap) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🏛 GY-GY Club Core v4.6.2 initializing...');

            // Инициализация Лего-компонентов по контракту жизненного цикла
            if (window.EventBus) {
                // Инициализируем модули через централизованные методы
                if (typeof LanguageModule !== 'undefined') LanguageModule.init();
                if (typeof PassportModule !== 'undefined') PassportModule.init();
                if (typeof NavigationModule !== 'undefined') NavigationModule.init();
                if (typeof SituationalScanner !== 'undefined') SituationalScanner.init();

                // Публикуем событие старта системы
                EventBus.publish('system:started', { version: '4.6.2' });
            }

            // Интерактив двери по Манифесту
            const door = document.getElementById('entry-door');
            const audioDoor = document.getElementById('audio-door');
            const audioDrums = document.getElementById('audio-drums');

            door.addEventListener('click', () => {
                // Звук замка
                if (audioDoor) audioDoor.play();

                // Плавное растворение двери
                door.classList.add('dissolve');

                // Через 0.5 сек включаются звуки бара и срабатывает переход сцены
                setTimeout(() => {
                    if (audioDrums) audioDrums.play();
                    
                    // Вызов навигации через шину событий вместо жестких переходов
                    EventBus.publish('navigation:change-scene', { target: 'welcome' });
                }, 500);
            });
        });
    </script>
</body>
</html>
