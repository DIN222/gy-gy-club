<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.6.16.21 CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #FFD700; --door-wood: #3E2723; --violet: #8A2BE2; --neon-glow: rgba(138, 43, 226, 0.6); }
        
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        body, button, input, div, img, span { pointer-events: auto !important; }
        img { -webkit-user-drag: none !important; }

        html, body { 
            width: 100%; 
            height: 100%; 
            background: #000000; 
            color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; 
            overflow: hidden; 
            position: fixed; 
            margin: 0; 
            padding: 0;
        }
        
        button, .ui-user-badge, .arrow-item, .painting-zone, #main-door, .box-final, .nickname-square {
            transition: all 0.3s ease !important;
        }
        button:hover, .ui-user-badge:hover, .arrow-item:hover, .painting-zone:hover, #main-door:hover, .box-final:hover, .nickname-square:hover {
            filter: brightness(1.1);
        }

        /* ЛОГОТИП GY-GY */
        .ui-header-right { 
            position: fixed; top: 18px; right: 25px; z-index: 1000000; 
            font-size: 24px; letter-spacing: 5px; font-weight: bold; 
            font-family: 'Cinzel', serif;
            text-shadow: -1px -1px 0 #000000, 1px -1px 0 #000000, -1px 1px 0 #000000, 1px 1px 0 #000000;
        }
        
        /* СКВОЗНОЙ АВАТАР */
        .ui-user-badge {
            position: fixed; top: 4px; left: 50%; transform: translateX(-50%);
            width: 36px; height: 36px; border-radius: 50%;
            border: 2px solid var(--gold); background: #111111;
            box-shadow: 0 0 0 1px #000000, inset 0 0 5px rgba(0,0,0,0.8);
            z-index: 1000000; cursor: pointer; display: none;
        }
        .ui-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background-color: #ffffff; }
        .ui-user-badge .badge-flag {
            position: absolute; bottom: -2px; right: -4px;
            width: 14px; height: 10px; object-fit: cover;
            border: 1px solid var(--gold); box-shadow: 0 0 0 1px #000000;
        }

        /* КОМПАКТНЫЙ ЯЗЫКОВЫЙ БЛОК */
        .club-lang-dropdown-wrapper {
            position: absolute; top: 18px; left: 20px; z-index: 1000001;
            width: 155px; font-family: 'Share Tech Mono', monospace;
        }
        
        .club-lang-current {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold);
            padding: 5px 8px; border-radius: 10px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.9); width: 100%;
        }
        .club-lang-current-content {
            display: flex; align-items: center; gap: 7px; min-width: 0;
        }
        .club-lang-current .item-avatar {
            width: 20px; height: 20px; border-radius: 50%; overflow: hidden;
            border: 1px solid var(--gold); background: #111; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .club-lang-current .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .club-lang-current .item-flag { width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
        .club-lang-current .item-text { color: var(--gold); font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .club-lang-current .arrow-down { color: var(--gold); font-size: 10px; font-weight: bold; flex-shrink: 0; }

        .club-lang-list {
            position: absolute; top: calc(100% + 5px); left: 0;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold);
            border-radius: 10px; width: 100%; max-height: 260px; overflow-y: auto;
            display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.9); z-index: 1000002;
        }
        .club-lang-list.open { display: block; }
        
        .club-lang-item {
            display: flex; align-items: center; gap: 7px;
            padding: 6px 8px; cursor: pointer; border-bottom: 1px solid rgba(255,215,0,0.15);
            transition: background 0.2s;
        }
        .club-lang-item:last-child { border-bottom: none; }
        .club-lang-item:hover { background: rgba(255,215,0,0.15); }
        .club-lang-item .item-avatar {
            width: 20px; height: 20px; border-radius: 50%; overflow: hidden;
            border: 1px solid var(--gold); background: #111; flex-shrink: 0;
        }
        .club-lang-item .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .club-lang-item .item-flag { width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
        .club-lang-item .item-text { color: var(--gold); font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ПАСПОРТ */
        .passport-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .passport-card { background: #F5F5DC; border: 3px solid var(--gold); border-radius: 16px; padding: 25px; width: 280px; color: #000000; text-align: center; box-shadow: 0 0 25px rgba(0,0,0,0.5); position: relative; }
        .passport-card .box-final { margin: 15px auto; border-color: #000000; }
        .passport-close-btn { position: absolute; top: 10px; right: 14px; font-size: 28px; font-weight: bold; color: #000000; cursor: pointer; line-height: 1; user-select: none; }

        /* УНИВЕРСАЛЬНЫЙ КЛАСС ДЛЯ БЛОКОВ СТРАНИЦ */
        .block { 
            position: fixed; 
            inset: 0; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background: #000000; 
            z-index: 10; 
            opacity: 0; 
            transition: opacity 1.2s ease-in-out; 
        }
        .block.active { 
            display: flex !important; 
            opacity: 1 !important; 
            z-index: 5000 !important; 
        }

        .quote-text { font-family: 'Cormorant Garamond', 'Playfair Display', serif; font-style: italic; font-size: 20px; text-align: center; max-width: 85%; margin-bottom: 8px; text-shadow: 2px 2px 4px #000000; }
        .btn-gy { min-width: 240px; padding: 10px 18px; background: #000000; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 700; margin: 4px 0; font-family: 'Montserrat', 'Cinzel', sans-serif; font-size: 12px; }
        
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; cursor: not-allowed; }
        .box-final { width: 75px; height: 75px; border: 2px solid var(--gold); background: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }

        /* СЕТКА КВАДРАТОВ 2x3 В БЛОКЕ IDENTITY */
        .identity-grid-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
            width: 250px;
        }
        .identity-grid-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .nickname-square {
            width: 75px; height: 75px; border: 2px solid var(--gold); background: #ffffff; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; color: #000000; padding: 4px; text-align: center;
        }
        .nickname-square.selected { border-color: #ffffff; box-shadow: 0 0 10px var(--gold); }
        .nickname-square input {
            position: absolute; inset: 0; width: 100%; height: 100%;
            background: transparent; border: none; text-align: center;
            font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: bold;
            color: #000000; z-index: 20; opacity: 1; cursor: text;
        }
        .nickname-square input:focus {
            outline: none; background: rgba(255, 215, 0, 0.1);
        }

        /* СТРОГИЕ И КОМПАКТНЫЕ ОТСТУПЫ ДЛЯ СТРАНИЦЫ WELCOME */
        #block-welcome { justify-content: center !important; padding-top: 0 !important; }
        #block-welcome img { max-height: 22vh !important; width: auto; object-fit: contain; margin: 6px 0 !important; filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)); }
        #block-welcome .welcome-title-elem { font-size: 24px !important; font-weight: 700; letter-spacing: 8px; font-style: italic; margin-bottom: 6px !important; font-family: 'Cinzel', serif; }

        /* НАВИГАЦИОННЫЕ СТРЕЛКИ В УГЛУ */
        .ui-nav-arrows {
            position: fixed; top: 18px; left: 20px; z-index: 9999999; 
            display: flex; gap: 15px; font-size: 24px; font-weight: 900 !important; 
            font-family: 'Share Tech Mono', monospace; cursor: pointer; color: var(--gold); 
            line-height: 1; letter-spacing: -2px; 
            background: transparent !important; border: none !important;
            text-shadow: -1px -1px 0 #000000, 1px -1px 0 #000000, -1px 1px 0 #000000, 1px 1px 0 #000000;
            pointer-events: auto !important; user-select: none;
        }
        .arrow-item { transition: opacity 0.2s, transform 0.2s; background: transparent !important; border: none !important; }
        .arrow-item:hover { opacity: 0.8; transform: scale(1.1); }

        /* ХОЛЛ И ИНТЕРАКТИВНЫЕ КАРТИНЫ */
        #block-hall { background: url('hall_bg_jpg.jpg') center/cover no-repeat #000000; }
        .hall-interior { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
        
        .hall-interior .quote-text { 
            position: absolute; 
            top: 10vh; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 85%; 
            margin: 0; 
            text-align: center;
            padding: 0;
            background: transparent !important;
            color: var(--gold) !important;        
            font-size: 24px;
            font-weight: 700;
            -webkit-text-stroke: 1px #000000;
            text-stroke: 1px #000000;
        }
        .hall-door-target {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 24vw; height: 60vh; cursor: pointer; z-index: 5;
            background: transparent;
        }

        .painting-zone {
            position: absolute; 
            top: 25vh; 
            width: 6vw; 
            height: 12vh; 
            cursor: pointer; 
            z-index: 6; 
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .painting-left { left: 23vw; }
        .painting-right { right: 23vw; }

        .cue-arrow-hall { 
            color: var(--violet); 
            font-size: 34px; 
            font-weight: 900; 
            font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 12px var(--violet), 0 0 20px var(--violet); 
            pointer-events: none; 
            user-select: none;
            z-index: 10;
            transition: opacity 0.2s;
        }
        .painting-zone:hover .cue-arrow-hall { opacity: 0.8; }

        .manifest-btn-box { 
            position: absolute; 
            bottom: -45px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 130px; 
            display: flex; 
            flex-direction: column;
            gap: 5px;
            justify-content: center; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.4s, bottom 0.4s; 
            z-index: 10; 
        }
        .btn-manifest { width: 100%; padding: 5px 0; font-size: 11px; margin: 0; background: #000000; box-shadow: 0 4px 10px rgba(0,0,0,0.9); }
        
        .goog-te-banner-frame, .skiptranslate, iframe.goog-te-menu-frame { display: none !important; }
        body { top: 0 !important; background-color: #000000 !important; opacity: 0; transition: opacity 1.2s ease-in-out !important; }
        body.page-loaded { opacity: 1 !important; }
        
        font { background-color: transparent !important; background: transparent !important; color: inherit !important; box-shadow: none !important; text-shadow: none !important; }
        .goog-text-highlight { background-color: transparent !important; background: transparent !important; box-shadow: none !important; color: inherit !important; }
        .btn-gy font, .quote-text font, .ui-header-right font { color: inherit !important; }
        
        #main-door {
            display: block;
            height: 48vh;
            max-height: 400px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            margin: 0 auto; 
            transform: scale(1);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease-out;
            cursor: pointer;
        }

        .door-exploded {
            transform: scale(3.5) !important;
            opacity: 0 !important;
        }
    </style>
</head>
<body class="page-loaded" oncontextmenu="return false;">

    <!-- Интерфейсные элементы управления -->
    <div class="ui-header-right">GY-GY</div>
    
    <div class="ui-user-badge" id="user-badge" onclick="openPassport()">
        <img src="" class="badge-img" id="badge-img-el" alt="Avatar">
        <img src="" class="badge-flag" id="badge-flag-el" alt="Flag">
    </div>

    <!-- Языковой селектор -->
    <div class="club-lang-dropdown-wrapper" id="lang-dropdown">
        <div class="club-lang-current" onclick="toggleLangDropdown()">
            <div class="club-lang-current-content">
                <div class="item-avatar"><img id="current-lang-avatar" src="" alt=""></div>
                <img id="current-lang-flag" class="item-flag" src="" alt="">
                <span class="item-text" id="current-lang-name">English</span>
            </div>
            <span class="arrow-down">▼</span>
        </div>
        <div class="club-lang-list" id="lang-list-container">
            <!-- Динамически заполняемый список языков -->
        </div>
    </div>

    <!-- Навигационные стрелки -->
    <div class="ui-nav-arrows" id="nav-arrows" style="display: none;">
        <button class="arrow-item" onclick="goBackPortal()">&#10094;</button>
        <button class="arrow-item" onclick="goForwardPortal()">&#10095;</button>
    </div>

    <!-- БЛОК 1: WELCOME -->
    <div id="block-welcome" class="block active">
        <div class="quote-text">"The door is open for those who dare to step through."</div>
        <img src="door_closed.png" alt="Door" id="main-door" onclick="explodeDoor()">
        <button class="btn-gy" style="margin-top: 20px;" onclick="portalTransition('block-hall')">Enter Club</button>
    </div>

    <!-- БЛОК 2: HALL -->
    <div id="block-hall" class="block">
        <div class="hall-interior">
            <div class="quote-text">Welcome to the Inner Sanctum</div>
            
            <!-- Левая картина -->
            <div class="painting-zone painting-left" onmouseenter="showManifest('left')" onmouseleave="hideManifest('left')" onclick="portalTransition('block-server')">
                <div class="cue-arrow-hall">&#10094;</div>
                <div class="manifest-btn-box" id="manifest-left">
                    <button class="btn-gy btn-manifest">Manifest 1</button>
                </div>
            </div>

            <!-- Центральная дверь -->
            <div class="hall-door-target" onclick="portalTransition('block-bar')"></div>

            <!-- Правая картина -->
            <div class="painting-zone painting-right" onmouseenter="showManifest('right')" onmouseleave="hideManifest('right')" onclick="portalTransition('block-tables')">
                <div class="cue-arrow-hall">&#10095;</div>
                <div class="manifest-btn-box" id="manifest-right">
                    <button class="btn-gy btn-manifest">Manifest 2</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Аудио элементы управления -->
    <audio id="snd-ambient" loop>
        <source src="ambient.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Базовая логика переходов и управления звуком
        function portalTransition(nextId) {
            const ambientBar = document.getElementById('snd-ambient');
            if (ambientBar) {
                ambientBar.pause();
                ambientBar.currentTime = 0;
            }

            const currentActive = document.querySelector('.block.active');
            const nextBlock = document.getElementById(nextId);

            if (currentActive) {
                currentActive.style.opacity = '0';
                setTimeout(() => {
                    currentActive.classList.remove('active');
                    if (nextBlock) {
                        nextBlock.classList.add('active');
                        setTimeout(() => {
                            nextBlock.style.opacity = '1';
                        }, 50);
                    }
                }, 1200);
            } else if (nextBlock) {
                nextBlock.classList.add('active');
                setTimeout(() => { nextBlock.style.opacity = '1'; }, 50);
            }

            const navArrows = document.getElementById('nav-arrows');
            if (nextId === 'block-hall') {
                navArrows.style.display = 'flex';
            } else {
                navArrows.style.display = 'none';
            }
        }

        function explodeDoor() {
            const door = document.getElementById('main-door');
            door.classList.add('door-exploded');
            setTimeout(() => {
                portalTransition('block-hall');
            }, 600);
        }

        function toggleLangDropdown() {
            const list = document.getElementById('lang-list-container');
            list.classList.toggle('open');
        }

        function showManifest(side) {
            const box = document.getElementById('manifest-' + side);
            if (box) {
                box.style.opacity = '1';
                box.style.bottom = '-55px';
                box.style.pointerEvents = 'auto';
            }
        }

        function hideManifest(side) {
            const box = document.getElementById('manifest-' + side);
            if (box) {
                box.style.opacity = '0';
                box.style.bottom = '-45px';
                box.style.pointerEvents = 'none';
            }
        }

        function goBackPortal() {
            portalTransition('block-welcome');
        }

        function goForwardPortal() {}

        function openPassport() {}
    </script>
</body>
</html>
