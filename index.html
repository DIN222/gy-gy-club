<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Entrance — Gateway [v2026.10]</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body {
            background-color: #0b0b0b;
            color: #fff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .block {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .block.active {
            display: flex;
        }

        /* 1. Входная группа */
        #block-entrance {
            background: url('door_1.jpg?v=2026.8') no-repeat center center;
            background-size: cover;
        }

        .door-prompt {
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 30px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 16px;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        .door-prompt:hover {
            background: rgba(212, 175, 55, 0.8);
            color: #000;
        }

        /* 2. Приветствие перед переходом на identity.html */
        #block-welcome {
            background: #111;
        }

        .welcome-card {
            background: #161616;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .btn {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn:hover { background: #f1c40f; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Входная группа -->
    <div id="block-entrance" class="block active">
        <div class="door-prompt" onclick="goToWelcome()">Touch the door to enter</div>
    </div>

    <!-- ЭКРАН 2: Приветствие диспетчера -->
    <div id="block-welcome" class="block">
        <div class="welcome-card">
            <h2>Welcome to the Club</h2>
            <p style="color: #888; margin: 15px 0; font-size: 14px;">Preparing your secure session...</p>
            <button class="btn" onclick="proceedToIdentity()">Continue to Identity</button>
        </div>
    </div>

    <!-- Подключаем скрипты ядра и навигации -->
    <script src="core/storage.js"></script>
    <script src="navigation.js"></script>
    <script>
        function goToWelcome() {
            // Переключаем внутренний экран диспетчера
            document.getElementById('block-entrance').classList.remove('active');
            document.getElementById('block-welcome').classList.add('active');
        }

        function proceedToIdentity() {
            // Переход на отдельную страницу онбординга согласно архитектуре
            window.location.href = 'identity.html';
        }
    </script>
</body>
</html>
