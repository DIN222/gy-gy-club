<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY Club (CORE) 001 </title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Подключение стилей и внешних библиотек (если требуются) -->
</head>
<body class="page-loaded">

    <!-- Глобальный бейдж пользователя -->
    <div id="global-user-badge" style="display: none; position: fixed; top: 10px; right: 10px; z-index: 1000; cursor: pointer;" onclick="openPassport()">
        <img id="badge-avatar-img" src="" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #00ffcc;" alt="Avatar">
    </div>

    <!-- Навигационные стрелки для комнат -->
    <div id="club-nav-arrows" style="display: none; position: fixed; top: 10px; left: 10px; z-index: 1000;">
        <button onclick="handleNavigationBack()">⬅️ Назад</button>
    </div>

    <!-- 1. Блок: Вход (Entrance) -->
    <div id="block-entrance" class="block active" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
        <h1 data-translate="welcome_title">Добро пожаловать в GY-GY Club</h1>
        <div id="main-door" onclick="handleDoor()" style="cursor: pointer; padding: 20px; background: #222; color: #00ffcc; border: 1px solid #00ffcc;">
            🚪 Открыть дверь
        </div>
    </div>

    <!-- 2. Блок: Приветствие / Выбор языка и профиля (Welcome) -->
    <div id="block-welcome" class="block" style="display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
        <h2 data-translate="choose_lang_title">Выберите язык клуба</h2>
        
        <!-- Кастомный селектор языков с флагами -->
        <div class="club-lang-dropdown-wrapper" style="position: relative; margin-bottom: 20px;">
            <div onclick="toggleLangDropdown()" style="display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 12px; border: 1px solid #00ffcc; background: #111; color: #fff;">
                <img id="current-flag" src="https://flagcdn.com/w20/gb.png" alt="Flag">
                <span id="current-lang-name">English</span>
                <span>▼</span>
            </div>
            <div id="club-lang-list" class="club-lang-list" style="display: none; position: absolute; top: 100%; left: 0; background: #111; border: 1px solid #00ffcc; z-index: 100; max-height: 200px; overflow-y: auto;">
                <!-- Динамически заполняется языками -->
            </div>
        </div>

        <!-- Настройка никнейма и аватара -->
        <div style="display: flex; flex-direction: column; gap: 10px; width: 300px;">
            <div id="box-own-nick" class="selected" onclick="focusOwnNickInput()" style="padding: 10px; border: 1px solid #555; cursor: pointer;">
                <input type="text" id="input-own-nick" placeholder="Введите ваш ник..." oninput="updateNicknameValue(this.value, 'own')" style="background: transparent; border: none; color: #fff; width: 100%; outline: none;">
            </div>
            <button onclick="generateAvatar()" style="padding: 8px; background: #222; color: #00ffcc; border: 1px solid #00ffcc; cursor: pointer;">Сгенерировать аватар</button>
            <button onclick="saveUserProfile()" style="padding: 10px; background: #00ffcc; color: #000; font-weight: bold; cursor: pointer;" data-translate="enter_club_btn">Войти в клуб</button>
        </div>
        
        <button id="btn-w-hall" class="btn-sleep" onclick="portalTransition('block-hall')" style="margin-top: 15px;">Перейти в Холл ➡️</button>
    </div>

    <!-- 3. Блок: Холл (Hall) -->
    <div id="block-hall" class="block" style="display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
        <h2 data-translate="hall_title">Главный Холл Клуба</h2>
        <button onclick="portalTransition('block-identity')">Паспорт ID</button>
    </div>

    <!-- 4. Блок: Кабинет ID (Identity) -->
    <div id="block-identity" class="block" style="display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
        <h2>ID Кабинет: <span id="id-label"></span></h2>
        <div id="qr-box-reg"></div>
    </div>

    <!-- Модальное окно паспорта -->
    <div id="modal-passport" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s;">
        <div style="background: #111; border: 1px solid #00ffcc; padding: 20px; text-align: center; color: #fff;">
            <h3>Клубный Паспорт</h3>
            <p>ID: <span id="pass-id-val"></span></p>
            <p>Ник: <span id="club-nick-label"></span></p>
            <div id="pass-qr-box"></div>
            <img id="pass-avatar-img" src="" style="width: 60px; height: 60px; border-radius: 50%; margin-top: 10px;" alt="">
            <br>
            <button onclick="closePassport()" style="margin-top: 15px; padding: 5px 15px;">Закрыть</button>
        </div>
    </div>

    <!-- Скрытый элемент для Google Translate виджета -->
    <div id="google_translate_element" style="display: none;"></div>

    <!-- Аудио элементы -->
    <audio id="snd-door" src="door.mp3" preload="auto"></audio>
    <audio id="snd-ambient" src="ambient.mp3" preload="auto" loop></audio>
    <script src="userlang-data.js"></script>
<script src="translations.js"></script>
<!-- Подключаем обновленный модуль языка -->
<script type="module">
    import { EventBus } from './core/eventBus.js';

    export const LanguageModule = {
        currentActiveCode: 'en',
        currentFlagCode: 'gb',

        init() {
            let savedLangCode = (typeof safeStorageGet === 'function' ? safeStorageGet('gy_lang') || safeStorageGet('gygy_lang') || safeStorageGet('gygy_lang_code') : localStorage.getItem('gy_lang') || localStorage.getItem('gygy_lang') || localStorage.getItem('gygy_lang_code'));
            const savedFlag = (typeof safeStorageGet === 'function' ? safeStorageGet('gygy_flag') || safeStorageGet('gy_user_flag') : localStorage.getItem('gygy_flag') || localStorage.getItem('gy_user_flag'));
            
            if (savedLangCode) {
                savedLangCode = savedLangCode.toLowerCase();
                if (savedLangCode === 'ua') savedLangCode = 'uk';
            }

            let matchedLang = null;
            if (savedFlag && typeof allLanguages !== 'undefined') {
                matchedLang = allLanguages.find(l => l.flag.includes(`/${savedFlag.toLowerCase()}.png`));
            } else if (savedLangCode && typeof allLanguages !== 'undefined') {
                matchedLang = allLanguages.find(l => l.code === savedLangCode);
            }

            if (matchedLang) {
                this.currentFlagCode = matchedLang.flag;
                this.currentActiveCode = matchedLang.code;
                
                const currentFlagEl = document.getElementById('current-flag');
                if (currentFlagEl) currentFlagEl.src = matchedLang.flag;

                const langNameEl = document.getElementById('current-lang-name');
                if (langNameEl) langNameEl.innerText = matchedLang.name;
                
                this.applyTranslationsToDOM(matchedLang.code);
                this.forceTriggerGoogleTranslate(matchedLang.code);
            }

            this.renderDropdownList(this.currentActiveCode);
            console.log("Модуль языка успешно инициализирован.");
        },

        googleTranslateElementInit() {
            if (typeof google !== 'undefined' && google.translate) {
                new google.translate.TranslateElement({
                    pageLanguage: 'en',
                    includedLanguages: 'en,de,es,fr,it,pl,pt,ru,uk,zh-CN,ja,ar',
                    layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                    autoDisplay: false
                }, 'google_translate_element');
            }
        },

        applyTranslationsToDOM(langCode) {
            if (typeof translations === 'undefined' || !translations[langCode]) return;
            const dict = translations[langCode];
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (dict[key]) {
                    el.innerText = dict[key];
                }
            });
        },

        forceTriggerGoogleTranslate(langCode) {
            if (window.langTimer) clearInterval(window.langTimer);
            let attempts = 0;
            window.langTimer = setInterval(() => {
                const selectEl = document.querySelector('.goog-te-combo');
                if (selectEl) {
                    clearInterval(window.langTimer);
                    if (selectEl.value === langCode) return;
                    selectEl.value = langCode;
                    selectEl.dispatchEvent(new Event('change', { bubbles: true }));
                }
                if (++attempts > 100) {
                    clearInterval(window.langTimer);
                }
            }, 100);
        },

        renderDropdownList(activeCode) {
            const listContainer = document.getElementById('club-lang-list');
            if (!listContainer || typeof allLanguages === 'undefined') return;
            
            listContainer.innerHTML = '';
            allLanguages.forEach(lang => {
                if (lang.code !== activeCode) {
                    const item = document.createElement('div');
                    item.className = 'club-lang-item';
                    item.style.cssText = "display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; color: #fff;";
                    item.onclick = () => window.selectClubLanguage(lang.code, lang.name, lang.flag);
                    item.innerHTML = `
                        <img class="item-flag" src="${lang.flag}" style="width: 20px;">
                        <span class="item-text">${lang.name}</span>
                    `;
                    listContainer.appendChild(item);
                }
            });
        },

        selectClubLanguage(code, name, flagUrl) {
            this.currentActiveCode = code;
            
            let countryCode = 'gb';
            if (typeof flagUrl === 'string' && flagUrl.includes('/w20/')) {
                const parts = flagUrl.split('/');
                countryCode = parts[parts.length - 1].replace('.png', '');
            }
            
            this.currentFlagCode = flagUrl;
            
            // Сохраняем во все ключи хранилища для бесшовной совместимости
            localStorage.setItem('gygy_lang', code);
            localStorage.setItem('gygy_lang_code', code);
            localStorage.setItem('gygy_lang_name', name);
            localStorage.setItem('gygy_flag', countryCode);
            localStorage.setItem('gy_user_flag', countryCode);
            
            const currentFlagEl = document.getElementById('current-flag');
            if (currentFlagEl) currentFlagEl.src = flagUrl;

            const langNameEl = document.getElementById('current-lang-name');
            if (langNameEl) langNameEl.innerText = name;
            
            this.applyTranslationsToDOM(code);
            this.forceTriggerGoogleTranslate(code);
            this.renderDropdownList(code);

            const list = document.getElementById('club-lang-list');
            if (list) list.classList.remove('open');
            
            EventBus.emit('LANGUAGE_CHANGED', { code, name, flag: flagUrl });
        }
    };

    // Глобальные мостики для HTML
    window.toggleLangDropdown = function() {
        const list = document.getElementById('club-lang-list');
        if (list) list.classList.toggle('open');
    };

    window.selectClubLanguage = function(code, name, flagUrl) {
        LanguageModule.selectClubLanguage(code, name, flagUrl);
    };

    window.googleTranslateElementInit = function() {
        LanguageModule.googleTranslateElementInit();
    };

    // Автоматическая инициализация модуля при загрузке страницы
    window.addEventListener('DOMContentLoaded', () => {
        LanguageModule.init();
    });
</script>

<script>
    let currentID = "";
    let currentUserImage = "";
    let currentBlockId = 'block-entrance';
    let selectedNickType = 'own';
    let userChosenNickname = '';

    const allLanguages = [
        { code: 'en', name: 'English', flag: 'https://flagcdn.com/w20/gb.png' },
        { code: 'ru', name: 'Русский', flag: 'https://flagcdn.com/w20/ru.png' },
        { code: 'es', name: 'Español', flag: 'https://flagcdn.com/w20/es.png' },
        { code: 'de', name: 'Deutsch', flag: 'https://flagcdn.com/w20/de.png' },
        { code: 'fr', name: 'Français', flag: 'https://flagcdn.com/w20/fr.png' },
        { code: 'it', name: 'Italiano', flag: 'https://flagcdn.com/w20/it.png' },
        { code: 'zh-CN', name: '中文', flag: 'https://flagcdn.com/w20/cn.png' },
        { code: 'ja', name: '日本語', flag: 'https://flagcdn.com/w20/jp.png' },
        { code: 'ar', name: 'العربية', flag: 'https://flagcdn.com/w20/sa.png' },
        { code: 'pt', name: 'Português', flag: 'https://flagcdn.com/w20/pt.png' },
        { code: 'uk', name: 'Українська', flag: 'https://flagcdn.com/w20/ua.png' },
        { code: 'pl', name: 'Polski', flag: 'https://flagcdn.com/w20/pl.png' }
    ];

    function safeStorageGet(key, fallback = "") { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } }
    function safeStorageSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

    function setNickType(type) {
        selectedNickType = type;
        const boxOwn = document.getElementById('box-own-nick');
        if (boxOwn) {
            if (type === 'own') boxOwn.classList.add('selected');
            else boxOwn.classList.remove('selected');
        }
    }

    function focusOwnNickInput() {
        setNickType('own');
        const input = document.getElementById('input-own-nick');
        if (input) input.focus();
    }

    function updateNicknameValue(val, type) {
        if (type === 'own') {
            userChosenNickname = val;
            safeStorageSet('gygy_nickname', val);
        }
    }

    function renderUserPassports(targetID) {
        const idLabel = document.getElementById('id-label');
        const passIdVal = document.getElementById('pass-id-val');
        const qrBoxReg = document.getElementById('qr-box-reg');
        const passQrBox = document.getElementById('pass-qr-box');
        
        if (idLabel) idLabel.innerText = targetID;
        if (passIdVal) passIdVal.innerText = targetID;
        
        if (qrBoxReg && typeof QRCode !== 'undefined') { 
            qrBoxReg.innerHTML = ""; 
            new QRCode(qrBoxReg, { text: targetID, width: 75, height: 75 }); 
        }
        if (passQrBox && typeof QRCode !== 'undefined') { 
            passQrBox.innerHTML = ""; 
            new QRCode(passQrBox, { text: targetID, width: 90, height: 90 }); 
        }

        let clubNick = safeStorageGet('gygy_club_nick');
        if (!clubNick) {
            const coolNicks = ["БигКоин", "Нападающий", "Шампань", "Магнат", "Счастливчик", "Инсайдер", "Фантом", "Победитель"];
            clubNick = coolNicks[Math.floor(Math.random() * coolNicks.length)];
            safeStorageSet('gygy_club_nick', clubNick);
        }

        const clubNickLabel = document.getElementById('club-nick-label');
        if (clubNickLabel) clubNickLabel.innerText = clubNick;
    }

    function checkAndFillRegistrationForm() {
        const savedAvatar = safeStorageGet('gy_user_img') || safeStorageGet('gygy_avatar');
        currentID = safeStorageGet('gygy_id') || safeStorageGet('gy_user_id') || safeStorageGet('gy_trace');

        if (currentID) { renderUserPassports(currentID); }

        const savedNickname = safeStorageGet('gygy_nickname') || '';
        const ownNickInput = document.getElementById('input-own-nick');
        if (ownNickInput && savedNickname) {
            ownNickInput.value = savedNickname;
            userChosenNickname = savedNickname;
        }

        if (savedAvatar) {
            currentUserImage = savedAvatar;
            const badgeImg = document.getElementById('badge-avatar-img');
            const passImg = document.getElementById('pass-avatar-img');
            if (badgeImg) badgeImg.src = savedAvatar;
            if (passImg) passImg.src = savedAvatar;

            const btnWHall = document.getElementById('btn-w-hall'); 
            if(btnWHall) btnWHall.classList.remove('btn-sleep');
        }
    }

    function handleNavigationBack() {
        if (currentBlockId === 'block-hall') {
            portalTransition('block-identity');
        } else if (currentBlockId === 'block-identity') {
            portalTransition('block-welcome');
        } else if (currentBlockId === 'block-welcome') {
            portalTransition('block-entrance');
        }
    }

    function portalTransition(nextId) {
        const ambientBar = document.getElementById('snd-ambient');
        if (ambientBar) {
            ambientBar.pause();
            ambientBar.currentTime = 0;
        }

        const targetBlock = document.getElementById(nextId);
        if (!targetBlock) return;

        currentBlockId = nextId;

        const badge = document.getElementById('global-user-badge');
        const navArrows = document.getElementById('club-nav-arrows');

        document.querySelectorAll('.block').forEach(b => {
            b.classList.remove('active');
            b.style.display = 'none';
        });

        targetBlock.style.display = 'flex';
        setTimeout(() => { targetBlock.classList.add('active'); }, 20);

        if (nextId === 'block-entrance') {
            const mainDoor = document.getElementById('main-door');
            if (mainDoor) mainDoor.classList.remove('door-exploded');
            if (navArrows) navArrows.style.display = 'none';
            if (badge) badge.style.display = 'none';
        } else {
            if (navArrows) navArrows.style.display = 'flex';
            if (badge && currentUserImage) badge.style.display = 'block';
        }
    }

    function handleDoor() {
        const sndDoor = document.getElementById('snd-door');
        const sndAmbient = document.getElementById('snd-ambient');
        const mainDoor = document.getElementById('main-door');

        if (sndDoor) sndDoor.play();
        if (mainDoor) mainDoor.classList.add('door-exploded');

        setTimeout(() => {
            if (sndAmbient) {
                sndAmbient.volume = 0.5;
                sndAmbient.play().catch(e => console.log("Ambient blocked"));
            }
            portalTransition('block-welcome');
        }, 700);
    }

    function generateAvatar() {
        const hex = Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><rect width="100" height="100" fill="#${hex}"/><circle cx="50" cy="40" r="20" fill="#000000"/><path d="M20,90 C20,70 80,70 80,90" fill="#000000"/></svg>`;
        currentUserImage = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    }

    function saveUserProfile() {
        if (!currentUserImage) generateAvatar();
        
        let finalNick = userChosenNickname || safeStorageGet('gygy_nickname') || 'Anonymous';
        safeStorageSet('gygy_nickname', finalNick);
        safeStorageSet('gygy_avatar', currentUserImage);
        safeStorageSet('gy_user_img', currentUserImage);
        safeStorageSet('gy_user_id', currentID);

        const badgeImg = document.getElementById('badge-avatar-img');
        const passImg = document.getElementById('pass-avatar-img');
        if (badgeImg) badgeImg.src = currentUserImage;
        if (passImg) passImg.src = currentUserImage;

        const badge = document.getElementById('global-user-badge');
        if (badge) badge.style.display = 'block';

        const btnWHall = document.getElementById('btn-w-hall'); 
        if (btnWHall) btnWHall.classList.remove('btn-sleep');
    }

    function openPassport() {
        const modal = document.getElementById('modal-passport');
        if (modal) { 
            modal.style.display = 'flex'; 
            setTimeout(() => { modal.style.opacity = '1'; }, 10); 
        }
    }

    function closePassport() {
        const modal = document.getElementById('modal-passport');
        if (modal) {
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (!currentID) {
            currentID = "GY-" + Math.floor(100000 + Math.random() * 900000);
            safeStorageSet('gygy_id', currentID);
        }
        checkAndFillRegistrationForm();
    });
</script>

<!-- Google Translate виджет (скрипт инициализации) -->
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
