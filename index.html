<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY CLUB v7.0.0 — Главный Диспетчер</title>
    
    <!-- Подключаем фирменные шрифты из схемы -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@1,600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b0b0b;
            color: #f0f0f0;
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* МОДУЛЬ 01: ВХОДНАЯ ГРУППА (#block-entrance) */
        #block-entrance {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1s ease;
        }

        .lang-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #222;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 5px 10px;
            cursor: pointer;
            font-family: inherit;
        }

        .door-container {
            width: 300px;
            height: 40vh;
            background: #1a1a1a;
            border: 4px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            transition: transform 0.5s ease;
        }
        .door-container:hover {
            transform: scale(1.02);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.4);
        }
        .door-handle {
            position: absolute;
            right: 20px;
            width: 15px;
            height: 50px;
            background: #d4af37;
            border-radius: 3px;
        }

        /* МОДУЛЬ 02: ПРИВЕТСТВИЕ (#block-welcome) */
        #block-welcome {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            max-width: 700px;
            animation: fadeIn 1.5s ease;
        }

        .club-slogan {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 28px;
            color: #d4af37;
            margin-bottom: 20px;
        }

        .horse-glow {
            width: 100%;
            height: 35vh;
            background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, rgba(11,11,11,1) 80%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #333;
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }

        .nav-buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button.club-btn {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 12px 25px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button.club-btn:hover {
            background: #f3c653;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- МОДУЛЬ 01: Входная группа -->
    <div id="block-entrance">
        <select class="lang-selector" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="ru">🇷🇺 Русский (RU)</option>
            <option value="en">🇬🇧 English (EN)</option>
            <option value="es">🇪🇸 Español (ES)</option>
            <option value="fr">🇫🇷 Français (FR)</option>
            <option value="de">🇩🇪 Deutsch (DE)</option>
            <option value="zh">🇨🇳 中文 (ZH)</option>
            <option value="ja">🇯🇵 日本語 (JA)</option>
            <option value="ar">🇸🇦 العربية (AR)</option>
            <option value="it">🇮🇹 Italiano (IT)</option>
            <option value="pt">🇵🇹 Português (PT)</option>
            <option value="uk">🇺🇦 Українська (UK)</option>
            <option value="tr">🇹🇷 Türkçe (TR)</option>
        </select>

        <h1 style="font-family: 'Cinzel', serif; color: #d4af37; margin-bottom: 10px;">GY-GY CLUB</h1>
        <p style="color: #888; margin-bottom: 30px;" id="entrance-subtitle">Нажмите на дверь, чтобы войти</p>
        
        <div class="door-container" onclick="openDoor()">
            <div class="door-handle"></div>
            <span style="font-family: 'Cinzel', serif; color: #d4af37;">ОТКРЫТЬ ДВЕРЬ</span>
        </div>
    </div>

    <!-- МОДУЛЬ 02: Приветствие -->
    <div id="block-welcome">
        <div class="club-slogan">«Свобода, творчество и полная автономия резидента»</div>
        
        <div class="horse-glow">
            [Художественная подсветка коня / Арт-объект клуба]
        </div>

        <p style="line-height: 1.6; color: #ccc;">
            Добро пожаловать в экосистему. Здесь нет скучных рамок — действуйте на свое усмотрение и творите без оглядки.
        </p>

        <div class="nav-buttons">
            <button class="club-btn" onclick="goToRegistration()">Проходите на регистрацию</button>
            <button class="club-btn" style="background: transparent; border: 1px solid #d4af37; color: #d4af37;" onclick="goToHall()">Проходите в Холл</button>
        </div>
    </div>

    <!-- Подключение ЯДРА СИСТЕМЫ (core/) -->
    <script src="core/eventBus.js"></script>
    <script src="core/storage.js"></script>
    <script src="core/localization.js"></script>

    <script>
        // Инициализация при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            console.log("GY-GY CLUB: Диспетчер инициализирован.");
            
            // Проверяем через storage.js, был ли уже здесь юзер
            if (typeof StorageManager !== 'undefined' && StorageManager.getResident) {
                const resident = StorageManager.getResident();
                if (resident && resident.id) {
                    console.log("Резидент распознан:", resident.id);
                }
            }
        });

        // Эффект открытия двери (Модуль 01)
        function openDoor() {
            playClickSound();

            const entrance = document.getElementById('block-entrance');
            entrance.style.opacity = '0';
            
            setTimeout(() => {
                entrance.style.display = 'none';
                document.getElementById('block-welcome').style.display = 'flex';
                
                // Публикуем событие через шину eventBus.js
                if (typeof EventBus !== 'undefined') {
                    EventBus.publish('doorOpened', { timestamp: Date.now() });
                }
            }, 1000);
        }

        function playClickSound() {
            console.log("🔊 Щелчок замка и запуск эмбиента бара...");
        }

        function changeLanguage(lang) {
            if (typeof LocalizationManager !== 'undefined') {
                LocalizationManager.setLang(lang);
            } else {
                console.log("Переключение языка на:", lang);
            }
        }

        // Переходы в следующие модули схемы
        function goToRegistration() {
            window.location.href = "identity.html"; // Модуль 03 (Онбординг)
        }

        function goToHall() {
            window.location.href = "hall.html"; // Модуль 04 (Парадный Холл)
        }
    </script>
</body>
</html>
