<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYGY Club — Interactive Portal [v1.0.4]</title>
    
    <!-- External Dependencies & Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Styles from README Specifications -->
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --border-color: #222222;
            --card-bg: #0c0c0c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.page-loaded {
            opacity: 1;
        }

        /* Version Badge */
        #app-version {
            position: fixed;
            bottom: 10px;
            left: 15px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            z-index: 1000;
            opacity: 0.5;
            letter-spacing: 1px;
            pointer-events: none;
        }

        /* Global Header UI & Navigation */
        #global-user-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            display: none;
            z-index: 1000;
            cursor: pointer;
        }

        .badge-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(12, 12, 12, 0.85);
            border: 1px solid var(--accent-color);
            padding: 6px 12px;
            border-radius: 30px;
            box-shadow: 0 0 15px var(--accent-glow);
            backdrop-filter: blur(5px);
        }

        .badge-card img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .badge-card span {
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: var(--accent-color);
        }

        /* Navigation Arrows */
        #club-nav-arrows {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 15px;
            z-index: 1000;
        }

        .nav-btn {
            background: #111;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Blocks Architecture */
        .block {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .block.active {
            display: flex;
            opacity: 1;
        }

        /* 1. Entrance Block */
        #block-entrance {
            text-align: center;
        }

        .main-door-container {
            position: relative;
            cursor: pointer;
            padding: 40px;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .main-door-container:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .main-door-container h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 28px;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .main-door-container p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .door-exploded {
            transform: scale(1.1);
            opacity: 0;
            filter: blur(10px);
        }

        /* 2. Welcome Block */
        .welcome-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .welcome-box h2 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 20px;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        /* Language selector dropdown */
        .club-lang-dropdown-wrapper {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .club-lang-current {
            background: #111;
            border: 1px solid var(--border-color);
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-radius: 4px;
        }

        .club-lang-current img {
            width: 20px;
            height: 14px;
            object-fit: cover;
        }

        .club-lang-list {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #111;
            border: 1px solid var(--border-color);
            max-height: 150px;
            overflow-y: auto;
            display: none;
            z-index: 10;
        }

        .club-lang-list.open {
            display: block;
        }

        .club-lang-item {
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 13px;
        }

        .club-lang-item:hover {
            background: #222;
        }

        /* 3. Identity Block */
        .identity-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 8px;
            width: 450px;
            max-width: 90%;
            text-align: center;
        }

        .avatar-preview-area {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            position: relative;
        }

        .avatar-preview-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .nickname-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
            text-align: left;
        }

        .nick-option {
            background: #111;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nick-option.selected {
            border-color: var(--accent-color);
            background: rgba(0, 255, 204, 0.05);
        }

        .nick-option input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
            font-family: inherit;
            margin-top: 5px;
        }

        /* 4. Hall Block */
        #block-hall {
            text-align: center;
        }

        .hall-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 400px;
            max-width: 90%;
        }

        .hall-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .hall-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-sleep {
            opacity: 0.4;
            pointer-events: none;
        }

        /* Modal Passport */
        #modal-passport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .passport-card {
            background: #0d0d0d;
            border: 2px solid var(--accent-color);
            width: 350px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 40px var(--accent-glow);
            text-align: center;
            position: relative;
        }

        .passport-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .passport-close:hover {
            color: var(--accent-color);
        }

        .primary-action-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: box-shadow 0.2s;
        }

        .primary-action-btn:hover {
            box-shadow: 0 0 15px var(--accent-glow);
        }
    </style>
</head>
<body>

    <!-- Application Version Watermark -->
    <div id="app-version">v1.0.4-STABLE</div>

    <!-- Global Header Badge -->
    <div id="global-user-badge" onclick="openPassport()">
        <div class="badge-card">
            <img id="badge-avatar-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><rect width='32' height='32' fill='#222'/></svg>">
            <span id="id-label">GY-000000</span>
        </div>
    </div>

    <!-- Navigation Arrows -->
    <div id="club-nav-arrows">
        <button class="nav-btn" onclick="handleNavigationBack()">← BACK</button>
    </div>

    <!-- BLOCK 1: ENTRANCE -->
    <div id="block-entrance" class="block active">
        <div class="main-door-container" id="main-door" onclick="handleDoor()">
            <h1>GYGY CLUB</h1>
            <p>[ Click to Breach Portal ]</p>
        </div>
    </div>

    <!-- BLOCK 2: WELCOME -->
    <div id="block-welcome" class="block">
        <div class="welcome-box">
            <h2>SELECT LANGUAGE</h2>
            <div class="club-lang-dropdown-wrapper">
                <div class="club-lang-current" onclick="toggleLangDropdown()">
                    <img id="current-flag" src="https://flagcdn.com/w20/gb.png">
                    <span id="current-lang-name">English</span>
                </div>
                <div class="club-lang-list" id="club-lang-list">
                    <!-- Populated via script -->
                </div>
            </div>
            <button class="primary-action-btn" onclick="portalTransition('block-identity')">PROCEED →</button>
        </div>
    </div>

    <!-- BLOCK 3: IDENTITY -->
    <div id="block-identity" class="block">
        <div class="identity-box">
            <h2>YOUR IDENTITY</h2>
            <div class="avatar-preview-area">
                <span id="txt-photo" style="font-size: 11px; color: var(--text-muted);">NO AVATAR</span>
                <img id="pp" src="">
                <img id="avatar-img" src="">
            </div>
            
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 15px;">
                <input type="file" id="file-input" style="display:none;" onchange="preview(this)">
                <button class="nav-btn" onclick="document.getElementById('file-input').click()">Upload</button>
                <button class="nav-btn" onclick="generateAvatar()">Generate SVG</button>
            </div>

            <div class="nickname-inputs">
                <div class="nick-option selected" id="box-own-nick" onclick="focusOwnNickInput()">
                    <span style="font-size: 11px; color: var(--text-muted);">Custom Nickname</span>
                    <input type="text" id="input-own-nick" placeholder="Enter name..." oninput="updateNicknameValue(this.value, 'own')">
                </div>
                <div class="nick-option" id="box-club-nick" onclick="setNickType('club')">
                    <span style="font-size: 11px; color: var(--text-muted);">Assigned Club Nickname</span>
                    <div id="club-nick-label" style="font-family: 'Share Tech Mono', monospace; font-size: 14px; color: var(--accent-color); margin-top: 5px;">-</div>
                </div>
            </div>

            <button class="primary-action-btn" onclick="saveUserProfile(); portalTransition('block-hall')">ENTER CLUB →</button>
        </div>
    </div>

    <!-- BLOCK 4: HALL -->
    <div id="block-hall" class="block">
        <div class="hall-menu">
            <button class="hall-btn" onclick="portalTransition('block-server')">VERSES</button>
            <button class="hall-btn" onclick="portalTransition('block-bar')">BAR</button>
            <button class="hall-btn" onclick="portalTransition('block-tables')">TABLES</button>
            <button class="hall-btn" onclick="portalTransition('block-office')">OFFICE</button>
        </div>
    </div>

    <!-- MODAL PASSPORT -->
    <div id="modal-passport">
        <div class="passport-card">
            <button class="passport-close" onclick="closePassport()">×</button>
            <h3 style="font-family: 'Share Tech Mono', monospace; color: var(--accent-color); margin-bottom: 15px;">MEMBERSHIP DOSSIER</h3>
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px; text-align: left;">
                <img id="pass-avatar-img" src="" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent-color);">
                <div>
                    <div id="pass-id-val" style="font-family: 'Share Tech Mono', monospace; font-size: 14px; color: var(--accent-color);">GY-000000</div>
                    <div id="pass-status" style="font-size: 12px; color: var(--text-muted);">Authorized Resident</div>
                </div>
            </div>
            <div id="pass-qr-box" style="display: flex; justify-content: center; background: #fff; padding: 10px; border-radius: 4px;"></div>
        </div>
    </div>

    <!-- Audio Placeholders for README Architecture -->
    <audio id="snd-door" src="https://actions.google.com/sounds/v1/doors/wood_creak.ogg" preload="auto"></audio>
    <audio id="snd-ambient" src="https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg" preload="auto" loop></audio>

    <!-- CORE SCRIPTS & README LOGIC INTEGRATION -->
    <script>
        const APP_VERSION = "v1.0.4";
        let currentID = "";
        let currentUserImage = "";
        let currentBlockId = 'block-entrance';
        let selectedNickType = 'own';
        let userChosenNickname = '';

        let currentLangData = { code: 'en', name: 'English', flag: 'https://flagcdn.com/w20/gb.png' };
        const allLanguages = [
            { code: 'en', name: 'English', flag: 'https://flagcdn.com/w20/gb.png' },
            { code: 'ru', name: 'Русский', flag: 'https://flagcdn.com/w20/ru.png' },
            { code: 'es', name: 'Español', flag: 'https://flagcdn.com/w20/es.png' },
            { code: 'de', name: 'Deutsch', flag: 'https://flagcdn.com/w20/de.png' },
            { code: 'fr', name: 'Français', flag: 'https://flagcdn.com/w20/fr.png' },
            { code: 'it', name: 'Italiano', flag: 'https://flagcdn.com/w20/it.png' },
            { code: 'zh-CN', name: '中文', flag: 'https://flagcdn.com/w20/cn.png' },
            { code: 'ja', name: '日本語', flag: 'https://flagcdn.com/w20/jp.png' },
            { code: 'ar', name: 'العربية', flag: 'https://flagcdn.com/w20/sa.png' },
            { code: 'pt', name: 'Português', flag: 'https://flagcdn.com/w20/pt.png' },
            { code: 'uk', name: 'Українська', flag: 'https://flagcdn.com/w20/ua.png' },
            { code: 'pl', name: 'Polski', flag: 'https://flagcdn.com/w20/pl.png' }
        ];

        function safeStorageGet(key, fallback = "") { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } }
        function safeStorageSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

        function flagCodeToCountry(code) {
            const map = { 'en': 'gb', 'ru': 'ru', 'es': 'es', 'de': 'de', 'fr': 'fr', 'it': 'it', 'zh-CN': 'cn', 'ja': 'jp', 'ar': 'sa', 'pt': 'pt', 'uk': 'ua', 'pl': 'pl' };
            return map[code] || 'gb';
        }

        function updateGlobalFlagUI() {
            const savedFlag = safeStorageGet('gygy_flag') || safeStorageGet('gy_user_flag') || 'gb';
            const flagUrl = `https://flagcdn.com/w20/${savedFlag.toLowerCase()}.png`;
            
            const currentFlagEl = document.getElementById('current-flag');
            if (currentFlagEl) currentFlagEl.src = flagUrl;

            const savedLangName = safeStorageGet('gygy_lang_name');
            const langNameEl = document.getElementById('current-lang-name');
            if (savedLangName && langNameEl) langNameEl.innerText = savedLangName;
        }

        function toggleLangDropdown() {
            const list = document.getElementById('club-lang-list');
            if (list) list.classList.toggle('open');
        }

        function selectClubLanguage(langCode, langName, flagUrl) {
            currentLangData = { code: langCode, name: langName, flag: flagUrl };
            const countryCode = flagCodeToCountry(langCode);
            
            safeStorageSet('gygy_flag', countryCode);
            safeStorageSet('gy_user_flag', countryCode);
            safeStorageSet('gygy_lang_code', langCode);
            safeStorageSet('gygy_lang_name', langName);
            
            updateGlobalFlagUI();
            buildLanguageList(langCode);
        }

        function buildLanguageList(activeCode) {
            const listContainer = document.getElementById('club-lang-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';
            allLanguages.forEach(lang => {
                if (lang.code !== activeCode) {
                    const item = document.createElement('div');
                    item.className = 'club-lang-item';
                    item.onclick = () => selectClubLanguage(lang.code, lang.name, lang.flag);
                    item.innerHTML = `
                        <img class="item-flag" src="${lang.flag}" style="width:20px; height:14px; object-fit:cover;">
                        <span class="item-text">${lang.name}</span>
                    `;
                    listContainer.appendChild(item);
                }
            });
            listContainer.classList.remove('open');
        }

        window.addEventListener('click', (e) => {
            const wrapper = document.querySelector('.club-lang-dropdown-wrapper');
            const list = document.getElementById('club-lang-list');
            if (wrapper && list && !wrapper.contains(e.target)) {
                list.classList.remove('open');
            }
        });

        function setNickType(type) {
            selectedNickType = type;
            const boxOwn = document.getElementById('box-own-nick');
            const boxClub = document.getElementById('box-club-nick');
            if (type === 'own') {
                boxOwn.classList.add('selected');
                boxClub.classList.remove('selected');
            } else {
                boxClub.classList.add('selected');
                boxOwn.classList.remove('selected');
            }
        }

        function focusOwnNickInput() {
            setNickType('own');
            const input = document.getElementById('input-own-nick');
            if (input) input.focus();
        }

        function updateNicknameValue(val, type) {
            if (type === 'own') {
                userChosenNickname = val;
                safeStorageSet('gygy_nickname', val);
            }
        }

        function renderUserPassports(targetID) {
            const idLabel = document.getElementById('id-label');
            const passIdVal = document.getElementById('pass-id-val');
            const passQrBox = document.getElementById('pass-qr-box');
            
            if (idLabel) idLabel.innerText = targetID;
            if (passIdVal) passIdVal.innerText = targetID;
            
            if (passQrBox && typeof QRCode !== 'undefined') { 
                passQrBox.innerHTML = ""; 
                new QRCode(passQrBox, { text: targetID, width: 90, height: 90 }); 
            }

            let clubNick = safeStorageGet('gygy_club_nick');
            if (!clubNick) {
                const coolNicks = ["Magnate", "Striker", "Champagne", "Insider", "Phantom", "Maestro", "Prime", "Oracle"];
                clubNick = coolNicks[Math.floor(Math.random() * coolNicks.length)];
                safeStorageSet('gygy_club_nick', clubNick);
            }

            const clubNickLabel = document.getElementById('club-nick-label');
            if (clubNickLabel) clubNickLabel.innerText = clubNick;
        }

        function checkAndFillRegistrationForm() {
            const savedAvatar = safeStorageGet('gy_user_img') || safeStorageGet('gygy_avatar');
            currentID = safeStorageGet('gygy_id') || safeStorageGet('gy_user_id');

            if (currentID) { renderUserPassports(currentID); }

            const savedNickname = safeStorageGet('gygy_nickname') || '';
            const ownNickInput = document.getElementById('input-own-nick');
            if (ownNickInput && savedNickname) {
                ownNickInput.value = savedNickname;
                userChosenNickname = savedNickname;
            }

            if (savedAvatar) {
                currentUserImage = savedAvatar;
                const badgeImg = document.getElementById('badge-avatar-img');
                const passImg = document.getElementById('pass-avatar-img');
                if (badgeImg) badgeImg.src = savedAvatar;
                if (passImg) passImg.src = savedAvatar;

                if (savedAvatar.startsWith('data:image/svg+xml')) {
                    const avatarImg = document.getElementById('avatar-img'); if (avatarImg) { avatarImg.src = savedAvatar; avatarImg.style.display = "block"; }
                    const txtAvatar = document.getElementById('txt-photo'); if (txtAvatar) txtAvatar.style.display = "none";
                } else { 
                    const ppImg = document.getElementById('pp'); if (ppImg) { ppImg.src = savedAvatar; ppImg.style.display = "block"; }
                    const txtPhoto = document.getElementById('txt-photo'); if (txtPhoto) txtPhoto.style.display = 'none';
                }
            }
        }

        function handleNavigationBack() {
            if (currentBlockId === 'block-hall') {
                portalTransition('block-identity');
            } else if (currentBlockId === 'block-identity') {
                portalTransition('block-welcome');
            } else if (currentBlockId === 'block-welcome') {
                portalTransition('block-entrance');
            }
        }

        function portalTransition(nextId) {
            const ambientBar = document.getElementById('snd-ambient');
            if (ambientBar) { ambientBar.pause(); ambientBar.currentTime = 0; }

            if (nextId === 'block-server') { window.location.href = 'verses.html'; return; }
            if (nextId === 'block-bar') { window.location.href = 'bar.html'; return; }
            if (nextId === 'block-tables') { window.location.href = 'tables.html'; return; } 
            if (nextId === 'block-office') { window.location.href = 'office.html'; return; }

            const targetBlock = document.getElementById(nextId);
            if (!targetBlock) return;

            currentBlockId = nextId;
            const badge = document.getElementById('global-user-badge');
            const navArrows = document.getElementById('club-nav-arrows');

            document.querySelectorAll('.block').forEach(b => {
                b.classList.remove('active');
                b.style.display = 'none';
            });

            targetBlock.style.display = 'flex';
            setTimeout(() => { targetBlock.classList.add('active'); }, 20);

            if (nextId === 'block-entrance') {
                const mainDoor = document.getElementById('main-door');
                if (mainDoor) mainDoor.classList.remove('door-exploded');
                if (navArrows) navArrows.style.display = 'none';
                if (badge) badge.style.display = 'none';
            } else {
                if (navArrows) navArrows.style.display = 'flex';
                if (badge && currentUserImage) badge.style.display = 'block';
            }
        }

        function handleDoor() {
            const sndDoor = document.getElementById('snd-door');
            const sndAmbient = document.getElementById('snd-ambient');
            const mainDoor = document.getElementById('main-door');

            if (sndDoor) sndDoor.play();
            if (mainDoor) mainDoor.classList.add('door-exploded');

            setTimeout(() => {
                if (sndAmbient) {
                    sndAmbient.volume = 0.5;
                    sndAmbient.play().catch(e => console.log("Ambient blocked"));
                }
                portalTransition('block-welcome');
            }, 700);
        }

        function preview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUserImage = e.target.result;
                    const pp = document.getElementById('pp'); if (pp) { pp.src = currentUserImage; pp.style.display = 'block'; }
                    const txtPhoto = document.getElementById('txt-photo'); if (txtPhoto) txtPhoto.style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function generateAvatar() {
            const hex = Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><rect width="100" height="100" fill="#${hex}"/><circle cx="50" cy="40" r="20" fill="#000000"/></svg>`;
            currentUserImage = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
            const avatarImg = document.getElementById('avatar-img'); if (avatarImg) { avatarImg.src = currentUserImage; avatarImg.style.display = "block"; }
            const txtPhoto = document.getElementById('txt-photo'); if (txtPhoto) txtPhoto.style.display = 'none';
        }

        function saveUserProfile() {
            if (!currentUserImage) return;
            let finalNick = selectedNickType === 'club' ? (safeStorageGet('gygy_club_nick') || 'Magnate') : (userChosenNickname || 'Anonymous');
            
            safeStorageSet('gygy_nickname', finalNick);
            safeStorageSet('gygy_avatar', currentUserImage);
            safeStorageSet('gy_user_img', currentUserImage);
            safeStorageSet('gy_user_id', currentID);

            const badgeImg = document.getElementById('badge-avatar-img');
            const passImg = document.getElementById('pass-avatar-img');
            if (badgeImg) badgeImg.src = currentUserImage;
            if (passImg) passImg.src = currentUserImage;

            const badge = document.getElementById('global-user-badge');
            if (badge) badge.style.display = 'block';
        }

        function openPassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) { modal.style.display = 'flex'; setTimeout(() => { modal.style.opacity = '1'; }, 10); }
        }

        function closePassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) { modal.style.opacity = '0'; setTimeout(() => { modal.style.display = 'none'; }, 300); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            console.log(`GYGY Club Portal Initialized [Version: ${APP_VERSION}]`);
            if (!currentID) {
                currentID = "GY-" + Math.floor(100000 + Math.random() * 900000);
                safeStorageSet('gygy_id', currentID);
            }
            checkAndFillRegistrationForm();
            updateGlobalFlagUI();
            buildLanguageList(safeStorageGet('gygy_lang_code') || 'en');

            setTimeout(() => { document.body.classList.add('page-loaded'); }, 50);
        });
    </script>
</body>
</html>
