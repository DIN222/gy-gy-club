<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.6.16.35 CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #d4af37; --violet: #8A2BE2; }
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        
        html, body { 
            width: 100%; height: 100%; background: #000; color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin: 0;
            opacity: 0; transition: opacity 0.4s ease-in-out;
        }
        body.page-loaded { opacity: 1; }

        /* ЛОГОТИП GY-GY */
        .ui-header-right { 
            position: fixed; top: 18px; right: 25px; z-index: 1000000; 
            font-size: 24px; letter-spacing: 5px; font-weight: bold; 
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            user-select: none; pointer-events: none;
        }
        
        /* СКВОЗНОЙ АВАТАР */
        .ui-user-badge {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            width: 42px; height: 42px; border-radius: 50%;
            border: 2px solid var(--gold); background: #111;
            box-shadow: 0 0 0 1px #000, inset 0 0 5px rgba(0,0,0,0.8);
            z-index: 1000000; cursor: pointer; display: none;
        }
        .ui-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background-color: #fff; }
        .ui-user-badge .badge-flag {
            position: absolute; bottom: -2px; right: -4px;
            width: 17px; height: 12px; object-fit: cover;
            border: 1px solid var(--gold); box-shadow: 0 0 0 1px #000;
        }

        /* ПАСПОРТ */
        .passport-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .passport-card { background: #F5F5DC; border: 3px solid var(--gold); border-radius: 16px; padding: 25px; width: 280px; color: #000; text-align: center; box-shadow: 0 0 25px rgba(0,0,0,0.5); position: relative; }
        .passport-card .box-final { margin: 15px auto; border-color: #000; }
        .passport-close-btn { position: absolute; top: 10px; right: 14px; font-size: 28px; font-weight: bold; color: #000; cursor: pointer; line-height: 1; user-select: none; }
        .box-final { width: 85px; height: 85px; border: 2px solid #000; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }

        /* НАВИГАЦИОННЫЕ СТРЕЛКИ */
        .ui-nav-arrows {
            position: fixed; top: 18px; left: 20px; z-index: 9999999; 
            display: flex; gap: 20px; align-items: center; user-select: none;
            pointer-events: auto !important;
        }
        .arrow-item { 
            font-family: 'Share Tech Mono', monospace;
            font-size: 26px; font-weight: 900 !important; 
            color: var(--gold); cursor: pointer; display: inline-flex;
            align-items: center; line-height: 1; 
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            transition: opacity 0.2s; 
        }
        .arrow-item:hover { opacity: 0.8; }
        .arrow-item span:nth-child(2) { margin-left: -4px; }

        /* ХОЛЛ (ЦЕНТРАЛЬНАЯ СЦЕНА) */
        .hall-container {
            width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
        }
        .hall-scene {
            position: relative; width: 1000px; height: 562.5px;
            background: url('hall_bg_jpg.jpg') no-repeat center center / contain;
            transform: scale(min(100vw / 1000, 100vh / 562.5));
            transform-origin: center center;
        }

        /* АКТИВНЫЕ ЗОНЫ ХОЛЛА ПО АРХИТЕКТУРЕ */
        .hall-zone {
            position: absolute; cursor: pointer; display: flex; align-items: center; justify-content: center;
            background: rgba(138, 43, 226, 0.15); border: 1px dashed var(--violet); border-radius: 8px;
            transition: 0.3s;
        }
        .hall-zone:hover { background: rgba(138, 43, 226, 0.4); box-shadow: 0 0 15px var(--violet); }

        /* Точные координаты зон Холла */
        .zone-ai { top: 15%; left: 15%; width: 160px; height: 120px; }       /* 🟢 Левый Верх: AI-ROOM (verses.html) */
        .zone-office { top: 55%; left: 15%; width: 160px; height: 120px; }    /* 💼 Левый Низ: OFFICE (office.html) */
        .zone-studio { top: 15%; right: 15%; width: 160px; height: 120px; }   /* 🟠 Правый Верх: STUDIO (studio.html) */
        .zone-bar { top: 45%; left: 42%; width: 160px; height: 180px; }       /* 🟢 Центр: VIP БАР (bar.html) */

        /* Системные скрытые элементы перевода */
        .goog-te-banner-frame, .skiptranslate, iframe.goog-te-menu-frame { display: none !important; }
        font { background-color: transparent !important; color: inherit !important; }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- НАВИГАЦИЯ -->
    <div class="notranslate ui-nav-arrows" id="global-nav">
        <div class="arrow-item" onclick="leaveToEntrance()">&lt;&lt;</div>
    </div>

    <!-- АВАТАР И ПАСПОРТ -->
    <div id="global-user-badge" class="ui-user-badge notranslate" onclick="openPassport()">
        <img id="badge-avatar-img" class="badge-img" src="">
        <img id="badge-flag-img" class="badge-flag" src="https://flagcdn.com/w20/gb.png">
    </div>

    <div id="modal-passport" class="passport-overlay" onclick="closePassport()">
        <div class="passport-card" onclick="event.stopPropagation()">
            <div class="passport-close-btn" onclick="closePassport()">&times;</div>
            <div style="font-weight:900; font-size:16px; letter-spacing:1px;">GY-GY PASSPORT</div>
            <div id="pass-id-val" style="font-weight:700; font-size:13px; margin-top:5px; color:#555;">#ID</div>
            <div class="box-final" style="width:100px; height:100px; border-radius:50%; border:2px solid var(--gold);"><img id="pass-avatar-img" style="width:100%; height:100%; object-fit:cover; border-radius:50%; background-color:#fff;"></div>
            <div class="box-final" id="pass-qr-box" style="width:110px; height:110px; padding:5px;"></div>
            <div style="font-size:10px; font-weight:900; color:#333; margin-top:5px; text-transform:uppercase;">Click &times; or outside to close</div>
        </div>
    </div>

    <div id="google_translate_element" style="display:none;"></div>
    <div class="ui-header-right notranslate">GY-GY</div>

    <!-- ОСНОВНАЯ СЦЕНА ХОЛЛА И ПЕРЕХОДЫ -->
    <div class="hall-container">
        <div class="hall-scene">
            <!-- 🟢 Левый Верх: AI-ROOM (verses.html) -->
            <div class="hall-zone zone-ai" onclick="navigateTo('verses.html')" title="AI-ROOM: Verses & Modules (alien, moon, hello)"></div>
            
            <!-- 💼 Левый Низ: OFFICE (office.html) -->
            <div class="hall-zone zone-office" onclick="navigateTo('office.html')" title="OFFICE: Control Center & LIVE Log"></div>
            
            <!-- 🟠 Правый Верх: STUDIO (studio.html) -->
            <div class="hall-zone zone-studio" onclick="navigateTo('studio.html')" title="STUDIO: Atelier, Souvenirs & Vintage"></div>
            
            <!-- 🟢 Центр: VIP БАР (bar.html -> tables.html / openmic.html) -->
            <div class="hall-zone zone-bar" onclick="navigateTo('bar.html')" title="VIP BAR: Complaints, Tables & Open Mic"></div>
        </div>
    </div>

    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,de,es,fr,it,pl,pt,ru,tr,uk,zh-CN,ja',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }

        function safeStorageGet(key, fallback = "") { 
            try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } 
        }

        function syncUserBadge() {
            const currentUserImage = safeStorageGet('gygy_avatar') || safeStorageGet('gy_user_img') || safeStorageGet('gy_user_avatar');
            const currentID = safeStorageGet('gygy_id') || safeStorageGet('gy_user_id') || safeStorageGet('gy_trace');
            
            let savedFlag = safeStorageGet('gygy_flag', 'gb') || safeStorageGet('gy_user_flag', 'gb');
            if (savedFlag && savedFlag.includes('/')) {
                savedFlag = savedFlag.split('/').pop().replace('.png', '');
            }

            if (currentUserImage) {
                const badge = document.getElementById('global-user-badge');
                const badgeImg = document.getElementById('badge-avatar-img');
                const passImg = document.getElementById('pass-avatar-img');
                const badgeFlagImg = document.getElementById('badge-flag-img');
                
                if (badge) badge.style.display = 'block';
                if (badgeImg) badgeImg.src = currentUserImage;
                if (passImg) passImg.src = currentUserImage;
                if (badgeFlagImg && savedFlag) badgeFlagImg.src = `https://flagcdn.com/w20/${savedFlag.toLowerCase()}.png`;
            }

            if (currentID) {
                const passIdVal = document.getElementById('pass-id-val');
                const passQrBox = document.getElementById('pass-qr-box');
                if (passIdVal) passIdVal.innerText = currentID;
                if (passQrBox && typeof QRCode !== 'undefined') {
                    passQrBox.innerHTML = ""; 
                    new QRCode(passQrBox, { text: currentID, width: 100, height: 100 });
                }
            }
        }

        function navigateTo(url) {
            document.body.classList.remove('page-loaded');
            setTimeout(() => {
                window.location.href = url;
            }, 400);
        }

        function leaveToEntrance() {
            navigateTo('index.html');
        }

        function openPassport() { 
            const modal = document.getElementById('modal-passport'); 
            if (modal) { modal.style.display = 'flex'; setTimeout(() => modal.style.opacity = '1', 10); } 
        }
        function closePassport() { 
            const modal = document.getElementById('modal-passport'); 
            if (modal) { modal.style.opacity = '0'; setTimeout(() => modal.style.display = 'none', 300); } 
        }

        document.addEventListener("DOMContentLoaded", () => {
            syncUserBadge();

            const savedLangCode = safeStorageGet('gy_lang', 'EN').toLowerCase();
            setTimeout(() => {
                const selectEl = document.querySelector('.goog-te-combo');
                if (selectEl) { 
                    selectEl.value = savedLangCode === 'ua' ? 'uk' : savedLangCode; 
                    selectEl.dispatchEvent(new Event('change', { bubbles: true })); 
                }
            }, 800);

            const script = document.createElement('script'); 
            script.type = 'text/javascript';
            script.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
            document.head.appendChild(script);
            
            document.body.classList.add('page-loaded');
        });
    </script>
</body>
</html>
