<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.6.45 CORE + Audio Files</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #FFD700; --door-wood: #3E2723; --violet: #8A2BE2; --neon-glow: rgba(138, 43, 226, 0.6); }
        
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        body, button, input, div, img, span { pointer-events: auto !important; }
        img { -webkit-user-drag: none !important; }

        html, body { 
            width: 100%; height: 100%; background: #000000; color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin: 0; padding: 0;
        }
        
        button, .ui-user-badge, .arrow-item, .painting-zone, #main-door, .box-final, .reg-square {
            transition: all 0.3s ease !important;
        }
        button:hover, .ui-user-badge:hover, .arrow-item:hover, .painting-zone:hover, #main-door:hover, .box-final:hover, .reg-square:hover {
            filter: brightness(1.1);
        }

        .ui-header-right { 
            position: fixed; top: 18px; right: 25px; z-index: 1000000; 
            font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif;
            text-shadow: -1px -1px 0 #000000, 1px -1px 0 #000000, -1px 1px 0 #000000, 1px 1px 0 #000000;
        }
        
        .ui-user-badge {
            position: fixed; top: 4px; left: 50%; transform: translateX(-50%);
            width: 36px; height: 36px; border-radius: 50%;
            border: 2px solid var(--gold); background: #111111;
            box-shadow: 0 0 0 1px #000000, inset 0 0 5px rgba(0,0,0,0.8);
            z-index: 1000000; cursor: pointer; display: none;
        }
        .ui-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background-color: #ffffff; }
        .ui-user-badge .badge-flag {
            position: absolute; bottom: -2px; right: -4px;
            width: 14px; height: 10px; object-fit: cover;
            border: 1px solid var(--gold); box-shadow: 0 0 0 1px #000000;
        }

        .club-lang-dropdown-wrapper {
            position: absolute; top: 18px; left: 20px; z-index: 1000001;
            width: 155px; font-family: 'Share Tech Mono', monospace;
        }
        
        .club-lang-current {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold);
            padding: 5px 8px; border-radius: 10px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.9); width: 100%;
        }
        .club-lang-current-content { display: flex; align-items: center; gap: 7px; min-width: 0; }
        .club-lang-current .item-avatar {
            width: 20px; height: 20px; border-radius: 50%; overflow: hidden;
            border: 1px solid var(--gold); background: #111; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .club-lang-current .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .club-lang-current .item-flag { width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
        .club-lang-current .item-text { color: var(--gold); font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .club-lang-current .arrow-down { color: var(--gold); font-size: 10px; font-weight: bold; flex-shrink: 0; }

        .club-lang-list {
            position: absolute; top: calc(100% + 5px); left: 0;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold);
            border-radius: 10px; width: 100%; max-height: 260px; overflow-y: auto;
            display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.9); z-index: 1000002;
        }
        .club-lang-list.open { display: block; }
        
        .club-lang-item {
            display: flex; align-items: center; gap: 7px;
            padding: 6px 8px; cursor: pointer; border-bottom: 1px solid rgba(255,215,0,0.15);
            transition: background 0.2s;
        }
        .club-lang-item:last-child { border-bottom: none; }
        .club-lang-item:hover { background: rgba(255,215,0,0.15); }
        .club-lang-item .item-avatar {
            width: 20px; height: 20px; border-radius: 50%; overflow: hidden;
            border: 1px solid var(--gold); background: #111; flex-shrink: 0;
        }
        .club-lang-item .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .club-lang-item .item-flag { width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
        .club-lang-item .item-text { color: var(--gold); font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .passport-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .passport-card { background: #F5F5DC; border: 3px solid var(--gold); border-radius: 16px; padding: 25px; width: 280px; color: #000000; text-align: center; box-shadow: 0 0 25px rgba(0,0,0,0.5); position: relative; }
        .passport-card .box-final { margin: 15px auto; border-color: #000000; }
        .passport-close-btn { position: absolute; top: 10px; right: 14px; font-size: 28px; font-weight: bold; color: #000000; cursor: pointer; line-height: 1; user-select: none; }

        .block { 
            position: fixed; inset: 0; display: none; flex-direction: column; 
            align-items: center; justify-content: center; background: #000000; 
            z-index: 10; opacity: 0; transition: opacity 1.2s ease-in-out; 
        }
        .block.active { display: flex !important; opacity: 1 !important; z-index: 5000 !important; }

        .quote-text { font-family: 'Cormorant Garamond', 'Playfair Display', serif; font-style: italic; font-size: 20px; text-align: center; max-width: 85%; margin-bottom: 8px; text-shadow: 2px 2px 4px #000000; }
        .btn-gy { min-width: 240px; padding: 10px 18px; background: #000000; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 700; margin: 4px 0; font-family: 'Montserrat', 'Cinzel', sans-serif; font-size: 12px; }
        
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; cursor: not-allowed; }
        .box-final { width: 75px; height: 75px; border: 2px solid var(--gold); background: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }

        .registration-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 330px;
            margin-bottom: 12px;
        }
        .reg-square {
            width: 100%;
            height: 75px;
            border: 2px solid var(--gold);
            background: #ffffff; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            color: #000000;
            padding: 4px;
            text-align: center;
            overflow: hidden;
        }
        .reg-square.selected { border-color: #ffffff; box-shadow: 0 0 10px var(--gold); }
        
        .reg-square input[type="text"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: none;
            outline: none;
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            font-weight: bold;
            color: #000000;
            padding: 0 4px;
            z-index: 3;
            box-sizing: border-box;
            opacity: 1 !important;
            cursor: text !important;
        }
        .reg-square input[type="text"]::placeholder {
            color: #888888;
            font-size: 9px;
            text-transform: uppercase;
        }

        .reg-square img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
        }
        #qr-box-reg canvas, #qr-box-reg img {
            max-width: 64px !important;
            max-height: 64px !important;
            width: auto !important;
            height: auto !important;
            display: block;
            margin: auto;
        }

        #block-welcome { justify-content: center !important; padding-top: 0 !important; }
        #block-welcome img { max-height: 22vh !important; width: auto; object-fit: contain; margin: 6px 0 !important; filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)); }
        #block-welcome .welcome-title-elem { font-size: 24px !important; font-weight: 700; letter-spacing: 8px; font-style: italic; margin-bottom: 6px !important; font-family: 'Cinzel', serif; }

        .ui-nav-arrows {
            position: fixed; top: 18px; left: 20px; z-index: 9999999; 
            display: flex; gap: 15px; font-size: 24px; font-weight: 900 !important; 
            font-family: 'Share Tech Mono', monospace; cursor: pointer; color: var(--gold); 
            line-height: 1; letter-spacing: -2px; background: transparent !important; border: none !important;
            text-shadow: -1px -1px 0 #000000, 1px -1px 0 #000000, -1px 1px 0 #000000, 1px 1px 0 #000000;
            pointer-events: auto !important; user-select: none;
        }
        .arrow-item { transition: opacity 0.2s, transform 0.2s; background: transparent !important; border: none !important; }
        .arrow-item:hover { opacity: 0.8; transform: scale(1.1); }

        #block-hall { background: url('hall_bg_jpg.jpg') center/cover no-repeat #000000; }
        .hall-interior { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
        
        .hall-interior .quote-text { 
            position: absolute; top: 30vh; left: 50%; transform: translateX(-50%); 
            width: 85%; margin: 0; text-align: center; padding: 0;
            background: transparent !important; color: var(--gold) !important;        
            font-size: 24px; font-weight: 700; -webkit-text-stroke: 1px #000000; text-stroke: 1px #000000;
        }
        .hall-door-target {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 24vw; height: 60vh; cursor: pointer; z-index: 5; background: transparent;
        }

        .painting-zone {
            position: absolute; top: 25vh; width: 6vw; height: 12vh; 
            cursor: pointer; z-index: 6; background: transparent;
            display: flex; align-items: center; justify-content: center;
        }
        .painting-left { left: 23vw; }
        .painting-right { right: 23vw; }

        .cue-arrow-hall { 
            color: var(--violet); font-size: 34px; font-weight: 900; font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 12px var(--violet), 0 0 20px var(--violet); pointer-events: none; user-select: none; z-index: 10;
        }
        .painting-zone:hover .cue-arrow-hall { opacity: 0.8; }

        .manifest-btn-box { 
            position: absolute; bottom: -45px; left: 50%; transform: translateX(-50%); 
            width: 130px; display: flex; flex-direction: column; gap: 5px;
            justify-content: center; opacity: 0; pointer-events: none; 
            transition: opacity 0.4s, bottom 0.4s; z-index: 10; 
        }
        .btn-manifest { width: 100%; padding: 5px 0; font-size: 11px; margin: 0; background: #000000; box-shadow: 0 4px 10px rgba(0,0,0,0.9); }
        
        .goog-te-banner-frame, .skiptranslate, iframe.goog-te-menu-frame { display: none !important; }
        body { top: 0 !important; background-color: #000000 !important; opacity: 0; transition: opacity 1.2s ease-in-out !important; }
        body.page-loaded { opacity: 1 !important; }
        
        font { background-color: transparent !important; background: transparent !important; color: inherit !important; box-shadow: none !important; text-shadow: none !important; }
        .goog-text-highlight { background-color: transparent !important; background: transparent !important; box-shadow: none !important; color: inherit !important; }
        
        #main-door {
            display: block; height: 48vh; max-height: 400px; width: auto; max-width: 100%;
            object-fit: contain; margin: 0 auto; transform: scale(1);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease-out; cursor: pointer;
        }
        .door-exploded { transform: scale(3.5) !important; opacity: 0 !important; }
        #block-identity { justify-content: flex-start !important; padding-top: 50px !important; }
        #block-identity .quote-text { margin-top: 10px; margin-bottom: 20px; }
    </style>
</head>

                txt_photo: "ФОТО",
                txt_avatar: "АВАТАР",
                nick_club: "НИК КЛУБА",
                btn_save: "СОХРАНИТЬ",
                btn_proceed: "ДАЛЕЕ",
                pass_title: "ПАСПОРТ GY-GY",
                pass_close_hint: "Нажмите × или вне окна для закрытия",
                btn_ai_room: "КОМНАТА ИИ",
                btn_office: "ОФИС",
                btn_studio: "СТУДИЯ"
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('page-loaded');
            document.getElementById('id-label').innerText = '#' + currentUserId;
            generateQR(currentUserId.toString(), 'qr-box-reg', 64);
            
            const savedProfile = localStorage.getItem('gy_user_profile');
            if (savedProfile) {
                try {
                    const data = JSON.parse(savedProfile);
                    currentUserId = data.id || currentUserId;
                    currentUserAvatar = data.avatar || '';
                    currentUserFlag = data.flag || currentUserFlag;
                    currentNickname = data.nick || currentNickname;
                    
                    if (currentUserAvatar) {
                        document.getElementById('badge-avatar-img').src = currentUserAvatar;
                        document.getElementById('pass-avatar-img').src = currentUserAvatar;
                        document.getElementById('global-user-badge').style.display = 'block';
                    }
                    document.getElementById('badge-flag-img').src = currentUserFlag;
                    document.getElementById('btn-w-hall').classList.remove('btn-sleep');
                    document.getElementById('btn-pass').classList.remove('btn-sleep');
                } catch(e) {}
            }
        });

        function portalTransition(targetBlockId) {
            const activeBlock = document.querySelector('.block.active');
            if (activeBlock && activeBlock.id === targetBlockId) return;
            
            if (activeBlock) {
                activeBlock.style.opacity = '0';
                setTimeout(() => {
                    activeBlock.classList.remove('active');
                    activateBlock(targetBlockId);
                }, 600);
            } else {
                activateBlock(targetBlockId);
            }
        }

        function activateBlock(blockId) {
            const target = document.getElementById(blockId);
            if (!target) return;
            target.style.display = 'flex';
            setTimeout(() => {
                target.style.opacity = '1';
                target.classList.add('active');
            }, 50);

            if (blockId !== 'block-entrance') {
                document.getElementById('club-nav-arrows').style.display = 'flex';
                if (navigationHistory[navigationHistory.length - 1] !== blockId) {
                    navigationHistory.push(blockId);
                }
            } else {
                document.getElementById('club-nav-arrows').style.display = 'none';
                navigationHistory = ['block-entrance'];
            }
        }

        function handleNavigationBack() {
            if (navigationHistory.length > 1) {
                navigationHistory.pop();
                const prevBlock = navigationHistory[navigationHistory.length - 1];
                portalTransition(prevBlock);
            } else {
                portalTransition('block-entrance');
            }
        }

        function handleDoor() {
            playSound('sound-door');
            const door = document.getElementById('main-door');
            door.classList.add('door-exploded');
            setTimeout(() => {
                portalTransition('block-welcome');
                setTimeout(() => {
                    door.classList.remove('door-exploded');
                }, 800);
            }, 500);
        }

        function toggleLangDropdown() {
            document.getElementById('club-lang-list').classList.toggle('open');
        }

        function selectClubLanguage(langCode, langName, flagUrl) {
            document.getElementById('current-lang-name').innerText = langName;
            document.getElementById('current-flag').src = flagUrl;
            currentUserFlag = flagUrl;
            document.getElementById('badge-flag-img').src = flagUrl;
            document.getElementById('club-lang-list').classList.remove('open');
            applyTranslations(langCode);
        }

        function applyTranslations(lang) {
            const dict = translations[lang] || translations['en'];
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (dict[key]) {
                    el.innerText = dict[key];
                }
            });
        }

        function preview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUserAvatar = e.target.result;
                    const pp = document.getElementById('pp');
                    pp.src = currentUserAvatar;
                    pp.style.display = 'block';
                    document.getElementById('txt-photo').style.display = 'none';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function generateAvatar() {
            const avatars = [
                'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
                'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150',
                'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150',
                'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150'
            ];
            currentUserAvatar = avatars[Math.floor(Math.random() * avatars.length)];
            const img = document.getElementById('avatar-img');
            img.src = currentUserAvatar;
            img.style.display = 'block';
            document.getElementById('txt-avatar').style.display = 'none';
        }

        function setNickType(type) {
            nickTypeMode = type;
            if(type === 'own') {
                document.getElementById('box-own-nick').classList.add('selected');
                document.getElementById('box-club-nick').classList.remove('selected');
            } else {
                document.getElementById('box-club-nick').classList.add('selected');
                document.getElementById('box-own-nick').classList.remove('selected');
            }
        }

        function updateNicknameValue(val, type) {
            if(type === 'own' && val.trim() !== '') {
                currentNickname = val.trim();
            }
        }

        function generateClubNick() {
            setNickType('club');
            const prefixes = ['GY', 'VIP', 'CHAMP', 'CLUB', 'BARON'];
            const suffixes = ['MEMBER', 'GUEST', 'ELITE', 'BOSS', 'MASTER'];
            currentNickname = prefixes[Math.floor(Math.random() * prefixes.length)] + '-' + suffixes[Math.floor(Math.random() * suffixes.length)] + Math.floor(Math.random()*90 + 10);
            document.getElementById('club-nick-label').innerText = currentNickname;
        }

        function generateQR(text, containerId, size) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            new QRCode(container, {
                text: text,
                width: size,
                height: size,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

      function saveUserProfile() {
    try {
        playSound('sound-fanfare');
        setTimeout(() => playSound('sound-applause'), 400);
    } catch(e) {}

    const profileData = {
        id: currentUserId,
        avatar: currentUserAvatar,
        flag: currentUserFlag,
        nick: currentNickname
    };
    
    try {
        localStorage.setItem('gy_user_profile', JSON.stringify(profileData));
        
        if (currentUserAvatar) {
            const badgeImg = document.getElementById('badge-avatar-img');
            const passImg = document.getElementById('pass-avatar-img');
            const globalBadge = document.getElementById('global-user-badge');
            
            if (badgeImg) badgeImg.src = currentUserAvatar;
            if (passImg) passImg.src = currentUserAvatar;
            if (globalBadge) globalBadge.style.display = 'block';
        }
        
        const passQrBox = document.getElementById('pass-qr-box');
        if (passQrBox) {
            generateQR(currentUserId.toString(), 'pass-qr-box', 90);
        }
        
        const btnWHall = document.getElementById('btn-w-hall');
        const btnPass = document.getElementById('btn-pass');
        if (btnWHall) btnWHall.classList.remove('btn-sleep');
        if (btnPass) btnPass.classList.remove('btn-sleep');
    } catch(e) {
        console.error("Save error:", e);
    }

    // Гарантированный переход в блок холла в самом конце
    portalTransition('block-hall');
}
        function openPassport() {
            playSound('sound-pour');
            const modal = document.getElementById('modal-passport');
            modal.style.display = 'flex';
            setTimeout(() => modal.style.opacity = '1', 10);
            document.getElementById('pass-id-val').innerText = '#' + currentUserId;
        }

        function closePassport() {
            const modal = document.getElementById('modal-passport');
            modal.style.opacity = '0';
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function toggleManifest(boxId) {
            playSound('sound-pour');
            const box = document.getElementById(boxId);
            const isOpened = box.getAttribute('data-opened') === 'true';
            document.querySelectorAll('.manifest-btn-box').forEach(b => {
                b.style.opacity = '0';
                b.style.bottom = '-45px';
                b.setAttribute('data-opened', 'false');
                b.style.pointerEvents = 'none';
            });
            if (!isOpened) {
                box.style.opacity = '1';
                box.style.bottom = '-75px';
                box.setAttribute('data-opened', 'true');
                box.style.pointerEvents = 'auto';
            }
        }

        function enterStudio() { portalTransition('block-hall'); }
        function enterStaffOffice() { portalTransition('block-hall'); }
    </script>
</body>
</html>
