<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global Club Portal v1.2.0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Подключаем библиотеку для QR-кодов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #0b0b0b; --text: #f0f0f0; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .block { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; opacity: 0; transition: opacity 0.4s ease; text-align: center; }
        .block.active { display: flex; opacity: 1; }
        .btn-sleep { opacity: 0.5; pointer-events: none; }
        .flag-icon { width: 24px; height: 16px; object-fit: cover; border-radius: 2px; }
        .member-counter { background: var(--gold); color: #000; padding: 2px 6px; border-radius: 10px; font-weight: bold; font-size: 12px; cursor: pointer; }
        
        /* Языковая панель */
        #lang-switcher { position: fixed; top: 20px; right: 20px; z-index: 100; cursor: pointer; }
        #lang-list-container { display: none; position: absolute; right: 0; top: 45px; background: #1a1a1a; border: 1px solid var(--gold); z-index: 101; max-height: 250px; overflow-y: auto; width: 180px; text-align: left; }
        .lang-item { display: flex; align-items: center; padding: 8px 12px; cursor: pointer; gap: 10px; border-bottom: 1px solid #333; }
        .lang-item:hover { background: #333; }

        /* Дверь входа */
        .door-container { border: 2px solid var(--gold); padding: 40px 60px; cursor: pointer; transition: all 0.3s; background: #141414; border-radius: 8px; }
        .door-container:hover { background: #1f1f1f; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); transform: scale(1.02); }

        /* Кнопки и инпуты */
        button, .interactive-box { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 12px 20px; margin: 8px 0; cursor: pointer; font-family: inherit; font-weight: bold; width: 80%; max-width: 300px; border-radius: 4px; text-transform: uppercase; transition: all 0.2s; }
        button:hover { background: var(--gold); color: #000; }
        .interactive-box { display: flex; align-items: center; justify-content: center; background: #141414; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; }
    </style>
</head>
<body>

    <!-- Плавающий переключатель языков -->
    <div id="lang-switcher" onclick="toggleLangList()">
        <div id="active-lang-display" style="display:flex; align-items:center; gap:8px; background:#1a1a1a; padding:8px 14px; border:1px solid var(--gold); border-radius:4px;">
            <img src="https://flagcdn.com/w40/gb.png" class="flag-icon">
            <span style="color:var(--gold); font-weight:900;">ENGLISH</span>
        </div>
        <div id="lang-list-container"></div>
    </div>

    <!-- Блок 1: Вход (Entrance с Дверью) -->
    <div id="block-entrance" class="block active">
        <div class="door-container" onclick="handleDoor()">
            <h1 id="main-door-text" style="color: var(--gold); margin: 0; font-size: 22px;">[ OPEN CLUB DOOR ]</h1>
        </div>
    </div>

    <!-- Блок 2: Приветствие (Welcome) -->
    <div id="block-welcome" class="block">
        <p id="welcome-quote-charlie" style="font-style: italic; opacity: 0.8;"></p>
        <p id="welcome-quote-joke" style="color: var(--gold);"></p>
        <h2 id="welcome-title" style="letter-spacing: 2px; margin: 20px 0;"></h2>
        <button id="btn-w-hall" class="btn-sleep" onclick="portalTransition('block-hall')">PROCEED TO HALL</button>
        <button id="btn-w-getid" onclick="portalTransition('block-identity')">GET YOUR ID</button>
    </div>

    <!-- Блок 3: Идентификация (Identity / Регистрация) -->
    <div id="block-identity" class="block">
        <p id="identity-quote" style="margin-bottom: 20px;"></p>
        
        <div style="display:flex; gap:15px; margin-bottom:15px; justify-content:center;">
            <div onclick="document.getElementById('file-input').click()" style="border:1px dashed var(--gold); width:90px; height:90px; display:flex; align-items:center; justify-content:center; cursor:pointer; background:#141414; border-radius:4px; overflow:hidden;">
                <span id="txt-photo" style="font-size: 11px; padding: 5px;">UPLOAD PHOTO</span>
                <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
            </div>
            <div onclick="generateAvatar()" style="border:1px dashed var(--gold); width:90px; height:90px; display:flex; align-items:center; justify-content:center; cursor:pointer; background:#141414; border-radius:4px; overflow:hidden;">
                <span id="txt-avatar" style="font-size: 11px; padding: 5px;">GENERATE AVATAR</span>
                <img id="avatar-img" style="display:none; width:100%; height:100%; object-fit:cover;">
            </div>
        </div>
        <input type="file" id="file-input" style="display:none" onchange="preview(this)">
        
        <div class="interactive-box" onclick="promptNickname()">
            <span id="txt-nick">ENTER NICKNAME</span>
            <span id="nick-filled-status" style="display:none; color:var(--gold);"></span>
        </div>
        <div class="interactive-box" onclick="generateClubNickname()">
            <span id="txt-auto-nick">RANDOM NICK</span>
            <span id="auto-nick-filled-status" style="display:none; color:var(--gold);"></span>
        </div>
        <div class="interactive-box" onclick="promptEmail()">
            <span id="txt-email">ENTER EMAIL</span>
            <span id="email-filled-status" style="display:none; color:var(--gold);">SAVED</span>
        </div>
        <div class="interactive-box" onclick="promptExternalContact()" style="margin-bottom: 20px;">
            <span id="txt-social">LINK SOCIAL</span>
            <span id="social-status-icon" style="display:none; color:var(--gold);">LINKED</span>
        </div>

        <button id="btn-save" onclick="saveUserProfile()">SAVE PROFILE</button>
        <button id="btn-pass" class="btn-sleep" onclick="portalTransition('block-hall')">ENTER HALL</button>
        <div id="qr-box-reg" style="margin-top:15px;"></div>
    </div>

    <!-- Блок 4: Зал (Hall) -->
    <div id="block-hall" class="block">
        <p id="hall-quote" style="margin-bottom: 30px;"></p>
        <button onclick="openPassport()">OPEN PASSPORT</button>
        <button onclick="window.location.href='club-map.html'">OPEN CLUB MAP</button>
        <button onclick="portalTransition('block-identity')">EDIT PROFILE</button>
    </div>

    <!-- Модальное окно паспорта -->
    <div id="modal-passport" class="modal" onclick="closePassport()">
        <div style="background:#141414; border:2px solid var(--gold); padding:25px; width:280px; text-align:center; border-radius:8px;" onclick="event.stopPropagation()">
            <h3 style="color:var(--gold); margin-top:0;">CLUB PASSPORT</h3>
            <img id="pass-avatar-img" style="width:80px; height:80px; border-radius:50%; border:2px solid var(--gold); object-fit:cover; margin-bottom: 10px;">
            <p id="pass-nickname" style="font-weight:bold; font-size:16px; margin:5px 0;">@GUEST</p>
            <p id="pass-email" style="font-size: 13px; opacity: 0.8; margin: 5px 0;"></p>
            <div id="pass-qr-box" style="margin:15px auto; display:flex; justify-content:center;"></div>
            <p id="pass-footer-text" style="font-size:11px; opacity: 0.7; margin-bottom: 20px;"></p>
            <button onclick="closePassport()" style="width:100%;">CLOSE</button>
        </div>
    </div>

    <!-- Модальное окно списка резидентов языка -->
    <div id="modal-users-list" class="modal" onclick="closeUsersList()">
        <div style="background:#f0f0f0; color:#000; padding:20px; width:300px; border-radius:8px; text-align:left;" onclick="event.stopPropagation()">
            <h3 id="users-list-title" style="margin-top:0; border-bottom: 2px solid var(--gold); padding-bottom: 8px;">RESIDENTS</h3>
            <div id="users-list-content" style="max-height:250px; overflow-y:auto;"></div>
            <button onclick="closeUsersList()" style="margin-top:15px; width:100%; background:#000; color:#fff; border:none;">CLOSE</button>
        </div>
    </div>

    <!-- Подключаем внешние модули данных и переводов -->
    <script src="userlang-data.js"></script>
    <script src="translations.js"></script>

    <script>
        const APP_VERSION = "v1.2.0-MODULAR";

        let currentBlockId = 'block-entrance';
        let currentActiveCode = 'en';
        let currentFlagCode = 'gb';
        let currentUserImage = '';
        let tempNickname = '';
        let isAutoNickname = false;
        let tempEmail = '';
        let currentID = '';

        function runGlobalDispatcher(langCode) {
            const dict = translations[langCode] || translations['en'];
            const getEl = (id) => document.getElementById(id);

            if (getEl('main-door-text')) getEl('main-door-text').innerText = "[ OPEN CLUB DOOR ]";
            if (getEl('welcome-quote-charlie')) getEl('welcome-quote-charlie').innerText = dict.charlie;
            if (getEl('welcome-quote-joke')) getEl('welcome-quote-joke').innerText = dict.joke;
            if (getEl('welcome-title')) getEl('welcome-title').innerText = dict.welcome;
            if (getEl('btn-w-hall')) getEl('btn-w-hall').innerText = dict.proceedHall;
            if (getEl('btn-w-getid')) getEl('btn-w-getid').innerText = dict.getId;
            if (getEl('identity-quote')) getEl('identity-quote').innerText = dict.champagne;
            if (getEl('txt-photo')) getEl('txt-photo').innerText = dict.orPhoto;
            if (getEl('txt-avatar')) getEl('txt-avatar').innerText = dict.orAvatar;
            if (getEl('txt-nick')) getEl('txt-nick').innerText = dict.yourNick;
            if (getEl('txt-auto-nick')) getEl('txt-auto-nick').innerText = dict.autoNick;
            if (getEl('txt-email')) getEl('txt-email').innerText = dict.setEmail;
            if (getEl('txt-social')) getEl('txt-social').innerText = dict.linkMsg;
            if (getEl('btn-save')) getEl('btn-save').innerText = dict.save;
            if (getEl('btn-pass')) getEl('btn-pass').innerText = dict.proceed;
            if (getEl('hall-quote')) getEl('hall-quote').innerText = dict.joke;
            if (getEl('pass-footer-text')) getEl('pass-footer-text').innerHTML = dict.closeHint;
        }

        function safeStorageGet(key, fallback = "") { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } }
        function safeStorageSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

        function generateClubNickname() {
            const randPre = clubPrefixes[Math.floor(Math.random() * clubPrefixes.length)];
            const randSuf = clubSuffixes[Math.floor(Math.random() * clubSuffixes.length)];
            isAutoNickname = true;
            updateNicknameUI(`${randPre}_${randSuf}`);
        }

        function promptNickname() {
            const userNick = prompt("ENTER NICKNAME (MAX 15 CHARS):", isAutoNickname ? "" : tempNickname);
            if (userNick !== null) {
                isAutoNickname = false;
                updateNicknameUI(userNick.trim().substring(0, 15));
            }
        }

        function updateNicknameUI(nick) {
            tempNickname = nick;
            const filledStatus = document.getElementById('nick-filled-status');
            const txtNick = document.getElementById('txt-nick');
            const autoFilledStatus = document.getElementById('auto-nick-filled-status');
            const txtAutoNick = document.getElementById('txt-auto-nick');
            const passNick = document.getElementById('pass-nickname');

            if (filledStatus) filledStatus.style.display = 'none';
            if (txtNick) txtNick.style.display = 'block';
            if (autoFilledStatus) autoFilledStatus.style.display = 'none';
            if (txtAutoNick) txtAutoNick.style.display = 'block';

            if (nick && nick.trim() !== '') {
                if (isAutoNickname) {
                    if (autoFilledStatus) { autoFilledStatus.innerText = "@" + nick; autoFilledStatus.style.display = 'block'; }
                    if (txtAutoNick) txtAutoNick.style.display = 'none';
                } else {
                    if (filledStatus) { filledStatus.innerText = "@" + nick; filledStatus.style.display = 'block'; }
                    if (txtNick) txtNick.style.display = 'none';
                }
                if (passNick) passNick.innerText = '@' + nick;
            } else {
                if (passNick) passNick.innerText = '@GUEST_HUMORIST';
            }
        }

        function promptEmail() {
            const userEmail = prompt("ENTER EMAIL ADDRESS:", tempEmail);
            if (userEmail !== null) {
                tempEmail = userEmail.trim();
                const filledStatus = document.getElementById('email-filled-status');
                const txtEmail = document.getElementById('txt-email');
                const passEmail = document.getElementById('pass-email');
                if (tempEmail !== '') {
                    if (filledStatus) filledStatus.style.display = 'block';
                    if (txtEmail) txtEmail.style.display = 'none';
                    if (passEmail) passEmail.innerText = tempEmail;
                } else {
                    if (filledStatus) filledStatus.style.display = 'none';
                    if (txtEmail) txtEmail.style.display = 'block';
                    if (passEmail) passEmail.innerText = '';
                }
            }
        }

        function promptExternalContact() {
            const currentContact = safeStorageGet('gygy_contact') || '';
            const userContact = prompt("ENTER TELEGRAM, INSTAGRAM OR X PROFILE LINK:", currentContact);
            if (userContact !== null) {
                const cleanContact = userContact.trim();
                safeStorageSet('gygy_contact', cleanContact);
                const statusIcon = document.getElementById('social-status-icon');
                const txtSocial = document.getElementById('txt-social');
                if (statusIcon) statusIcon.style.display = cleanContact !== '' ? 'block' : 'none';
                if (txtSocial) txtSocial.style.display = cleanContact !== '' ? 'none' : 'block';
            }
        }

        function renderLangList() {
            const container = document.getElementById('lang-list-container');
            if (!container) return;
            container.innerHTML = '';
            
            allLangs.forEach(lang => {
                if(lang.code === currentActiveCode) return;
                const div = document.createElement('div');
                div.className = 'lang-item notranslate';
                const stringifiedLang = JSON.stringify(lang).replace(/"/g, '&quot;');
                div.innerHTML = `
                    <div style="display:flex; align-items:center; flex-grow:1; gap:8px;" onclick="applyLanguage(${stringifiedLang})">
                        <img src="https://flagcdn.com/w40/${lang.c}.png" class="flag-icon">
                        <span style="color:#fff; font-size:13px;">${lang.n}</span>
                    </div>
                    ${lang.count > 0 ? `<span class="member-counter" onclick="event.stopPropagation(); openUsersList('${lang.c}')">${lang.count}</span>` : ''}
                `;
                container.appendChild(div);
            });
        }

        function applyLanguage(lang) {
            currentActiveCode = lang.code;
            currentFlagCode = lang.c;
            safeStorageSet('gygy_flag', lang.c);
            safeStorageSet('gy_lang', lang.code);
            
            const activeDisplay = document.getElementById('active-lang-display');
            if (activeDisplay) {
                activeDisplay.innerHTML = `
                    <img src="https://flagcdn.com/w40/${lang.c}.png" class="flag-icon">
                    <span style="color:var(--gold); font-weight:900;">${lang.n}</span>
                    ${lang.count > 0 ? `<span class="member-counter" style="margin-left: auto;" onclick="event.stopPropagation(); openUsersList('${lang.c}')">${lang.count}</span>` : ''}
                `;
            }
            
            const list = document.getElementById('lang-list-container');
            if (list) list.style.display = 'none';
            
            runGlobalDispatcher(lang.code);
            renderLangList();
        }

        function toggleLangList() {
            const list = document.getElementById('lang-list-container');
            if (list) list.style.display = (list.style.display === 'block') ? 'none' : 'block';
        }

        function renderUserPassports(targetID) {
            const qrBoxReg = document.getElementById('qr-box-reg');
            const passQrBox = document.getElementById('pass-qr-box');
            if (qrBoxReg && typeof QRCode !== 'undefined') { qrBoxReg.innerHTML = ""; new QRCode(qrBoxReg, { text: targetID, width: 60, height: 60 }); }
            if (passQrBox && typeof QRCode !== 'undefined') { passQrBox.innerHTML = ""; new QRCode(passQrBox, { text: targetID, width: 90, height: 90 }); }
        }

        function checkAndFillRegistrationForm() {
            const savedAvatar = safeStorageGet('gygy_avatar');
            const savedNickname = safeStorageGet('gygy_nickname');
            const savedEmail = safeStorageGet('gygy_email');
            currentID = safeStorageGet('gygy_id') || "GY-" + Math.floor(100000 + Math.random() * 900000);
            safeStorageSet('gygy_id', currentID);

            let savedLangCode = safeStorageGet('gy_lang') || 'en';
            let matchedLang = allLangs.find(l => l.code === savedLangCode) || allLangs[0];
            
            applyLanguage(matchedLang);
            renderUserPassports(currentID);

            if (savedNickname) updateNicknameUI(savedNickname);
            if (savedAvatar) {
                currentUserImage = savedAvatar;
                const badgeImg = document.getElementById('pass-avatar-img');
                if (badgeImg) badgeImg.src = savedAvatar;
                document.getElementById('btn-w-hall').classList.remove('btn-sleep');
                document.getElementById('btn-pass').classList.remove('btn-sleep');
            }
            if (savedEmail) {
                tempEmail = savedEmail;
                const passEmail = document.getElementById('pass-email');
                if (passEmail) passEmail.innerText = savedEmail;
            }
        }

        function portalTransition(nextId) {
            const targetBlock = document.getElementById(nextId);
            if (!targetBlock) return;
            currentBlockId = nextId;
            document.querySelectorAll('.block').forEach(b => { b.classList.remove('active'); b.style.display = 'none'; });
            targetBlock.style.display = 'flex';
            setTimeout(() => targetBlock.classList.add('active'), 20);
        }

        function handleDoor() {
            portalTransition('block-welcome');
        }

        function preview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUserImage = e.target.result;
                    const pp = document.getElementById('pp');
                    if (pp) { pp.src = currentUserImage; pp.style.display = 'block'; }
                    document.getElementById('txt-photo').style.display = 'none';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function generateAvatar() {
            const hex = Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><rect width="100" height="100" fill="#${hex}"/><circle cx="50" cy="40" r="20" fill="#000"/><path d="M20,90 C20,70 80,70 80,90" fill="#000"/></svg>`;
            currentUserImage = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
            const avatarImg = document.getElementById('avatar-img');
            if (avatarImg) { avatarImg.src = currentUserImage; avatarImg.style.display = "block"; }
            document.getElementById('txt-avatar').style.display = "none";
        }

        function saveUserProfile() {
            if (!currentUserImage) {
                alert("Please upload a photo or generate an avatar first!");
                return;
            }
            const nickname = tempNickname ? tempNickname : "GUEST";
            
            safeStorageSet('gygy_avatar', currentUserImage);
            safeStorageSet('gygy_nickname', nickname);
            safeStorageSet('gygy_email', tempEmail);

            const passImg = document.getElementById('pass-avatar-img');
            if (passImg) passImg.src = currentUserImage;

            document.getElementById('btn-w-hall').classList.remove('btn-sleep');
            document.getElementById('btn-pass').classList.remove('btn-sleep');

            registerCurrentUserToActiveLang(currentActiveCode, currentFlagCode, nickname, currentUserImage, safeStorageGet);
            renderLangList();
            alert("Profile successfully saved!");
        }

        function openPassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) { modal.style.display = 'flex'; setTimeout(() => modal.style.opacity = '1', 10); }
        }

        function closePassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) { modal.style.opacity = '0'; setTimeout(() => modal.style.display = 'none', 300); }
        }

        function openUsersList(countryCode) {
            const lang = allLangs.find(l => l.c === countryCode);
            if (!lang || !lang.users.length) return;

            document.getElementById('users-list-title').innerText = `${lang.n} RESIDENTS`;
            const content = document.getElementById('users-list-content');
            content.innerHTML = '';
            
            lang.users.forEach(user => {
                const userDiv = document.createElement('div');
                userDiv.style.cssText = 'display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px dashed rgba(0,0,0,0.15);';
                const avatarSrc = user.avatar || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="30" height="30"><rect width="100" height="100" fill="%23d4af37"/><circle cx="50" cy="40" r="20" fill="%23000"/></svg>';
                userDiv.innerHTML = `<img src="${avatarSrc}" style="width:36px; height:36px; border-radius:50%; border:1.5px solid var(--gold); object-fit:cover;"><span style="font-weight:900; font-size:14px; color:#000;">@${user.name}</span>`;
                content.appendChild(userDiv);
            });

            const modal = document.getElementById('modal-users-list');
            if (modal) { modal.style.display = 'flex'; setTimeout(() => modal.style.opacity = '1', 10); }
        }

        function closeUsersList() {
            const modal = document.getElementById('modal-users-list');
            if (modal) { modal.style.opacity = '0'; setTimeout(() => modal.style.display = 'none', 300); }
        }

        window.addEventListener('load', () => {
            checkAndFillRegistrationForm();
            initTelegramIntegration(updateNicknameUI, (nick) => {}, safeStorageSet);
            registerCurrentUserToActiveLang(currentActiveCode, currentFlagCode, tempNickname, currentUserImage, safeStorageGet);
            renderLangList();
        });
    </script>
</body>
</html>
