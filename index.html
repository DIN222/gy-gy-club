<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v5.0.1 CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #FFD700; --door-wood: #3E2723; --violet: #8A2BE2; --neon-glow: rgba(138, 43, 226, 0.6); }
        
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        body, button, input, div, img, span { pointer-events: auto !important; }
        img { -webkit-user-drag: none !important; }

        html, body { 
            width: 100%; 
            height: 100%; 
            background: #000000; 
            color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; 
            overflow: hidden; 
            position: fixed; 
            margin: 0; 
            padding: 0;
        }
        
        button, .ui-user-badge, .arrow-item, .painting-zone, #main-door, .box-final, .reg-square {
            transition: all 0.3s ease !important;
        }
        button:hover, .ui-user-badge:hover, .arrow-item:hover, .painting-zone:hover, #main-door:hover, .box-final:hover, .reg-square:hover {
            filter: brightness(1.1);
        }

        /* ЛОГОТИП GY-GY */
        .ui-header-right { 
            position: fixed; top: 18px; right: 25px; z-index: 1000000; 
            font-size: 24px; letter-spacing: 5px; font-weight: bold; 
            font-family: 'Cinzel', serif; pointer-events: none;
            text-shadow: -1px -1px 0 #000000, 1px -1px 0 #000000, -1px 1px 0 #000000, 1px 1px 0 #000000;
        }
        
        /* СКВОЗНОЙ АВАТАР */
        .ui-user-badge {
            position: fixed; top: 4px; left: 50%; transform: translateX(-50%);
            width: 36px; height: 36px; border-radius: 50%;
            border: 2px solid var(--gold); background: #111111;
            box-shadow: 0 0 0 1px #000000, inset 0 0 5px rgba(0,0,0,0.8);
            z-index: 1000000; cursor: pointer; display: none;
        }
        .ui-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background-color: #ffffff; }
        .ui-user-badge .badge-flag {
            position: absolute; bottom: -2px; right: -4px;
            width: 14px; height: 10px; object-fit: cover;
            border: 1px solid var(--gold); box-shadow: 0 0 0 1px #000000;
        }

        /* ЯЗЫКОВОЙ БЛОК (ВЫСОКИЙ Z-INDEX И ИЗОЛИРОВАННЫЙ КЛИК) */
        .club-lang-dropdown-wrapper {
            position: fixed; top: 18px; left: 20px; z-index: 2000005;
            width: 155px; font-family: 'Share Tech Mono', monospace;
            pointer-events: auto !important;
        }
        
        .club-lang-current {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold);
            padding: 5px 8px; border-radius: 10px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.9); width: 100%;
            pointer-events: auto !important;
        }
        .club-lang-current-content {
            display: flex; align-items: center; gap: 7px; min-width: 0; pointer-events: none;
        }
        .club-lang-current .item-avatar {
            width: 20px; height: 20px; border-radius: 50%; overflow: hidden;
            border: 1px solid var(--gold); background: #111; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .club-lang-current .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .club-lang-current .item-flag { width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
        .club-lang-current .item-text { color: var(--gold); font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .club-lang-current .arrow-down { color: var(--gold); font-size: 10px; font-weight: bold; flex-shrink: 0; pointer-events: none; }

        .club-lang-list {
            position: absolute; top: calc(100% + 5px); left: 0;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold);
            border-radius: 10px; width: 100%; max-height: 260px; overflow-y: auto;
            display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.9); z-index: 2000006;
            pointer-events: auto !important;
        }
        .club-lang-list.open { display: block; }
        
        .club-lang-item {
            display: flex; align-items: center; justify-content: space-between; gap: 7px;
            padding: 6px 8px; cursor: pointer; border-bottom: 1px solid rgba(255,215,0,0.15);
            transition: background 0.2s; pointer-events: auto !important;
        }
        .club-lang-item:last-child { border-bottom: none; }
        .club-lang-item:hover { background: rgba(255,215,0,0.15); }
        .club-lang-item-left { display: flex; align-items: center; gap: 7px; min-width: 0; pointer-events: none; }
        .club-lang-item .item-avatar {
            width: 20px; height: 20px; border-radius: 50%; overflow: hidden;
            border: 1px solid var(--gold); background: #111; flex-shrink: 0;
        }
        .club-lang-item .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .club-lang-item .item-flag { width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
        .club-lang-item .item-text { color: var(--gold); font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .club-lang-counter { font-size: 9px; color: var(--gold); opacity: 0.7; background: rgba(255,215,0,0.1); padding: 1px 4px; border-radius: 4px; flex-shrink: 0; pointer-events: none; }

        /* ПАСПОРТ */
        .passport-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 3000000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .passport-card { background: #F5F5DC; border: 3px solid var(--gold); border-radius: 16px; padding: 25px; width: 280px; color: #000000; text-align: center; box-shadow: 0 0 25px rgba(0,0,0,0.5); position: relative; }
        .passport-card .box-final { margin: 15px auto; border-color: #000000; }
        .passport-close-btn { position: absolute; top: 10px; right: 14px; font-size: 28px; font-weight: bold; color: #000000; cursor: pointer; line-height: 1; user-select: none; }

        /* УНИВЕРСАЛЬНЫЙ КЛАСС ДЛЯ БЛОКОВ СТРАНИЦ */
        .block { 
            position: fixed; 
            inset: 0; 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            background: #000000; 
            z-index: 10; 
            opacity: 0; 
            transition: opacity 0.8s ease-in-out; 
            pointer-events: none;
        }
        .block.active { 
            display: flex !important; 
            opacity: 1 !important; 
            z-index: 1000 !important; 
            pointer-events: auto !important;
        }

        .quote-text { font-family: 'Cormorant Garamond', 'Playfair Display', serif; font-style: italic; font-size: 20px; text-align: center; max-width: 85%; margin-bottom: 8px; text-shadow: 2px 2px 4px #000000; }
        .btn-gy { min-width: 240px; padding: 10px 18px; background: #000000; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 700; margin: 4px 0; font-family: 'Montserrat', 'Cinzel', sans-serif; font-size: 12px; }
        
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; cursor: not-allowed; }
        .box-final { width: 75px; height: 75px; border: 2px solid var(--gold); background: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }

        /* СЕТКА РЕГИСТРАЦИИ */
        .registration-grid {
            display: grid;
            grid-template-columns: repeat(3, 75px);
            grid-template-rows: repeat(2, 75px);
            gap: 8px;
            margin-bottom: 12px;
            justify-content: center;
        }

        .reg-square {
            width: 75px; height: 75px; border: 2px solid var(--gold); background: #ffffff; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; color: #000000; padding: 4px; text-align: center;
            overflow: hidden;
        }
        .reg-square.selected { border-color: #ffffff; box-shadow: 0 0 10px var(--gold); }
        .reg-square input[type="text"] {
            position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: none; background: transparent;
            z-index: 2;
        }

        /* ОТСТУПЫ ДЛЯ WELCOME */
        #block-welcome { justify-content: center !important; padding-top: 0 !important; }
        #block-welcome img { max-height: 22vh !important; width: auto; object-fit: contain; margin: 6px 0 !important; filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)); }
        #block-welcome .welcome-title-elem { font-size: 24px !important; font-weight: 700; letter-spacing: 8px; font-style: italic; margin-bottom: 6px !important; font-family: 'Cinzel', serif; }

        /* НАВИГАЦИОННЫЕ СТРЕЛКИ */
        .ui-nav-arrows {
            position: fixed; top: 18px; left: 20px; z-index: 2000005; 
            display: flex; gap: 15px; font-size: 24px; font-weight: 900 !important; 
            font-family: 'Share Tech Mono', monospace; cursor: pointer; color: var(--gold); 
            line-height: 1; letter-spacing: -2px; 
            background: transparent !important; border: none !important;
            text-shadow: -1px -1px 0 #000000, 1px -1px 0 #000000, -1px 1px 0 #000000, 1px 1px 0 #000000;
            pointer-events: auto !important; user-select: none;
        }
        .arrow-item { transition: opacity 0.2s, transform 0.2s; background: transparent !important; border: none !important; cursor: pointer; }
        .arrow-item:hover { opacity: 0.8; transform: scale(1.1); }

        /* ХОЛЛ И ИНТЕРАКТИВНЫЕ КАРТИНЫ */
        #block-hall { background: #000000 !important; }
        .hall-interior { 
            position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; 
            background: url('hall_bg_jpg.jpg') center / cover no-repeat #000000;
        }
        
        .hall-interior .quote-text { 
            position: absolute; top: 10vh; left: 50%; transform: translateX(-50%); width: 85%; 
            margin: 0; text-align: center; padding: 0; background: transparent !important;
            color: var(--gold) !important; font-size: 24px; font-weight: 700;
            -webkit-text-stroke: 1px #000000; text-stroke: 1px #000000;
        }

        .painting-zone {
            position: absolute; top: 25vh; width: 6vw; height: 12vh; cursor: pointer; z-index: 6; background: transparent;
            display: flex; align-items: center; justify-content: center;
        }
        .painting-left { left: 23vw; }
        .painting-right { right: 23vw; }

        .cue-arrow-hall { 
            color: var(--violet); font-size: 34px; font-weight: 900; font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 12px var(--violet), 0 0 20px var(--violet); pointer-events: none; user-select: none; z-index: 10;
            transition: opacity 0.2s;
        }
        .painting-zone:hover .cue-arrow-hall { opacity: 0.8; }

        .manifest-btn-box { 
            position: absolute; bottom: -45px; left: 50%; transform: translateX(-50%); width: 130px; 
            display: flex; flex-direction: column; gap: 5px; justify-content: center; opacity: 0; 
            pointer-events: none; transition: opacity 0.4s, bottom 0.4s; z-index: 10; 
        }
        .btn-manifest { width: 100%; padding: 5px 0; font-size: 11px; margin: 0; background: #000000; box-shadow: 0 4px 10px rgba(0,0,0,0.9); }
        
        .goog-te-banner-frame, .skiptranslate, iframe.goog-te-menu-frame { display: none !important; }
        body { top: 0 !important; background-color: #000000 !important; opacity: 0; transition: opacity 1.2s ease-in-out !important; }
        body.page-loaded { opacity: 1 !important; }
        
        font { background-color: transparent !important; background: transparent !important; color: inherit !important; box-shadow: none !important; text-shadow: none !important; }
        .goog-text-highlight { background-color: transparent !important; background: transparent !important; box-shadow: none !important; color: inherit !important; }
        .btn-gy font, .quote-text font, .ui-header-right font { color: inherit !important; }
        
        /* ДВЕРЬ */
        #main-door {
            display: block; height: 48vh; max-height: 400px; width: auto; max-width: 100%; object-fit: contain;
            margin: 0 auto; transform: scale(1); transition: transform 0.2s ease, filter 0.3s ease, opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer; position: relative; z-index: 500; pointer-events: auto !important;
        }
        #main-door:active { transform: scale(0.97); }

        .door-exploded { transform: scale(3.5) !important; opacity: 0 !important; }
    </style>
</head>

<script type="text/javascript">
    let currentUserImage = "";
    let currentClubAvatarImage = "horse_welcome.png";
    let currentBlockId = 'block-entrance';
    let selectedNickType = 'own';
    let userOwnNickname = '';
    let userClubNickname = 'GY-GUEST';
    let isDoorOpened = false;
    let userNumericCode = "GY-" + Math.floor(1000 + Math.random() * 9000);

    // Безопасное переключение блоков с защитой от темноты
    function portalTransition(targetBlockId) {
        const currentBlock = document.getElementById(currentBlockId);
        const targetBlock = document.getElementById(targetBlockId);
        
        if (!targetBlock) return;

        if (currentBlock) {
            currentBlock.classList.remove('active');
        }
        
        targetBlock.classList.add('active');
        currentBlockId = targetBlockId;

        // Управление видимостью верхних элементов навигации
        const navArrows = document.getElementById('club-nav-arrows');
        const userBadge = document.getElementById('global-user-badge');
        
        if (targetBlockId === 'block-entrance') {
            if (navArrows) navArrows.style.display = 'none';
        } else {
            if (navArrows) navArrows.style.display = 'flex';
        }

        // Если сохранен юзер, показываем бейдж
        if (userBadge && currentUserImage && targetBlockId !== 'block-entrance') {
            userBadge.style.display = 'block';
        }
    }

    // Обработка клика по языковому меню с изоляцией события
    function toggleLangDropdown(e) {
        if (e) e.stopPropagation();
        const list = document.getElementById('club-lang-list');
        if (list) {
            list.classList.toggle('open');
        }
    }

    // Закрытие списка языков при клике вне его области
    document.addEventListener('click', function(e) {
        const wrapper = document.querySelector('.club-lang-dropdown-wrapper');
        const list = document.getElementById('club-lang-list');
        if (wrapper && list && !wrapper.contains(e.target)) {
            list.classList.remove('open');
        }
    });

    // Многослойный барный звук открытия двери через Web Audio API
    function playBarDoorSound() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();

            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);

            const subOsc = ctx.createOscillator();
            const subGain = ctx.createGain();
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(60, ctx.currentTime);
            subOsc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + 0.5);
            subGain.gain.setValueAtTime(0.4, ctx.currentTime);
            subGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
            subOsc.connect(subGain);
            subGain.connect(ctx.destination);
            subOsc.start();
            subOsc.stop(ctx.currentTime + 0.5);
        } catch (e) {
            console.log("AudioContext restricted", e);
        }
    }

    function setNickType(type) {
        selectedNickType = type;
        const ownBox = document.getElementById('box-own-nick');
        const clubBox = document.getElementById('box-club-nick');
        
        if (type === 'own') {
            if (ownBox) ownBox.classList.add('selected');
            if (clubBox) clubBox.classList.remove('selected');
            const input = document.getElementById('input-own-nick');
            if (input) input.focus();
        } else {
            if (clubBox) clubBox.classList.add('selected');
            if (ownBox) ownBox.classList.remove('selected');
            const input = document.getElementById('input-club-nick');
            if (input) input.focus();
        }
    }

    function updateNicknameValue(val, type) {
        if (type === 'own') {
            userOwnNickname = val;
            const disp = document.getElementById('display-own-nick');
            if (disp) disp.innerText = val;
        } else {
            userClubNickname = val;
            const disp = document.getElementById('display-club-nick');
            if (disp) disp.innerText = val;
        }
        updateQRCode();
    }

    function previewUserPhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                currentUserImage = e.target.result;
                const img = document.getElementById('img-user-photo');
                const txt = document.getElementById('txt-photo');
                if (img) {
                    img.src = currentUserImage;
                    img.style.display = 'block';
                }
                if (txt) txt.style.display = 'none';
                
                const badgeImg = document.getElementById('badge-avatar-img');
                if (badgeImg) badgeImg.src = currentUserImage;
                
                unlockProceedButtons();
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function generateClubAvatar() {
        const avatars = [
            'horse_welcome.png',
            'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
            'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150',
            'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150',
            'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150'
        ];
        const randomAvatar = avatars[Math.floor(Math.random() * avatars.length)];
        currentClubAvatarImage = randomAvatar;
        
        const img = document.getElementById('img-club-avatar');
        const txt = document.getElementById('txt-avatar');
        if (img) {
            img.src = currentClubAvatarImage;
            img.style.display = 'block';
        }
        if (txt) txt.style.display = 'none';
        
        if (!currentUserImage) {
            currentUserImage = currentClubAvatarImage;
            const badgeImg = document.getElementById('badge-avatar-img');
            if (badgeImg) badgeImg.src = currentUserImage;
        }
        
        unlockProceedButtons();
    }

    function unlockProceedButtons() {
        const btnPass = document.getElementById('btn-pass');
        if (btnPass) btnPass.classList.remove('btn-sleep');
        const btnWHall = document.getElementById('btn-w-hall');
        if (btnWHall) btnWHall.classList.remove('btn-sleep');
    }

    function saveUserProfile() {
        safeStorageSet('gy_user_nick', userOwnNickname);
        safeStorageSet('gy_club_nick', userClubNickname);
        safeStorageSet('gy_user_code', userNumericCode);
        if (currentUserImage) {
            safeStorageSet('gy_user_avatar', currentUserImage);
        }
        unlockProceedButtons();
        portalTransition('block-hall');
    }

    function renderLanguageList() {
        const listContainer = document.getElementById('club-lang-list');
        if (!listContainer || typeof allLanguages === 'undefined') return;
        
        listContainer.innerHTML = '';
        allLanguages.forEach(lang => {
            const country = (typeof flagCodeToCountry === 'function') ? flagCodeToCountry(lang.code) : 'gb';
            const count = (typeof globalRegistry !== 'undefined' && globalRegistry[country]) ? globalRegistry[country].length : Math.floor(Math.random() * 50) + 1;
            
            const item = document.createElement('div');
            item.className = 'club-lang-item';
            item.onclick = (e) => {
                e.stopPropagation();
                selectClubLanguage(lang.code, lang.name, lang.flag);
                listContainer.classList.remove('open');
            };
            item.innerHTML = `
                <div class="club-lang-item-left">
                    <div class="item-avatar"><img src="horse_welcome.png"></div>
                    <img class="item-flag" src="${lang.flag}">
                    <span class="item-text">${lang.name}</span>
                </div>
                <div class="club-lang-counter">${count}</div>
            `;
            listContainer.appendChild(item);
        });
    }

    function regenerateNumericCode() {
        userNumericCode = "GY-" + Math.floor(1000 + Math.random() * 9000);
        const codeEl = document.getElementById('digital-code-label');
        if (codeEl) codeEl.innerText = userNumericCode;
        updateQRCode();
    }

    function updateQRCode() {
        const container = document.getElementById('qrcode-container');
        const passContainer = document.getElementById('pass-qrcode-container');
        const nickText = userOwnNickname || userClubNickname || 'GY-GUEST';
        
        if (container) {
            container.innerHTML = '';
            try {
                new QRCode(container, {
                    text: `GY-GY CLUB ID: ${userNumericCode} | NICK: ${nickText}`,
                    width: 62,
                    height: 62,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            } catch(e) {}
        }
        
        if (passContainer) {
            passContainer.innerHTML = '';
            try {
                new QRCode(passContainer, {
                    text: `GY-GY CLUB ID: ${userNumericCode} | NICK: ${nickText}`,
                    width: 75,
                    height: 75,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            } catch(e) {}
        }
    }

    function openPassport() {
        const modal = document.getElementById('modal-passport');
        const passVal = document.getElementById('pass-id-val');
        const passImg = document.getElementById('pass-pass-avatar-img');
        
        const activeNick = userOwnNickname || userClubNickname || 'MEMBER';
        if (passVal) passVal.innerText = `${userNumericCode} — ${activeNick}`;
        if (passImg && currentUserImage) passImg.src = currentUserImage;
        
        updateQRCode();
        
        if (modal) {
            modal.style.display = 'flex';
            setTimeout(() => modal.style.opacity = '1', 10);
        }
    }

    function closePassport() {
        const modal = document.getElementById('modal-passport');
        if (modal) {
            modal.style.opacity = '0';
            setTimeout(() => modal.style.display = 'none', 300);
        }
    }

    function handleDoor(e) {
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }
        if (isDoorOpened) return;
        isDoorOpened = true;

        const door = document.getElementById('main-door');
        const sndDoor = document.getElementById('snd-door');
        const sndAmbient = document.getElementById('snd-ambient');

        playBarDoorSound();

        if (sndDoor) {
            sndDoor.play().catch(err => console.log("Audio play blocked:", err));
        }
        if (sndAmbient) {
            sndAmbient.play().catch(err => console.log("Ambient play blocked:", err));
        }

        if (door) {
            door.classList.add('door-exploded');
        }

        setTimeout(() => {
            portalTransition('block-welcome');
        }, 600);
    }
</script>
</body>
