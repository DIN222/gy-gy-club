    <script>
        const clubLanguages = [
            { code: 'en', name: 'English', flag: 'https://flagcdn.com/w20/gb.png', avatar: 'horse_welcome.png' },
            { code: 'ru', name: 'Русский', flag: 'https://flagcdn.com/w20/ru.png', avatar: 'horse_welcome.png' },
            { code: 'es', name: 'Español', flag: 'https://flagcdn.com/w20/es.png', avatar: 'horse_welcome.png' },
            { code: 'de', name: 'Deutsch', flag: 'https://flagcdn.com/w20/de.png', avatar: 'horse_welcome.png' },
            { code: 'fr', name: 'Français', flag: 'https://flagcdn.com/w20/fr.png', avatar: 'horse_welcome.png' },
            { code: 'it', name: 'Italiano', flag: 'https://flagcdn.com/w20/it.png', avatar: 'horse_welcome.png' },
            { code: 'zh-CN', name: '中文', flag: 'https://flagcdn.com/w20/cn.png', avatar: 'horse_welcome.png' },
            { code: 'ja', name: '日本語', flag: 'https://flagcdn.com/w20/jp.png', avatar: 'horse_welcome.png' },
            { code: 'ar', name: 'العربية', flag: 'https://flagcdn.com/w20/sa.png', avatar: 'horse_welcome.png' },
            { code: 'pt', name: 'Português', flag: 'https://flagcdn.com/w20/pt.png', avatar: 'horse_welcome.png' },
            { code: 'uk', name: 'Українська', flag: 'https://flagcdn.com/w20/ua.png', avatar: 'horse_welcome.png' },
            { code: 'pl', name: 'Polski', flag: 'https://flagcdn.com/w20/pl.png', avatar: 'horse_welcome.png' }
        ];
    </script>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            try {
                new google.translate.TranslateElement({ pageLanguage: 'en', autoDisplay: false }, 'google_translate_element');
            } catch(e) {}
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="text/javascript">
        let currentID = "";
        let currentUserImage = "";
        let currentBlockId = 'block-entrance';
        let selectedNickType = 'own';
        let userChosenNickname = '';
        let ambientFadeInterval = null;

        function setAmbientVolumeSmooth(targetVolume, duration = 1500) {
            const sndAmbient = document.getElementById('snd-ambient');
            if (!sndAmbient) return;

            if (sndAmbient.paused && targetVolume > 0) {
                sndAmbient.volume = 0;
                sndAmbient.play().catch(e => console.log("Ambient play prevented:", e));
            }

            if (ambientFadeInterval) clearInterval(ambientFadeInterval);

            if (targetVolume === 0 && sndAmbient.paused) return;

            const steps = 15;
            const stepTime = duration / steps;
            const currentVol = sndAmbient.volume;
            const volumeStep = (targetVolume - currentVol) / steps;

            ambientFadeInterval = setInterval(() => {
                let newVol = sndAmbient.volume + volumeStep;
                if ((volumeStep > 0 && newVol >= targetVolume) || (volumeStep < 0 && newVol <= targetVolume)) {
                    sndAmbient.volume = Math.max(0, Math.min(1, targetVolume));
                    clearInterval(ambientFadeInterval);
                    if (targetVolume === 0) {
                        sndAmbient.pause();
                        sndAmbient.currentTime = 0;
                    }
                } else {
                    sndAmbient.volume = Math.max(0, Math.min(1, newVol));
                }
            }, stepTime);
        }

        function toggleLangDropdown(event) {
            if (event) event.stopPropagation();
            const list = document.getElementById('club-lang-list');
            if (list) list.classList.toggle('open');
        }

        function getCurrentLangCode() {
            return localStorage.getItem('gygy_lang_code') || 'en';
        }

        function renderFilteredLanguageList() {
            const listContainer = document.getElementById('club-lang-list');
            if (!listContainer) return;

            const currentLangCode = getCurrentLangCode();
            if (typeof clubLanguages !== 'undefined') {
                listContainer.innerHTML = '';
                const activeLangObj = clubLanguages.find(l => l.code === currentLangCode) || clubLanguages.find(l => l.code === 'en');
                if (activeLangObj) updateCurrentLangUI(activeLangObj);

                clubLanguages.forEach(lang => {
                    if (lang.code === currentLangCode) return;
                    const item = document.createElement('div');
                    item.className = 'club-lang-item';
                    item.onclick = (e) => {
                        e.stopPropagation();
                        selectClubLanguage(lang.code, lang.name, lang.flag, lang.avatar);
                    };
                    item.innerHTML = `
                        <div class="item-avatar"><img src="${lang.avatar || 'horse_welcome.png'}" alt=""></div>
                        <img class="item-flag" src="${lang.flag}" alt="">
                        <span class="item-text">${lang.name}</span>
                    `;
                    listContainer.appendChild(item);
                });
            }
        }

        function updateCurrentLangUI(langObj) {
            const nameElem = document.getElementById('current-lang-name');
            if (nameElem) nameElem.innerText = langObj.name;
            const flagElem = document.getElementById('current-flag');
            if (flagElem && langObj.flag) flagElem.src = langObj.flag;
            const avatarElem = document.getElementById('current-avatar');
            if (avatarElem && langObj.avatar) avatarElem.src = langObj.avatar;
        }

        function selectClubLanguage(langCode, langName, flagUrl, avatarUrl) {
            const nameToSave = langName || 'English';
            const flagToSave = flagUrl || 'https://flagcdn.com/w20/gb.png';
            const avatarToSave = avatarUrl || 'horse_welcome.png';
            
            updateCurrentLangUI({ code: langCode, name: nameToSave, flag: flagToSave, avatar: avatarToSave });

            try {
                localStorage.setItem('gygy_lang_code', langCode);
                localStorage.setItem('gygy_lang_name', nameToSave);
                localStorage.setItem('gygy_lang_flag', flagToSave);
            } catch(e) {}

            const listElem = document.getElementById('club-lang-list');
            if (listElem) listElem.classList.remove('open');

            try {
                const selectElement = document.querySelector('.goog-te-combo');
                if (selectElement) {
                    selectElement.value = langCode;
                    selectElement.dispatchEvent(new Event('change'));
                } else {
                    document.cookie = "googtrans=/en/" + langCode + "; path=/;";
                    location.reload();
                }
            } catch(e) {
                location.reload();
            }
        }

        window.addEventListener('click', (e) => {
            const wrapper = document.querySelector('.club-lang-dropdown-wrapper');
            const list = document.getElementById('club-lang-list');
            if (wrapper && list && !wrapper.contains(e.target)) {
                list.classList.remove('open');
            }
        });

        function setNickType(type) {
            selectedNickType = type;
            const boxOwn = document.getElementById('box-own-nick');
            const boxClub = document.getElementById('box-club-nick');
            if (type === 'own') {
                boxOwn.classList.add('selected');
                boxClub.classList.remove('selected');
            } else {
                boxClub.classList.add('selected');
                boxOwn.classList.remove('selected');
            }
        }

        function updateNicknameValue(val, type) {
            if (type === 'own') {
                userChosenNickname = val;
                try { localStorage.setItem('gygy_nickname', val); } catch(e) {}
            }
        }

        function toggleManifest(boxId) {
            document.querySelectorAll('.manifest-btn-box').forEach(box => {
                if(box.id === boxId) {
                    const isOpened = box.getAttribute('data-opened') === "true";
                    box.style.opacity = isOpened ? "0" : "1";
                    box.style.pointerEvents = isOpened ? "none" : "auto";
                    box.setAttribute('data-opened', isOpened ? "false" : "true");
                    box.style.bottom = isOpened ? "-45px" : "-32px";
                } else {
                    box.style.opacity = "0"; box.style.pointerEvents = "none"; box.setAttribute('data-opened', "false"); box.style.bottom = "-45px";
                }
            });
        }

        function renderUserPassports(targetID) {
            const idLabel = document.getElementById('id-label');
            const passIdVal = document.getElementById('pass-id-val');
            const qrBoxReg = document.getElementById('qr-box-reg');
            const passQrBox = document.getElementById('pass-qr-box');
            
            if (idLabel) idLabel.innerText = targetID;
            if (passIdVal) passIdVal.innerText = targetID;
            
            if (qrBoxReg && typeof QRCode !== 'undefined') { 
                qrBoxReg.innerHTML = ""; 
                new QRCode(qrBoxReg, { text: targetID, width: 75, height: 75 }); 
            }
            if (passQrBox && typeof QRCode !== 'undefined') { 
                passQrBox.innerHTML = ""; 
                new QRCode(passQrBox, { text: targetID, width: 90, height: 90 }); 
            }

            let clubNick = localStorage.getItem('gygy_club_nick');
            if (!clubNick) {
                const coolNicks = ["БигКоин", "Нападающий", "Шампань", "Магнат", "Счастливчик", "Инсайдер", "Фантом", "Победитель", "Капитан", "Маэстро", "Прайм", "Штурман", "Панчер", "Триумф", "Оракул"];
                clubNick = coolNicks[Math.floor(Math.random() * coolNicks.length)];
                try { localStorage.setItem('gygy_club_nick', clubNick); } catch(e) {}
            }

            const clubNickLabel = document.getElementById('club-nick-label');
            if (clubNickLabel) clubNickLabel.innerText = clubNick;
        }

        function checkAndFillRegistrationForm() {
            const savedAvatar = localStorage.getItem('gy_user_img') || localStorage.getItem('gygy_avatar');
            currentID = localStorage.getItem('gygy_id') || localStorage.getItem('gy_user_id') || localStorage.getItem('gy_trace') || "GY-" + Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem('gygy_id', currentID);

            if (currentID) { renderUserPassports(currentID); }

            const savedNickname = localStorage.getItem('gygy_nickname') || '';
            const ownNickInput = document.getElementById('input-own-nick');
            if (ownNickInput && savedNickname) {
                ownNickInput.value = savedNickname;
                userChosenNickname = savedNickname;
            }

            if (savedAvatar) {
                currentUserImage = savedAvatar;
                const badgeImg = document.getElementById('badge-avatar-img');
                const passImg = document.getElementById('pass-avatar-img');
                if (badgeImg) badgeImg.src = savedAvatar;
                if (passImg) passImg.src = savedAvatar;

                const ppImg = document.getElementById('pp'); 
                if (ppImg) { ppImg.src = savedAvatar; ppImg.style.display = "block"; }
                const txtPhoto = document.getElementById('txt-photo'); 
                if (txtPhoto) txtPhoto.style.display = "none";

                const btnWHall = document.getElementById('btn-w-hall'); if(btnWHall) btnWHall.classList.remove('btn-sleep');
                const btnPass = document.getElementById('btn-pass'); if(btnPass) btnPass.classList.remove('btn-sleep');
            }
        }

        function enterStudio() { window.location.href = 'studio.html'; }
        function enterStaffOffice() { window.location.href = 'staff_office.html'; }

        function handleNavigationBack() {
            if (currentBlockId === 'block-hall') portalTransition('block-identity');
            else if (currentBlockId === 'block-identity') portalTransition('block-welcome');
            else if (currentBlockId === 'block-welcome') portalTransition('block-entrance');
        }

        function portalTransition(nextId) {
            const sndPour = document.getElementById('snd-pour');

            if (nextId === 'block-server') { window.location.href = 'verses.html'; return; }
            if (nextId === 'block-bar') { 
                setAmbientVolumeSmooth(0.5, 500);
                if (sndPour) {
                    sndPour.currentTime = 0;
                    sndPour.play().catch(e => console.log("Audio play prevented:", e));
                }
                setTimeout(() => {
                    window.location.href = 'bar.html'; 
                }, 400);
                return; 
            }
            if (nextId === 'block-tables') { window.location.href = 'tables.html'; return; } 
            if (nextId === 'block-office') { window.location.href = 'office.html'; return; }

            const targetBlock = document.getElementById(nextId);
            if (!targetBlock) return;

            currentBlockId = nextId;

            const badge = document.getElementById('global-user-badge');
            const navArrows = document.getElementById('club-nav-arrows');

            document.querySelectorAll('.block').forEach(b => {
                b.classList.remove('active');
                b.style.display = 'none';
            });

            targetBlock.style.display = 'flex';
            setTimeout(() => { targetBlock.classList.add('active'); }, 20);

            if (nextId === 'block-entrance') {
                const mainDoor = document.getElementById('main-door');
                if (mainDoor) mainDoor.classList.remove('door-exploded');
                if (navArrows) navArrows.style.display = 'none';
                if (badge) badge.style.display = 'none';
                setAmbientVolumeSmooth(0, 1000);
            } else {
                if (navArrows) navArrows.style.display = 'flex';
                if (badge && currentUserImage) badge.style.display = 'block';

                if (nextId === 'block-welcome') {
                    setAmbientVolumeSmooth(0.1, 1500);
                } else if (nextId === 'block-identity') {
                    setAmbientVolumeSmooth(0.2, 1500);
                } else if (nextId === 'block-hall') {
                    setAmbientVolumeSmooth(0.35, 1500);
                }
            }
        }

        function handleDoor() {
            const sndDoor = document.getElementById('snd-door');
            const mainDoor = document.getElementById('main-door');

            if (sndDoor) {
                sndDoor.currentTime = 0;
                sndDoor.play().catch(e => console.log("Door sound prevented:", e));
            }
            if (mainDoor) mainDoor.classList.add('door-exploded');

            setAmbientVolumeSmooth(0.1, 2000);

            setTimeout(() => {
                portalTransition('block-welcome');
            }, 700);
        }

        function preview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUserImage = e.target.result;
                    try { localStorage.setItem('gy_user_img', currentUserImage); } catch(e) {}
                    const pp = document.getElementById('pp'); if (pp) { pp.src = currentUserImage; pp.style.display = 'block'; }
                    const txtPhoto = document.getElementById('txt-photo'); if (txtPhoto) txtPhoto.style.display = 'none';
                    
                    const badgeImg = document.getElementById('badge-avatar-img');
                    if (badgeImg) badgeImg.src = currentUserImage;
                    const btnWHall = document.getElementById('btn-w-hall'); if(btnWHall) btnWHall.classList.remove('btn-sleep');
                    const btnPass = document.getElementById('btn-pass'); if(btnPass) btnPass.classList.remove('btn-sleep');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function saveUserProfile() {
            const btnPass = document.getElementById('btn-pass');
            if (btnPass) btnPass.classList.remove('btn-sleep');
            alert('Profile saved successfully!');
        }

        function openPassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) {
                modal.style.display = 'flex';
                setTimeout(() => modal.style.opacity = '1', 10);
            }
        }

        function closePassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) {
                modal.style.opacity = '0';
                setTimeout(() => modal.style.display = 'none', 300);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderFilteredLanguageList();
            checkAndFillRegistrationForm();

            setTimeout(() => {
                document.body.classList.add('page-loaded');
            }, 350);
        });
    </script>
</body>
</html>
