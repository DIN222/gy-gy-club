<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY-GY Club v4.6.16.25(1) CORE</title>
    <!-- Подключаем библиотеку QRCode для генерации паспортов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Базовые стили для демонстрации структуры */
        body {
            margin: 0;
            background: #0b0b0b;
            color: #00ffcc;
            font-family: 'Share Tech Mono', monospace, sans-serif;
            overflow-x: hidden;
        }
        .block {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .block.active {
            display: flex;
            opacity: 1;
        }
        .btn-sleep {
            opacity: 0.4;
            pointer-events: none;
        }
        /* Стили модалок и элементов управления */
        .club-lang-dropdown-wrapper { position: relative; display: inline-block; }
        .club-lang-list { display: none; position: absolute; background: #111; border: 1px solid #00ffcc; z-index: 100; }
        .club-lang-list.open { display: block; }
        .club-lang-item { display: flex; align-items: center; padding: 5px 10px; cursor: pointer; }
        .club-lang-item:hover { background: #222; }
        .door-exploded { transform: scale(1.1); opacity: 0; transition: all 0.7s ease; }
    </style>
</head>
<body class="">

    <!-- БЛОК 1: ВХОД (ENTRANCE) -->
    <div id="block-entrance" class="block active">
        <h1>GY-GY Club v4.6.16.25</h1>
        <div id="main-door" style="cursor: pointer; padding: 20px; border: 2px dashed #00ffcc; margin: 20px;" onclick="handleDoor()">
            🚪 [ Нажмите, чтобы выбить дверь и войти ]
        </div>
        <audio id="snd-door" src="door.mp3" preload="auto"></audio>
        <audio id="snd-ambient" src="ambient.mp3" preload="auto" loop></audio>
    </div>

    <!-- БЛОК 2: ПРИВЕТСТВИЕ / РЕГИСТРАЦИЯ (WELCOME & IDENTITY) -->
    <div id="block-welcome" class="block">
        <h2>Регистрация в клубе</h2>
        <div style="margin: 15px 0;">
            <p>Выберите аватар:</p>
            <input type="file" id="file-input" onchange="preview(this)">
            <button onclick="generateAvatar()">Сгенерировать SVG аватар</button>
            <div style="margin-top: 10px;">
                <img id="pp" src="" style="width: 80px; height: 80px; display: none; border-radius: 50%; object-fit: cover;">
                <span id="txt-photo">Фото не выбрано</span>
                <img id="avatar-img" src="" style="width: 80px; height: 80px; display: none; border-radius: 50%;">
                <span id="txt-avatar" style="display:none;">SVG аватар готов</span>
            </div>
        </div>

        <div style="margin: 15px 0;">
            <p>Никнейм:</p>
            <div id="box-own-nick" class="selected" onclick="setNickType('own')" style="border: 1px solid #555; padding: 5px; margin-bottom: 5px; cursor: pointer;">
                Свой ник: <input type="text" id="input-own-nick" oninput="updateNicknameValue(this.value, 'own')" placeholder="Ваш ник">
            </div>
            <div id="box-club-nick" onclick="setNickType('club')" style="border: 1px solid #555; padding: 5px; cursor: pointer;">
                Клубный ник: <span id="club-nick-label">Не выбран</span>
            </div>
        </div>

        <div>
            <button onclick="saveUserProfile()">Сохранить профиль и войти</button>
        </div>

        <div style="margin-top: 20px;">
            <button id="btn-w-hall" class="btn-sleep" onclick="portalTransition('block-hall')">В главный зал</button>
            <button id="btn-pass" class="btn-sleep" onclick="openPassport()">Открыть паспорт</button>
        </div>
    </div>

    <!-- БЛОК 3: ГЛАВНЫЙ ЗАЛ (HALL) -->
    <div id="block-hall" class="block">
        <h2>Главный зал GY-GY Club</h2>
        <p>ID резидента: <span id="id-label">---</span></p>
        <div id="qr-box-reg"></div>
        <div style="margin-top: 20px;">
            <button onclick="portalTransition('block-bar')">Бар</button>
            <button onclick="portalTransition('block-tables')">Столики</button>
            <button onclick="portalTransition('block-server')">Стихи / Сервер</button>
            <button id="btn-staff-office" style="display:none;" onclick="enterStaffOffice()">Кабинет стаффа</button>
        </div>
        <button onclick="handleNavigationBack()" style="margin-top: 20px;">Назад</button>
    </div>

    <!-- ВИДЖЕТ ВЫБОРА ЯЗЫКА -->
    <div class="club-lang-dropdown-wrapper" style="position: fixed; top: 10px; right: 10px; z-index: 1000;">
        <div onclick="toggleLangDropdown()" style="cursor: pointer; display: flex; align-items: center; background: #111; border: 1px solid #00ffcc; padding: 5px 10px; border-radius: 4px;">
            <img id="current-flag" src="https://flagcdn.com/w20/gb.png" style="margin-right: 5px;">
            <span id="current-lang-name">English</span>
        </div>
        <div id="club-lang-list" class="club-lang-list"></div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПАСПОРТА -->
    <div id="modal-passport" style="display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 9998; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;">
        <div style="background: #111; border: 1px solid #00ffcc; padding: 20px; border-radius: 8px; text-align: center; max-width: 300px; width: 100%;">
            <h3>Паспорт Резидента</h3>
            <img id="pass-avatar-img" src="" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 10px;">
            <p>ID: <span id="pass-id-val">---</span></p>
            <div id="pass-qr-box" style="display: flex; justify-content: center; margin: 10px 0;"></div>
            <button onclick="closePassport()">Закрыть</button>
        </div>
    </div>

    <!-- ГЛОБАЛЬНЫЙ БЕЙДЖ ПОЛЬЗОВАТЕЛЯ -->
    <div id="global-user-badge" style="display:none; position: fixed; top: 10px; left: 10px; z-index: 1000;">
        <img id="badge-avatar-img" src="" style="width: 35px; height: 35px; border-radius: 50%; border: 1px solid #00ffcc; object-fit: cover; cursor: pointer;" onclick="openPassport()">
    </div>

    <!-- НАВИГАЦИОННЫЕ СТРЕЛКИ -->
    <div id="club-nav-arrows" style="display:none; position: fixed; bottom: 20px; left: 20px; z-index: 1000;">
        <button onclick="handleNavigationBack()">⬅ Назад</button>
    </div>

    <!-- СКРИПТЫ ПРОЕКТА -->
    <script src="userlang-data.js"></script>
    <script src="translations.js"></script>
    <script src="language.js"></script>
    <script src="core/eventBus.js"></script>

    <script type="text/javascript">
        let currentID = "";
        let currentUserImage = "";
        let currentBlockId = 'block-entrance';
        let selectedNickType = 'own';
        let userChosenNickname = '';

        let currentLangData = { code: 'en', name: 'English', flag: 'https://flagcdn.com/w20/gb.png' };
        const allLanguages = [
            { code: 'en', name: 'English', flag: 'https://flagcdn.com/w20/gb.png' },
            { code: 'ru', name: 'Русский', flag: 'https://flagcdn.com/w20/ru.png' },
            { code: 'es', name: 'Español', flag: 'https://flagcdn.com/w20/es.png' },
            { code: 'de', name: 'Deutsch', flag: 'https://flagcdn.com/w20/de.png' },
            { code: 'fr', name: 'Français', flag: 'https://flagcdn.com/w20/fr.png' },
            { code: 'it', name: 'Italiano', flag: 'https://flagcdn.com/w20/it.png' },
            { code: 'zh-CN', name: '中文', flag: 'https://flagcdn.com/w20/cn.png' },
            { code: 'ja', name: '日本語', flag: 'https://flagcdn.com/w20/jp.png' },
            { code: 'ar', name: 'العربية', flag: 'https://flagcdn.com/w20/sa.png' },
            { code: 'pt', name: 'Português', flag: 'https://flagcdn.com/w20/pt.png' },
            { code: 'uk', name: 'Українська', flag: 'https://flagcdn.com/w20/ua.png' },
            { code: 'pl', name: 'Polski', flag: 'https://flagcdn.com/w20/pl.png' }
        ];

        function safeStorageGet(key, fallback = "") { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } }
        function safeStorageSet(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

        function flagCodeToCountry(code) {
            const map = { 'en': 'gb', 'ru': 'ru', 'es': 'es', 'de': 'de', 'fr': 'fr', 'it': 'it', 'zh-CN': 'cn', 'ja': 'jp', 'ar': 'sa', 'pt': 'pt', 'uk': 'ua', 'pl': 'pl' };
            return map[code] || 'gb';
        }

        function syncGTranslateWidget() {
            const savedLangCode = safeStorageGet('gygy_lang_code') || 'en';
            const combo = document.querySelector('.goog-te-combo');
            if (combo) {
                if (combo.value !== savedLangCode) {
                    combo.value = savedLangCode;
                    combo.dispatchEvent(new Event('change'));
                }
            } else {
                setTimeout(syncGTranslateWidget, 100);
            }
        }

        function updateGlobalFlagUI() {
            const savedFlag = safeStorageGet('gygy_flag') || safeStorageGet('gy_user_flag') || 'gb';
            const flagUrl = `https://flagcdn.com/w20/${savedFlag.toLowerCase()}.png`;
            
            const currentFlagEl = document.getElementById('current-flag');
            if (currentFlagEl) {
                currentFlagEl.src = flagUrl;
            }

            const savedLangName = safeStorageGet('gygy_lang_name');
            const langNameEl = document.getElementById('current-lang-name');
            if (savedLangName && langNameEl) {
                langNameEl.innerText = savedLangName;
            }
        }

        function toggleLangDropdown() {
            const list = document.getElementById('club-lang-list');
            if (list) list.classList.toggle('open');
        }

        function selectClubLanguage(langCode, langName, flagUrl) {
            currentLangData = { code: langCode, name: langName, flag: flagUrl };
            
            const countryCode = flagCodeToCountry(langCode);
            safeStorageSet('gygy_flag', countryCode);
            safeStorageSet('gy_user_flag', countryCode);
            safeStorageSet('gygy_lang_code', langCode);
            safeStorageSet('gygy_lang_name', langName);
            
            const currentFlagEl = document.getElementById('current-flag');
            if (currentFlagEl) currentFlagEl.src = flagUrl;
            
            const langNameEl = document.getElementById('current-lang-name');
            if (langNameEl) langNameEl.innerText = langName;

            const listContainer = document.getElementById('club-lang-list');
            if (listContainer) {
                listContainer.innerHTML = '';
                allLanguages.forEach(lang => {
                    if (lang.code !== langCode) {
                        const item = document.createElement('div');
                        item.className = 'club-lang-item';
                        item.onclick = () => selectClubLanguage(lang.code, lang.name, lang.flag);
                        item.innerHTML = `
                            <div class="item-avatar"><img src="horse_welcome.png" style="width:20px;height:20px;margin-right:5px;"></div>
                            <img class="item-flag" src="${lang.flag}" style="margin-right:5px;">
                            <span class="item-text">${lang.name}</span>
                        `;
                        listContainer.appendChild(item);
                    }
                });
                listContainer.classList.remove('open');
            }

            const combo = document.querySelector('.goog-te-combo');
            if (combo) {
                combo.value = langCode;
                combo.dispatchEvent(new Event('change'));
            }
        }

        window.addEventListener('click', (e) => {
            const wrapper = document.querySelector('.club-lang-dropdown-wrapper');
            const list = document.getElementById('club-lang-list');
            if (wrapper && list && !wrapper.contains(e.target)) {
                list.classList.remove('open');
            }
        });

        function setNickType(type) {
            selectedNickType = type;
            const boxOwn = document.getElementById('box-own-nick');
            const boxClub = document.getElementById('box-club-nick');
            if (type === 'own') {
                boxOwn.style.borderColor = '#00ffcc';
                boxClub.style.borderColor = '#555';
            } else {
                boxClub.style.borderColor = '#00ffcc';
                boxOwn.style.borderColor = '#555';
            }
        }

        function updateNicknameValue(val, type) {
            if (type === 'own') {
                userChosenNickname = val;
                safeStorageSet('gygy_nickname', val);
            }
        }

        function renderUserPassports(targetID) {
            const idLabel = document.getElementById('id-label');
            const passIdVal = document.getElementById('pass-id-val');
            const qrBoxReg = document.getElementById('qr-box-reg');
            const passQrBox = document.getElementById('pass-qr-box');
            
            if (idLabel) idLabel.innerText = targetID;
            if (passIdVal) passIdVal.innerText = targetID;
            
            if (qrBoxReg && typeof QRCode !== 'undefined') { 
                qrBoxReg.innerHTML = ""; 
                new QRCode(qrBoxReg, { text: targetID, width: 75, height: 75 }); 
            }
            if (passQrBox && typeof QRCode !== 'undefined') { 
                passQrBox.innerHTML = ""; 
                new QRCode(passQrBox, { text: targetID, width: 90, height: 90 }); 
            }

            let clubNick = safeStorageGet('gygy_club_nick');
            if (!clubNick) {
                const coolNicks = [
                    "БигКоин", "Нападающий", "Шампань", "Магнат", "Счастливчик", 
                    "Инсайдер", "Фантом", "Победитель", "Капитан", "Маэстро", 
                    "Прайм", "Штурман", "Панчер", "Триумф", "Оракул"
                ];
                clubNick = coolNicks[Math.floor(Math.random() * coolNicks.length)];
                safeStorageSet('gygy_club_nick', clubNick);
            }

            const clubNickLabel = document.getElementById('club-nick-label');
            if (clubNickLabel) {
                clubNickLabel.innerText = clubNick;
            }
        }

        function checkAndFillRegistrationForm() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                if (tgUser.first_name) {
                    safeStorageSet('gygy_nickname', tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : ''));
                }
            }

            const savedAvatar = safeStorageGet('gy_user_img') || safeStorageGet('gygy_avatar');
            currentID = safeStorageGet('gygy_id') || safeStorageGet('gy_user_id') || safeStorageGet('gy_trace');

            if (currentID) { renderUserPassports(currentID); }

            const savedNickname = safeStorageGet('gygy_nickname') || '';
            const ownNickInput = document.getElementById('input-own-nick');
            if (ownNickInput && savedNickname) {
                ownNickInput.value = savedNickname;
                userChosenNickname = savedNickname;
            }

            if (savedAvatar) {
                currentUserImage = savedAvatar;
                const badgeImg = document.getElementById('badge-avatar-img');
                const passImg = document.getElementById('pass-avatar-img');
                if (badgeImg) badgeImg.src = savedAvatar;
                if (passImg) passImg.src = savedAvatar;

                if (savedAvatar.startsWith('data:image/svg+xml')) {
                    const avatarImg = document.getElementById('avatar-img'); if (avatarImg) { avatarImg.src = savedAvatar; avatarImg.style.display = "block"; }
                    const txtAvatar = document.getElementById('txt-avatar'); if (txtAvatar) txtAvatar.style.display = "none";
                } else { 
                    const ppImg = document.getElementById('pp'); if (ppImg) { ppImg.src = savedAvatar; ppImg.style.display = "block"; }
                    const txtPhoto = document.getElementById('txt-photo'); if (txtPhoto) txtPhoto.style.display = 'none';
                }
                const btnWHall = document.getElementById('btn-w-hall'); if(btnWHall) btnWHall.classList.remove('btn-sleep');
                const btnPass = document.getElementById('btn-pass'); if(btnPass) btnPass.classList.remove('btn-sleep');
            }

            const currentNickname = safeStorageGet('gygy_nickname') || '';
            if (currentNickname.toLowerCase() === 'модермех') {
                safeStorageSet('gygy_is_boss', 'true');
            }
            
            const isBoss = safeStorageGet('gygy_is_boss') === 'true';
            const staffBtn = document.getElementById('btn-staff-room');
            if (isBoss && staffBtn) {
                staffBtn.style.display = 'block';
            }
        }

        function enterStudio() { window.location.href = 'studio.html'; }
        function enterStaffOffice() { window.location.href = 'staff_office.html'; }

        function handleNavigationBack() {
            if (currentBlockId === 'block-hall') {
                portalTransition('block-welcome');
            } else if (currentBlockId === 'block-welcome') {
                portalTransition('block-entrance');
            }
        }

        function portalTransition(nextId) {
            const ambientBar = document.getElementById('snd-ambient');
            if (ambientBar) {
                ambientBar.pause();
                ambientBar.currentTime = 0;
            }

            if (nextId === 'block-server') { window.location.href = 'verses.html'; return; }
            if (nextId === 'block-bar') { window.location.href = 'bar.html'; return; }
            if (nextId === 'block-tables') { window.location.href = 'tables.html'; return; } 
            if (nextId === 'block-office') { window.location.href = 'office.html'; return; }

            const targetBlock = document.getElementById(nextId);
            if (!targetBlock) { console.error(`Блок не найден: ${nextId}`); return; }

            currentBlockId = nextId;

            if (window.EventBus) {
                window.EventBus.emit('ROOM_CHANGED', { room: nextId });
            }

            const badge = document.getElementById('global-user-badge');
            const navArrows = document.getElementById('club-nav-arrows');

            document.querySelectorAll('.block').forEach(b => {
                b.classList.remove('active');
                b.style.display = 'none';
            });

            targetBlock.style.display = 'flex';
            
            setTimeout(() => {
                targetBlock.classList.add('active');
            }, 20);

            if (nextId === 'block-entrance') {
                const mainDoor = document.getElementById('main-door');
                if (mainDoor) mainDoor.classList.remove('door-exploded');
                if (navArrows) navArrows.style.display = 'none';
                if (badge) badge.style.display = 'none';
            } else {
                if (navArrows) navArrows.style.display = 'flex';
                if (badge && currentUserImage) badge.style.display = 'block';
            }
        }

        function handleDoor() {
            const sndDoor = document.getElementById('snd-door');
            const sndAmbient = document.getElementById('snd-ambient');
            const mainDoor = document.getElementById('main-door');

            if (sndDoor) sndDoor.play();
            if (mainDoor) mainDoor.classList.add('door-exploded');

            setTimeout(() => {
                if (sndAmbient) {
                    sndAmbient.volume = 0.5;
                    sndAmbient.play().catch(e => console.log("Ambient blocked"));
                }
                portalTransition('block-welcome');
            }, 700);
        }

        function preview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUserImage = e.target.result;
                    const pp = document.getElementById('pp'); if (pp) { pp.src = currentUserImage; pp.style.display = 'block'; }
                    const txtPhoto = document.getElementById('txt-photo'); if (txtPhoto) txtPhoto.style.display = 'none';
                    const avatarImg = document.getElementById('avatar-img'); if (avatarImg) avatarImg.style.display = 'none';
                    const txtAvatar = document.getElementById('txt-avatar'); if (txtAvatar) txtAvatar.style.display = 'block';
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function generateAvatar() {
            const hex = Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><rect width="100" height="100" fill="#${hex}"/><circle cx="50" cy="40" r="20" fill="#000000"/><path d="M20,90 C20,70 80,70 80,90" fill="#000000"/></svg>`;
            currentUserImage = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
            const avatarImg = document.getElementById('avatar-img'); if (avatarImg) { avatarImg.src = currentUserImage; avatarImg.style.display = "block"; }
            const txtAvatar = document.getElementById('txt-avatar'); if (txtAvatar) txtAvatar.style.display = 'none';
            const pp = document.getElementById('pp'); if (pp) pp.style.display = "none";
            const txtPhoto = document.getElementById('txt-photo'); if (txtPhoto) txtPhoto.style.display = 'block';
        }

        function saveUserProfile() {
            if (!currentUserImage) return;
            
            let finalNick = '';
            if (selectedNickType === 'club') {
                finalNick = safeStorageGet('gygy_club_nick') || 'Магнат';
            } else {
                finalNick = userChosenNickname || safeStorageGet('gygy_nickname') || 'Anonymous';
            }
            
            safeStorageSet('gygy_nickname', finalNick);
            safeStorageSet('gygy_avatar', currentUserImage);
            safeStorageSet('gy_user_img', currentUserImage);
            safeStorageSet('gy_user_avatar', currentUserImage); 
            safeStorageSet('gy_user_id', currentID);

            const currentNickname = safeStorageGet('gygy_nickname') || '';
            if (currentNickname.toLowerCase() === 'модермех') {
                safeStorageSet('gygy_is_boss', 'true');
            }

            const badgeImg = document.getElementById('badge-avatar-img');
            const passImg = document.getElementById('pass-avatar-img');
            if (badgeImg) badgeImg.src = currentUserImage;
            if (passImg) passImg.src = currentUserImage;

            const badge = document.getElementById('global-user-badge');
            if (badge) badge.style.display = 'block';

            const btnWHall = document.getElementById('btn-w-hall'); if (btnWHall) btnWHall.classList.remove('btn-sleep');
            const btnPass = document.getElementById('btn-pass'); if (btnPass) btnPass.classList.remove('btn-sleep');

            triggerBoardOfDirectorsCeremony(finalNick);
        }

        const BoardOfDirectorsEvents = [
            { en: "The Board of Directors approves your entry with a loud toast.", ru: "Совет директоров одобряет ваш вход громким тостом." },
            { en: "Chambers echo with applause. Welcome to the inner circle.", ru: "Залы гудят от аплодисментов. Добро пожаловать в ближний круг." },
            { en: "The Directors stamp your dossier. Excellent choice of identity.", ru: "Директора ставят штамп на ваше досье. Отличный выбор идентичности." },
            { en: "Champagne glasses clink. Your seat at the table is reserved.", ru: "Бокалы с шампанским звенят. Ваше место за столом забронировано." }
        ];

        function triggerBoardOfDirectorsCeremony(nickname) {
            const langCode = safeStorageGet('gygy_lang_code') || 'en';
            const localizedEvents = BoardOfDirectorsEvents.map(item => ({
                text: langCode === 'ru' ? item.ru : item.en
            }));
            
            const randomEvent = localizedEvents[Math.floor(Math.random() * localizedEvents.length)].text;
            showDynamicToast(`${randomEvent} — [ ${nickname} ]`);
        }

        function showDynamicToast(message) {
            let toast = document.getElementById('dynamic-board-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'dynamic-board-toast';
                toast.style.cssText = "position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-50px); background: #000; color: #00ffcc; border: 1px solid #00ffcc; padding: 12px 24px; font-family: 'Share Tech Mono', monospace; font-size: 11px; z-index: 10000; opacity: 0; transition: all 0.4s ease; text-align: center; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,255,204,0.3); pointer-events: none;";
                document.body.appendChild(toast);
            }
            
            toast.innerText = message;
            toast.style.opacity = '1';
            toast.style.transform = 'translateX(-50%) translateY(0)';
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(-50px)';
            }, 5000);
        }

        function openPassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) { 
                modal.style.display = 'flex'; 
                setTimeout(() => { modal.style.opacity = '1'; }, 10); 
            }
        }

        function closePassport() {
            const modal = document.getElementById('modal-passport');
            if (modal) {
                modal.style.opacity = '0';
                setTimeout(() => { modal.style.display = 'none'; }, 300);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!currentID) {
                currentID = "GY-" + Math.floor(100000 + Math.random() * 900000);
                safeStorageSet('gygy_id', currentID);
            }
            checkAndFillRegistrationForm();

            updateGlobalFlagUI();
            syncGTranslateWidget();

            window.addEventListener('storage', (e) => {
                if (e.key === 'gygy_flag' || e.key === 'gy_user_flag' || e.key === 'gygy_lang_name') {
                    updateGlobalFlagUI();
                }
                if (e.key === 'gygy_lang_code') {
                    syncGTranslateWidget();
                }
            });

            setTimeout(() => { document.body.classList.add('page-loaded'); }, 50);
        });
    </script>

    <!-- ДЕБАГ-ПАНЕЛЬ ДЛЯ ТЕСТИРОВАНИЯ РОЛЕЙ -->
    <div id="debug-panel" style="position: fixed; bottom: 5px; right: 5px; background: rgba(0,0,0,0.7); color: #00ffcc; padding: 4px 8px; border-radius: 4px; font-family: monospace; z-index: 9999; font-size: 10px; border: 1px solid #00ffcc; opacity: 0.7; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.7'">
        <span>🧪 Debug:</span>
        <button onclick="debugSetRole('newbie')" style="background: #111; color: #fff; border: 1px solid #551; padding: 2px 4px; cursor: pointer; font-size: 9px; border-radius: 2px;">Новичок</button>
        <button onclick="debugSetRole('resident')" style="background: #111; color: #fff; border: 1px solid #551; padding: 2px 4px; cursor: pointer; font-size: 9px; border-radius: 2px;">Резидент</button>
    </div>
    <script>
        function debugSetRole(role) {
            if (role === 'newbie') {
                localStorage.clear();
                alert("Режим сменен: ЧИСТЫЙ НОВИЧОК. Память очищена, язык сброшен на английский по умолчанию.");
            } else if (role === 'resident') {
                localStorage.clear();
                localStorage.setItem('gygy_id', 'GY-777777');
                localStorage.setItem('gygy_avatar', 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><rect width="100" height="100" fill="%23ff0055"/><circle cx="50" cy="50" r="30" fill="%23ffffff"/></svg>');
                localStorage.setItem('gygy_nickname', 'TestResident');
                localStorage.setItem('gygy_lang_code', 'en');
                localStorage.setItem('gygy_flag', 'gb');
                alert("Режим сменен: ГОТОВЫЙ РЕЗИДЕНТ. Профиль и аватар созданы.");
            }
            location.reload();
        }
    </script>
