<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYGY Club — Interactive Portal [v1.0.5]</title>
    
    <!-- External Dependencies & Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Styles (Visual layout strictly preserved v1.0.4) -->
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --border-color: #222222;
            --card-bg: #0c0c0c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        body.page-loaded { opacity: 1; }

        #app-version {
            position: fixed; bottom: 10px; left: 15px;
            font-family: 'Share Tech Mono', monospace; font-size: 10px;
            color: var(--text-muted); z-index: 1000; opacity: 0.5; pointer-events: none;
        }

        #global-user-badge {
            position: fixed; top: 20px; right: 20px; display: none; z-index: 1000; cursor: pointer;
        }

        .badge-card {
            display: flex; align-items: center; gap: 10px;
            background: rgba(12, 12, 12, 0.85); border: 1px solid var(--accent-color);
            padding: 6px 12px; border-radius: 30px; box-shadow: 0 0 15px var(--accent-glow);
            backdrop-filter: blur(5px);
        }

        .badge-card img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .badge-card span { font-family: 'Share Tech Mono', monospace; font-size: 12px; color: var(--accent-color); }

        #club-nav-arrows {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: none; gap: 15px; z-index: 1000;
        }

        .nav-btn {
            background: #111; color: var(--accent-color); border: 1px solid var(--accent-color);
            padding: 8px 16px; font-family: 'Share Tech Mono', monospace; font-size: 12px;
            cursor: pointer; border-radius: 4px; transition: all 0.2s ease;
        }
        .nav-btn:hover { background: var(--accent-color); color: #000; box-shadow: 0 0 10px var(--accent-glow); }

        .block {
            position: absolute; width: 100%; height: 100%;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.4s ease;
        }
        .block.active { display: flex; opacity: 1; }

        #block-entrance { text-align: center; }
        .main-door-container {
            position: relative; cursor: pointer; padding: 40px;
            border: 2px dashed var(--border-color); border-radius: 12px; transition: all 0.3s ease;
        }
        .main-door-container:hover { border-color: var(--accent-color); box-shadow: 0 0 30px var(--accent-glow); }
        .main-door-container h1 { font-family: 'Share Tech Mono', monospace; font-size: 28px; letter-spacing: 2px; color: var(--accent-color); margin-bottom: 10px; }
        .main-door-container p { font-size: 13px; color: var(--text-muted); }
        .door-exploded { transform: scale(1.1); opacity: 0; filter: blur(10px); }

        .welcome-box, .identity-box {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 30px; border-radius: 8px; width: 400px; max-width: 90%; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .welcome-box h2, .identity-box h2 { font-family: 'Share Tech Mono', monospace; font-size: 20px; color: var(--accent-color); margin-bottom: 20px; }

        .club-lang-dropdown-wrapper { position: relative; margin-bottom: 20px; text-align: left; }
        .club-lang-current { background: #111; border: 1px solid var(--border-color); padding: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-radius: 4px; }
        .club-lang-current img { width: 20px; height: 14px; object-fit: cover; }
        .club-lang-list { position: absolute; top: 100%; left: 0; width: 100%; background: #111; border: 1px solid var(--border-color); max-height: 150px; overflow-y: auto; display: none; z-index: 10; }
        .club-lang-list.open { display: block; }
        .club-lang-item { padding: 8px 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; }
        .club-lang-item:hover { background: #222; }

        .identity-box { width: 450px; }
        .avatar-preview-area {
            width: 100px; height: 100px; margin: 0 auto 15px auto;
            border: 2px solid var(--border-color); border-radius: 50%; overflow: hidden;
            display: flex; justify-content: center; align-items: center; background: #111; position: relative;
        }
        .avatar-preview-area img { width: 100%; height: 100%; object-fit: cover; display: none; }

        .nickname-inputs { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; text-align: left; }
        .nick-option { background: #111; border: 1px solid var(--border-color); padding: 10px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .nick-option.selected { border-color: var(--accent-color); background: rgba(0, 255, 204, 0.05); }
        .nick-option input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-family: inherit; margin-top: 5px; }

        #block-hall { text-align: center; }
        .hall-menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 400px; max-width: 90%; }
        .hall-btn {
            background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 20px; font-family: 'Share Tech Mono', monospace; font-size: 14px; cursor: pointer; border-radius: 6px; transition: all 0.3s;
        }
        .hall-btn:hover { border-color: var(--accent-color); color: var(--accent-color); box-shadow: 0 0 15px var(--accent-glow); }

        #modal-passport {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 2000; opacity: 0; transition: opacity 0.3s ease;
        }
        .passport-card {
            background: #0d0d0d; border: 2px solid var(--accent-color); width: 350px;
            padding: 25px; border-radius: 10px; box-shadow: 0 0 40px var(--accent-glow); text-align: center; position: relative;
        }
        .passport-close { position: absolute; top: 10px; right: 15px; background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
        .passport-close:hover { color: var(--accent-color); }

        .primary-action-btn {
            background: var(--accent-color); color: #000; border: none; padding: 12px; width: 100%;
            font-family: 'Share Tech Mono', monospace; font-weight: bold; font-size: 14px; cursor: pointer; border-radius: 4px; transition: box-shadow 0.2s;
        }
        .primary-action-btn:hover { box-shadow: 0 0 15px var(--accent-glow); }
    </style>
</head>
<body>

    <div id="app-version">v1.0.4</div>

    <!-- Global Badge -->
    <div id="global-user-badge" onclick="PassportModule.openPassport()">
        <div class="badge-card">
            <img id="badge-avatar-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32'><rect width='32' height='32' fill='#222'/></svg>">
            <span id="id-label">GY-000000</span>
        </div>
    </div>

    <!-- Navigation -->
    <div id="club-nav-arrows">
        <button class="nav-btn" onclick="NavigationModule.navigateBack()">← BACK</button>
    </div>

    <!-- BLOCK 1: ENTRANCE -->
    <div id="block-entrance" class="block active">
        <div class="main-door-container" id="main-door" onclick="NavigationModule.triggerEntrance()">
            <h1>GYGY CLUB</h1>
            <p>[ Click to Breach Portal ]</p>
        </div>
    </div>

    <!-- BLOCK 2: WELCOME -->
    <div id="block-welcome" class="block">
        <div class="welcome-box">
            <h2>SELECT LANGUAGE</h2>
            <div class="club-lang-dropdown-wrapper">
                <div class="club-lang-current" onclick="LanguageModule.toggleDropdown()">
                    <img id="current-flag" src="https://flagcdn.com/w20/gb.png">
                    <span id="current-lang-name">English</span>
                </div>
                <div class="club-lang-list" id="club-lang-list"></div>
            </div>
            <button class="primary-action-btn" onclick="NavigationModule.switchBlock('block-identity')">PROCEED →</button>
        </div>
    </div>

    <!-- BLOCK 3: IDENTITY -->
    <div id="block-identity" class="block">
        <div class="identity-box">
            <h2>YOUR IDENTITY</h2>
            <div class="avatar-preview-area">
                <span id="txt-photo" style="font-size: 11px; color: var(--text-muted);">NO AVATAR</span>
                <img id="pp" src="">
                <img id="avatar-img" src="">
            </div>
            
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 15px;">
                <input type="file" id="file-input" style="display:none;" onchange="PassportModule.handleFileUpload(this)">
                <button class="nav-btn" onclick="document.getElementById('file-input').click()">Upload</button>
                <button class="nav-btn" onclick="PassportModule.generateSvgAvatar()">Generate SVG</button>
            </div>

            <div class="nickname-inputs">
                <div class="nick-option selected" id="box-own-nick" onclick="PassportModule.selectNickMode('own')">
                    <span style="font-size: 11px; color: var(--text-muted);">Custom Nickname</span>
                    <input type="text" id="input-own-nick" placeholder="Enter name..." oninput="PassportModule.updateNickname(this.value)">
                </div>
                <div class="nick-option" id="box-club-nick" onclick="PassportModule.selectNickMode('club')">
                    <span style="font-size: 11px; color: var(--text-muted);">Assigned Club Nickname</span>
                    <div id="club-nick-label" style="font-family: 'Share Tech Mono', monospace; font-size: 14px; color: var(--accent-color); margin-top: 5px;">-</div>
                </div>
            </div>

            <button class="primary-action-btn" onclick="PassportModule.saveAndEnter(); NavigationModule.switchBlock('block-hall')">ENTER CLUB →</button>
        </div>
    </div>

    <!-- BLOCK 4: HALL -->
    <div id="block-hall" class="block">
        <div class="hall-menu">
            <button class="hall-btn" onclick="NavigationModule.switchBlock('block-server')">VERSES</button>
            <button class="hall-btn" onclick="NavigationModule.switchBlock('block-bar')">BAR</button>
            <button class="hall-btn" onclick="NavigationModule.switchBlock('block-tables')">TABLES</button>
            <button class="hall-btn" onclick="NavigationModule.switchBlock('block-office')">OFFICE</button>
        </div>
    </div>

    <!-- MODAL PASSPORT -->
    <div id="modal-passport">
        <div class="passport-card">
            <button class="passport-close" onclick="PassportModule.closePassport()">×</button>
            <h3 style="font-family: 'Share Tech Mono', monospace; color: var(--accent-color); margin-bottom: 15px;">MEMBERSHIP DOSSIER</h3>
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px; text-align: left;">
                <img id="pass-avatar-img" src="" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent-color);">
                <div>
                    <div id="pass-id-val" style="font-family: 'Share Tech Mono', monospace; font-size: 14px; color: var(--accent-color);">GY-000000</div>
                    <div style="font-size: 12px; color: var(--text-muted);">Authorized Resident</div>
                </div>
            </div>
            <div id="pass-qr-box" style="display: flex; justify-content: center; background: #fff; padding: 10px; border-radius: 4px;"></div>
        </div>
    </div>

    <!-- Audio System -->
    <audio id="snd-door" src="https://actions.google.com/sounds/v1/doors/wood_creak.ogg" preload="auto"></audio>
    <audio id="snd-ambient" src="https://actions.google.com/sounds/v1/ambiences/coffee_shop.ogg" preload="auto" loop></audio>

    <!-- Подключение ваших модулей (архитектура Arduino / модульный подход) -->
    <script src="modules/language.js"></script>
    <script src="modules/passport.js"></script>
    <script src="modules/situationalScanner.js"></script>
    <script src="modules/navigation.js"></script>

    <!-- Системный инициализатор (Setup Loop) -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            console.log("GYGY Club System Booting...");
            
            // Инициализация подсистем, если они используют методы инициализации
            if (window.LanguageModule && typeof LanguageModule.init === 'function') LanguageModule.init();
            if (window.PassportModule && typeof PassportModule.init === 'function') PassportModule.init();
            if (window.SituationalScanner && typeof SituationalScanner.init === 'function') SituationalScanner.init();
            if (window.NavigationModule && typeof NavigationModule.init === 'function') NavigationModule.init();

            setTimeout(() => { document.body.classList.add('page-loaded'); }, 50);
        });
    </script>
</body>
</html>
