<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v7.0.11 CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #FFD700; --door-wood: #3E2723; --violet: #8A2BE2; --neon-glow: rgba(138, 43, 226, 0.6); }
        
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        body, button, input, div, img, span { pointer-events: auto !important; }
        img { -webkit-user-drag: none !important; }

        html, body { 
            width: 100%; height: 100%; background: #000000; color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin: 0; padding: 0;
            opacity: 1 !important;
        }
        
        button, .ui-user-badge, .arrow-item, .painting-zone, #main-door, .box-final, .nickname-square {
            transition: all 0.3s ease !important;
        }
        button:hover, .ui-user-badge:hover, .arrow-item:hover, .painting-zone:hover, #main-door:hover, .box-final:hover, .nickname-square:hover {
            filter: brightness(1.1);
        }

        .ui-header-right { 
            position: fixed; top: 18px; right: 25px; z-index: 1000000; 
            font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif;
            text-shadow: -1px -1px 0 #000000, 1px -1px 0 #000000, -1px 1px 0 #000000, 1px 1px 0 #000000;
        }
        
        .ui-user-badge {
            position: fixed; top: 4px; left: 50%; transform: translateX(-50%);
            width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--gold); background: #111111;
            box-shadow: 0 0 0 1px #000000, inset 0 0 5px rgba(0,0,0,0.8); z-index: 1000000; cursor: pointer; display: none;
        }
        .ui-user-badge .badge-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background-color: #ffffff; }
        .ui-user-badge .badge-flag {
            position: absolute; bottom: -2px; right: -4px; width: 14px; height: 10px; object-fit: cover;
            border: 1px solid var(--gold); box-shadow: 0 0 0 1px #000000;
        }

        .club-lang-dropdown-wrapper {
            position: absolute; top: 18px; left: 20px; z-index: 1000001; width: 155px; font-family: 'Share Tech Mono', monospace;
        }
        .club-lang-current {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold); padding: 5px 8px; border-radius: 10px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.9); width: 100%;
        }
        .club-lang-current-content { display: flex; align-items: center; gap: 7px; min-width: 0; }
        .club-lang-current .item-avatar {
            width: 20px; height: 20px; border-radius: 50%; overflow: hidden; border: 1px solid var(--gold); background: #111; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .club-lang-current .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .club-lang-current .item-flag { width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
        .club-lang-current .item-text { color: var(--gold); font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .club-lang-current .arrow-down { color: var(--gold); font-size: 10px; font-weight: bold; flex-shrink: 0; }

        .club-lang-list {
            position: absolute; top: calc(100% + 5px); left: 0;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold); border-radius: 10px; width: 100%; max-height: 260px; overflow-y: auto;
            display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.9); z-index: 1000002;
        }
        .club-lang-list.open { display: block; }
        
        .club-lang-item {
            display: flex; align-items: center; gap: 7px; padding: 6px 8px; cursor: pointer; border-bottom: 1px solid rgba(255,215,0,0.15); transition: background 0.2s;
        }
        .club-lang-item:last-child { border-bottom: none; }
        .club-lang-item:hover { background: rgba(255,215,0,0.15); }
        .club-lang-item .item-avatar { width: 20px; height: 20px; border-radius: 50%; overflow: hidden; border: 1px solid var(--gold); background: #111; flex-shrink: 0; }
        .club-lang-item .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .club-lang-item .item-flag { width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
        .club-lang-item .item-text { color: var(--gold); font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .passport-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; }
        .passport-card { background: #F5F5DC; border: 3px solid var(--gold); border-radius: 16px; padding: 25px; width: 280px; color: #000000; text-align: center; box-shadow: 0 0 25px rgba(0,0,0,0.5); position: relative; }
        .passport-card .box-final { margin: 15px auto; border-color: #000000; }
        .passport-close-btn { position: absolute; top: 10px; right: 14px; font-size: 28px; font-weight: bold; color: #000000; cursor: pointer; line-height: 1; user-select: none; }

        .block { 
            position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000000; z-index: 10; opacity: 0; transition: opacity 0.5s ease-in-out; 
        }
        .block.active { display: flex !important; opacity: 1 !important; z-index: 5000 !important; }

        .quote-text { font-family: 'Cormorant Garamond', 'Playfair Display', serif; font-style: italic; font-size: 20px; text-align: center; max-width: 85%; margin-bottom: 8px; text-shadow: 2px 2px 4px #000000; }
        .btn-gy { min-width: 240px; padding: 10px 18px; background: #000000; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 700; margin: 4px 0; font-family: 'Montserrat', 'Cinzel', sans-serif; font-size: 12px; }
        
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; cursor: not-allowed; }
        .box-final { width: 75px; height: 75px; border: 2px solid var(--gold); background: #ffffff; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }

        .identity-grid-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; width: 250px; }
        .identity-grid-row { display: flex; gap: 8px; justify-content: center; }
        .nickname-square {
            width: 75px; height: 75px; border: 2px solid var(--gold); background: #ffffff; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; color: #000000; padding: 4px; text-align: center;
        }
        .nickname-square.selected { border-color: #ffffff; box-shadow: 0 0 10px var(--gold); }
        .nickname-square input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: none; background: transparent; }

        #block-welcome { justify-content: center !important; padding-top: 0 !important; }
        #block-welcome img { max-height: 22vh !important; width: auto; object-fit: contain; margin: 6px 0 !important; filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6)); }
        #block-welcome .welcome-title-elem { font-size: 24px !important; font-weight: 700; letter-spacing: 8px; font-style: italic; margin-bottom: 6px !important; font-family: 'Cinzel', serif; }

        .ui-nav-arrows {
            position: fixed; top: 18px; left: 20px; z-index: 9999999; display: flex; gap: 15px; font-size: 24px; font-weight: 900 !important; 
            font-family: 'Share Tech Mono', monospace; cursor: pointer; color: var(--gold); line-height: 1; letter-spacing: -2px; 
            background: transparent !important; border: none !important; text-shadow: -1px -1px 0 #000000, 1px -1px 0 #000000, -1px 1px 0 #000000, 1px 1px 0 #000000; pointer-events: auto !important; user-select: none;
        }
        .arrow-item { transition: opacity 0.2s, transform 0.2s; background: transparent !important; border: none !important; }
        .arrow-item:hover { opacity: 0.8; transform: scale(1.1); }

        #block-hall { background: #111111; }
        .hall-interior { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; }
        .hall-interior .quote-text { 
            position: absolute; top: 10vh; left: 50%; transform: translateX(-50%); width: 85%; margin: 0; text-align: center; padding: 0; background: transparent !important; color: var(--gold) !important; font-size: 24px; font-weight: 700; -webkit-text-stroke: 1px #000000; text-stroke: 1px #000000;
        }
        .hall-door-target { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 24vw; height: 60vh; cursor: pointer; z-index: 5; background: transparent; }
        .painting-zone { position: absolute; top: 25vh; width: 6vw; height: 12vh; cursor: pointer; z-index: 6; background: rgba(255,215,0,0.1); border: 1px dashed var(--gold); display: flex; align-items: center; justify-content: center; }
        .painting-left { left: 23vw; }
        .painting-right { right: 23vw; }

        .cue-arrow-hall { color: var(--violet); font-size: 34px; font-weight: 900; font-family: 'Share Tech Mono', monospace; text-shadow: 0 0 12px var(--violet), 0 0 20px var(--violet); pointer-events: none; user-select: none; z-index: 10; transition: opacity 0.2s; }
        .painting-zone:hover .cue-arrow-hall { opacity: 0.8; }

        .manifest-btn-box { position: absolute; bottom: -45px; left: 50%; transform: translateX(-50%); width: 130px; display: flex; flex-direction: column; gap: 5px; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s, bottom 0.4s; z-index: 10; }
        .btn-manifest { width: 100%; padding: 5px 0; font-size: 11px; margin: 0; background: #000000; box-shadow: 0 4px 10px rgba(0,0,0,0.9); }
        
        #main-door { display: block; height: 48vh; max-height: 400px; width: auto; max-width: 100%; object-fit: contain; margin: 0 auto; transform: scale(1); transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease-out; cursor: pointer; background: #222; border: 2px solid var(--gold); }
        .door-exploded { transform: scale(3.5) !important; opacity: 0 !important; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="global-user-badge" class="ui-user-badge notranslate" onclick="openPassport()">
        <img id="badge-avatar-img" class="badge-img" src="">
        <img id="badge-flag-img" class="badge-flag" src="https://flagcdn.com/w20/gb.png">
    </div>

    <div class="notranslate ui-nav-arrows" id="club-nav-arrows" style="display: none;">
        <div id="arrow-back" class="arrow-item" onclick="handleNavigationBack()">&lt;</div>
        <div id="arrow-home" class="arrow-item" onclick="portalTransition('block-entrance')">&lt;&lt;</div>
    </div>
    
    <div class="ui-header-right notranslate">GY-GY</div>

    <div id="block-entrance" class="block active">
        <div class="club-lang-dropdown-wrapper notranslate">
            <div class="club-lang-current" onclick="toggleLangDropdown()">
                <div class="club-lang-current-content">
                    <div class="item-avatar"><img src="https://via.placeholder.com/20" alt="Club AI"></div>
                    <img id="current-flag" class="item-flag" src="https://flagcdn.com/w20/gb.png" alt="Flag">
                    <span id="current-lang-name" class="item-text">English</span>
                </div>
                <span class="arrow-down">▼</span>
            </div>
            <div id="club-lang-list" class="club-lang-list"></div>
        </div>

        <div style="text-align: center; cursor: pointer;" onclick="handleDoor()">
            <div id="main-door" style="display:flex; align-items:center; justify-content:center; width:200px; height:300px; margin:0 auto; color:var(--gold); font-weight:bold;">OPEN DOOR</div>
        </div>
    </div>

    <div id="block-welcome" class="block">
        <div class="quote-text">I'M CHARLIE</div>
        <div class="quote-text">In every joke there is a share of whisky</div>
        <div class="welcome-title-elem">WELCOME</div>
        <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">PROCEED TO HALL</button>
        <button class="btn-gy" onclick="portalTransition('block-identity')">GET ID</button>
    </div>  

    <div id="block-identity" class="block">
        <div class="quote-text">There is never too much champagne</div>
        <div class="identity-grid-container">
            <div class="identity-grid-row">
                <div id="box-own-nick" class="nickname-square selected" onclick="setNickType('own'); document.getElementById('input-own-nick').focus();">
                    <span style="font-size: 7px; font-weight: 900; pointer-events: none;">YOUR NICK</span>
                    <input type="text" id="input-own-nick" placeholder="Enter nick" oninput="updateNicknameValue(this.value, 'own')" onclick="event.stopPropagation(); setNickType('own');" style="width: 95%; background: transparent; border: none; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 10px; font-weight: bold; color: #000; outline: none; margin-top: 4px; z-index: 5;">
                </div>
                <div id="box-club-nick" class="nickname-square" onclick="setNickType('club')">
                    <span style="font-size: 7px; font-weight: 900; pointer-events: none;">CLUB NICK</span>
                    <span id="club-nick-label" style="font-size: 8px; margin-top: 4px; font-weight: 700; pointer-events: none; color: #000;">БигКоин</span>
                </div>
                <div class="box-final" style="color:#000000; font-size:10px; font-weight:900;" id="id-label">#ID</div>
            </div>
            <div class="identity-grid-row">
                <div class="box-final" id="qr-box-reg"></div>
                <div class="box-final" style="cursor:pointer;" onclick="document.getElementById('file-input').click()">
                    <input type="file" id="file-input" onchange="preview(this)" style="display:none;">
                    <img id="pp" style="display:none; width:100%; height:100%; object-fit:cover;">
                    <span id="txt-photo" style="color:#000000; font-size:9px; font-weight:900; pointer-events: none;">OR PHOTO</span>
                </div>
                <div class="box-final" style="cursor:pointer;" onclick="generateAvatar()">
                    <img id="avatar-img" style="display:none; width:100%; height:100%; object-fit:cover;">
                    <span id="txt-avatar" style="color:#000000; font-size:9px; font-weight:900; text-align:center; pointer-events: none;">OR AVATAR</span>
                </div>
            </div>
        </div>
        <button id="btn-save" class="btn-gy" onclick="saveUserProfile()">SAVE</button>
        <button id="btn-pass" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">PROCEED</button>
    </div>

    <div id="block-hall" class="block">
        <div class="hall-interior" style="position: relative;">
            <div class="quote-text">In every joke there is a share of whisky</div>
            <div class="painting-zone painting-left" onclick="toggleManifest('manifest-left')">
                <span class="cue-arrow-hall">→</span>
                <div id="manifest-left" class="manifest-btn-box" data-opened="false">
                    <button class="btn-gy btn-manifest" onclick="event.stopPropagation(); portalTransition('block-server')">AI ROOM</button>
                </div>
            </div>
            <div class="painting-zone painting-right" onclick="toggleManifest('manifest-right')">
                <span class="cue-arrow-hall">←</span>
                <div id="manifest-right" class="manifest-btn-box" data-opened="false">
                    <button class="btn-gy btn-manifest" onclick="event.stopPropagation(); alert('Studio')">STUDIO</button>
                </div>
            </div>
        </div>
        <div class="hall-doors-container" style="position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 24vw; height: 60vh; z-index: 5;">
            <div id="hall-doors" class="hall-door-target" onclick="portalTransition('block-bar')"></div>
            <div class="bar-entrance-marker" style="position: absolute; bottom: 4vh; left: 50%; transform: translateX(-50%); pointer-events: none; text-align: center;">
                <span class="cue-arrow-hall" style="font-size: 34px; line-height: 1; color: var(--violet); font-weight: 900;">↑</span>
            </div>
        </div>
    </div>

    <div id="modal-passport" class="passport-overlay" onclick="closePassport()">
        <div class="passport-card" onclick="event.stopPropagation()">
            <div class="passport-close-btn" onclick="closePassport()">&times;</div>
            <div id="pass-id-title" style="font-weight:900; font-size:16px; letter-spacing:1px; font-family:'Cinzel',serif;">GY-GY PASSPORT</div>
            <div id="pass-id-val" style="font-weight:700; font-size:13px; margin-top:5px; color:#555555;">#ID</div>
            <div id="pass-nickname-val" style="font-weight:700; font-size:14px; margin-top:4px; color:#000000; font-family:'Share Tech Mono', monospace;">NICKNAME</div>
            <div class="box-final" style="width:90px; height:90px; border-radius:50%; border:2px solid var(--gold); margin: 8px auto;"><img id="pass-avatar-img" style="width:100%; height:100%; object-fit:cover; border-radius:50%; background-color:#ffffff;"></div>
            <div class="box-final" id="pass-qr-box" style="width:100px; height:100px; padding:5px; margin: 8px auto;"></div>
            <div style="font-size:10px; font-weight:900; color:#333333; margin-top:5px; text-transform:uppercase;">Click &times; or outside to close</div>
        </div>
    </div>

    <script>
        // Встроенное хранилище на случай отсутствия core/storage.js
        window.GyStorage = {
            get: (key) => localStorage.getItem(key),
            set: (key, val) => localStorage.setItem(key, val)
        };
        window.EventBus = { emit: () => {} };

        const clubLanguages = [
            { code: 'en', name: 'English', flag: 'https://flagcdn.com/w20/gb.png' },
            { code: 'ru', name: 'Русский', flag: 'https://flagcdn.com/w20/ru.png' },
            { code: 'es', name: 'Español', flag: 'https://flagcdn.com/w20/es.png' }
        ];

        let currentID = "GY-" + Math.floor(100000 + Math.random() * 900000);
        let currentUserImage = "";
        let currentBlockId = 'block-entrance';
        let selectedNickType = 'own';
        let userChosenNickname = '';

        document.addEventListener("DOMContentLoaded", () => {
            renderFilteredLanguageList();
            checkAndFillRegistrationForm();
        });

        function toggleLangDropdown() {
            document.getElementById('club-lang-list').classList.toggle('open');
        }

        function renderFilteredLanguageList() {
            const listContainer = document.getElementById('club-lang-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';
            clubLanguages.forEach(lang => {
                const item = document.createElement('div');
                item.className = 'club-lang-item';
                item.onclick = () => selectClubLanguage(lang.code, lang.name, lang.flag);
                item.innerHTML = `
                    <div class="item-avatar"><img src="https://via.placeholder.com/20" alt=""></div>
                    <img class="item-flag" src="${lang.flag}" alt="">
                    <span class="item-text">${lang.name}</span>
                `;
                listContainer.appendChild(item);
            });
        }

        function selectClubLanguage(code, name, flag) {
            document.getElementById('current-lang-name').innerText = name;
            document.getElementById('current-flag').src = flag;
            document.getElementById('club-lang-list').classList.remove('open');
            GyStorage.set('gygy_lang_code', code);
        }

        function setNickType(type) {
            selectedNickType = type;
            document.getElementById('box-own-nick').classList.toggle('selected', type === 'own');
            document.getElementById('box-club-nick').classList.toggle('selected', type === 'club');
        }

        function updateNicknameValue(val) {
            userChosenNickname = val;
            GyStorage.set('gygy_nickname', val);
        }

        function toggleManifest(boxId) {
            const box = document.getElementById(boxId);
            const isOpened = box.getAttribute('data-opened') === "true";
            box.style.opacity = isOpened ? "0" : "1";
            box.style.pointerEvents = isOpened ? "none" : "auto";
            box.setAttribute('data-opened', isOpened ? "false" : "true");
            box.style.bottom = isOpened ? "-45px" : "-32px";
        }

        function renderUserPassports(targetID) {
            document.getElementById('id-label').innerText = targetID;
            document.getElementById('pass-id-val').innerText = targetID;
            
            const qrBoxReg = document.getElementById('qr-box-reg');
            if (qrBoxReg && typeof QRCode !== 'undefined') { 
                qrBoxReg.innerHTML = ""; 
                new QRCode(qrBoxReg, { text: targetID, width: 75, height: 75 }); 
            }
            const passQrBox = document.getElementById('pass-qr-box');
            if (passQrBox && typeof QRCode !== 'undefined') { 
                passQrBox.innerHTML = ""; 
                new QRCode(passQrBox, { text: targetID, width: 90, height: 90 }); 
            }
            document.getElementById('club-nick-label').innerText = "БигКоин";
        }

        function checkAndFillRegistrationForm() {
            let id = GyStorage.get('gygy_id');
            if (!id) {
                id = currentID;
                GyStorage.set('gygy_id', id);
            } else {
                currentID = id;
            }
            renderUserPassports(currentID);

            const savedAvatar = GyStorage.get('gygy_avatar');
            if (savedAvatar) {
                currentUserImage = savedAvatar;
                document.getElementById('badge-avatar-img').src = savedAvatar;
                document.getElementById('pass-avatar-img').src = savedAvatar;
                document.getElementById('pp').src = savedAvatar;
                document.getElementById('pp').style.display = 'block';
                document.getElementById('txt-photo').style.display = 'none';
                
                document.getElementById('btn-w-hall').classList.remove('btn-sleep');
                document.getElementById('btn-pass').classList.remove('btn-sleep');
            }
        }

        function generateAvatar() {
            currentUserImage = 'https://via.placeholder.com/150/000000/FFD700?text=GY';
            document.getElementById('avatar-img').src = currentUserImage;
            document.getElementById('avatar-img').style.display = 'block';
            document.getElementById('txt-avatar').style.display = 'none';
            document.getElementById('badge-avatar-img').src = currentUserImage;
            document.getElementById('pass-avatar-img').src = currentUserImage;
            
            document.getElementById('btn-w-hall').classList.remove('btn-sleep');
            document.getElementById('btn-pass').classList.remove('btn-sleep');
        }

        function saveUserProfile() {
            if (currentUserImage) {
                GyStorage.set('gygy_avatar', currentUserImage);
                document.getElementById('global-user-badge').style.display = 'block';
                alert('Saved successfully!');
            } else {
                alert('Please select or generate a photo/avatar first.');
            }
        }

        function handleNavigationBack() {
            if (currentBlockId === 'block-hall') portalTransition('block-identity');
            else if (currentBlockId === 'block-identity') portalTransition('block-welcome');
            else if (currentBlockId === 'block-welcome') portalTransition('block-entrance');
        }

        function portalTransition(nextId) {
            const targetBlock = document.getElementById(nextId);
            if (!targetBlock) return;

            currentBlockId = nextId;
            document.querySelectorAll('.block').forEach(b => {
                b.classList.remove('active');
                b.style.display = 'none';
            });

            targetBlock.style.display = 'flex';
            setTimeout(() => { targetBlock.classList.add('active'); }, 20);

            const badge = document.getElementById('global-user-badge');
            const navArrows = document.getElementById('club-nav-arrows');

            if (nextId === 'block-entrance') {
                navArrows.style.display = 'none';
                badge.style.display = 'none';
            } else {
                navArrows.style.display = 'flex';
                if (currentUserImage) badge.style.display = 'block';
            }
        }

        function handleDoor() {
            portalTransition('block-welcome');
        }

        function preview(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUserImage = e.target.result;
                    const pp = document.getElementById('pp'); 
                    pp.src = currentUserImage; 
                    pp.style.display = 'block';
                    document.getElementById('txt-photo').style.display = 'none';
                    
                    document.getElementById('btn-w-hall').classList.remove('btn-sleep');
                    document.getElementById('btn-pass').classList.remove('btn-sleep');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openPassport() {
            document.getElementById('modal-passport').style.display = 'flex';
            setTimeout(() => document.getElementById('modal-passport').style.opacity = '1', 10);
        }

        function closePassport() {
            document.getElementById('modal-passport').style.opacity = '0';
            setTimeout(() => document.getElementById('modal-passport').style.display = 'none', 300);
        }
    </script>
</body>
</html>
