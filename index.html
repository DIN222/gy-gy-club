<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.6.2 CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #FFD700; --door-wood: #3E2723; --violet: #8A2BE2; --neon-glow: rgba(138, 43, 226, 0.6); }
        
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        body, button, input, div, img, span { pointer-events: auto !important; }
        img { -webkit-user-drag: none !important; }

        html, body { 
            width: 100%; 
            height: 100%; 
            background: #000000; 
            color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; 
            overflow: hidden; 
            position: fixed; 
            margin: 0; 
            padding: 0;
        }
        
        button, .ui-user-badge, .arrow-item, .painting-zone, #main-door, .box-final, .nickname-square {
            transition: all 0.3s ease !important;
        }
        button:hover, .ui-user-badge:hover, .arrow-item:hover, .painting-zone:hover, #main-door:hover, .box-final:hover, .nickname-square:hover {
            filter: brightness(1.1);
        }

        /* ЛОГОТИП GY-GY */
        .ui-header-right { 
            position: fixed; top: 18px; right: 25px; z-index: 1000000; 
            font-size: 24px; letter-spacing: 5px; font-weight: bold; 
            font-family: 'Cinzel', serif;
            text-shadow: -1px -1px 0 #000000, 1px -1px 0 #000000, -1px 1px 0 #000000, 1px 1px 0 #000000;
        }

        /* КОМПАКТНЫЙ ЯЗЫКОВЫЙ БЛОК */
        .club-lang-dropdown-wrapper {
            position: absolute; top: 18px; left: 20px; z-index: 1000001;
            width: 155px; font-family: 'Share Tech Mono', monospace;
        }
        .club-lang-current {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold);
            padding: 5px 8px; border-radius: 10px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.9); width: 100%;
        }
        .club-lang-current-content { display: flex; align-items: center; gap: 7px; min-width: 0; }
        .club-lang-current .item-avatar {
            width: 20px; height: 20px; border-radius: 50%; overflow: hidden;
            border: 1px solid var(--gold); background: #111; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .club-lang-current .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .club-lang-current .item-flag { width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
        .club-lang-current .item-text { color: var(--gold); font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .club-lang-current .arrow-down { color: var(--gold); font-size: 10px; font-weight: bold; flex-shrink: 0; }

        .club-lang-list {
            position: absolute; top: calc(100% + 5px); left: 0;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold);
            border-radius: 10px; width: 100%; max-height: 260px; overflow-y: auto;
            display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.9); z-index: 1000002;
        }
        .club-lang-list.open { display: block; }
        
        .club-lang-item {
            display: flex; align-items: center; gap: 7px;
            padding: 6px 8px; cursor: pointer; border-bottom: 1px solid rgba(255,215,0,0.15);
            transition: background 0.2s;
        }
        .club-lang-item:hover { background: rgba(255,215,0,0.15); }
        .club-lang-item .item-flag { width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
        .club-lang-item .item-text { color: var(--gold); font-size: 11px; font-weight: bold; }

        /* УНИВЕРСАЛЬНЫЙ КЛАСС ДЛЯ БЛОКОВ СТРАНИЦ */
        .block { 
            position: fixed; inset: 0; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
            background: #000000; z-index: 10; opacity: 0; 
            transition: opacity 1.2s ease-in-out; 
        }
        .block.active { display: flex !important; opacity: 1 !important; z-index: 5000 !important; }

        .quote-text { 
            font-family: 'Cormorant Garamond', 'Playfair Display', serif; 
            font-style: italic; font-size: 20px; text-align: center; 
            max-width: 85%; margin-bottom: 15px; text-shadow: 2px 2px 4px #000000; 
        }
        .btn-gy { 
            min-width: 240px; padding: 10px 18px; background: #000000; 
            border: 2px solid var(--gold); color: var(--gold); cursor: pointer; 
            text-transform: uppercase; font-weight: 700; margin: 4px 0; 
            font-family: 'Montserrat', 'Cinzel', sans-serif; font-size: 12px; 
        }

        /* СТИЛИ ДЛЯ ГЛАВНОЙ ДВЕРИ (САНКЦИЯ ЗАЩИТЫ ОТ ПУСТОГО ЭКРАНА) */
        #block-welcome { justify-content: center !important; }
        #main-door {
            display: block;
            height: 45vh;
            max-height: 380px;
            width: auto;
            max-width: 90vw;
            object-fit: contain;
            margin: 10px auto; 
            transform: scale(1);
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease-out;
            cursor: pointer;
            /* Запасной стиль на случай если картинка door_closed.png не найдена */
            background: radial-gradient(circle, #3E2723 0%, #111 80%);
            border: 3px solid var(--gold);
            border-radius: 8px;
        }
        .door-exploded { transform: scale(3.5) !important; opacity: 0 !important; }

        /* НАВИГАЦИОННЫЕ СТРЕЛКИ */
        .ui-nav-arrows {
            position: fixed; top: 18px; left: 20px; z-index: 9999999; 
            display: flex; gap: 15px; font-size: 24px; font-weight: 900; 
            font-family: 'Share Tech Mono', monospace; cursor: pointer; color: var(--gold); 
            line-height: 1; background: transparent; border: none;
            text-shadow: -1px -1px 0 #000000, 1px -1px 0 #000000;
        }
        .arrow-item { background: transparent; border: none; color: var(--gold); cursor: pointer; font-size: 24px; }

        body { opacity: 0; transition: opacity 1.2s ease-in-out; }
        body.page-loaded { opacity: 1; }
    </style>
</head>
<body class="page-loaded" oncontextmenu="return false;">

    <!-- Логотип -->
    <div class="ui-header-right">GY-GY</div>
    
    <!-- Языковой селектор (Стабильный узел) -->
    <div class="club-lang-dropdown-wrapper" id="lang-dropdown">
        <div class="club-lang-current" onclick="toggleLangDropdown()">
            <div class="club-lang-current-content">
                <div class="item-avatar"><img id="current-lang-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><rect width='20' height='20' fill='%23FFD700'/></svg>" alt=""></div>
                <span class="item-text" id="current-lang-name">English</span>
            </div>
            <span class="arrow-down">▼</span>
        </div>
        <div class="club-lang-list" id="lang-list-container">
            <div class="club-lang-item" onclick="setLanguage('en', 'English')">
                <span class="item-text">English</span>
            </div>
            <div class="club-lang-item" onclick="setLanguage('ru', 'Русский')">
                <span class="item-text">Русский</span>
            </div>
        </div>
    </div>

    <!-- Стрелки навигации -->
    <div class="ui-nav-arrows" id="nav-arrows" style="display: none;">
        <button class="arrow-item" onclick="portalTransition('block-welcome')">&#10094;</button>
    </div>

    <!-- БЛОК 1: WELCOME (Вход) -->
    <div id="block-welcome" class="block active">
        <div class="quote-text">"The door is open for those who dare to step through."</div>
        <!-- Если картинка door_closed.png отсутствует, сработает CSS-заглушка рамки -->
        <img src="door_closed.png" alt="Door" id="main-door" onclick="explodeDoor()" onerror="this.style.opacity='0.9'">
        <button class="btn-gy" style="margin-top: 15px;" onclick="portalTransition('block-hall')">Enter Club</button>
    </div>

    <!-- БЛОК 2: HALL (Холл) -->
    <div id="block-hall" class="block">
        <div class="quote-text" style="position: absolute; top: 15vh;">Welcome to the Inner Sanctum</div>
        <button class="btn-gy" onclick="portalTransition('block-welcome')">Back to Door</button>
    </div>

    <script>
        // Управление языковым меню
        function toggleLangDropdown() {
            const list = document.getElementById('lang-list-container');
            list.classList.toggle('open');
        }

        function setLanguage(code, name) {
            document.getElementById('current-lang-name').innerText = name;
            toggleLangDropdown();
        }

        // Закрытие выпадающего списка при клике вне его
        window.addEventListener('click', function(e) {
            const dropdown = document.getElementById('lang-dropdown');
            if (!dropdown.contains(e.target)) {
                document.getElementById('lang-list-container').classList.remove('open');
            }
        });

        // Переходы между секциями (Event-Driven / Простая логика)
        function portalTransition(nextId) {
            const currentActive = document.querySelector('.block.active');
            const nextBlock = document.getElementById(nextId);

            if (currentActive) {
                currentActive.style.opacity = '0';
                setTimeout(() => {
                    currentActive.classList.remove('active');
                    if (nextBlock) {
                        nextBlock.classList.add('active');
                        setTimeout(() => { nextBlock.style.opacity = '1'; }, 50);
                    }
                }, 600);
            } else if (nextBlock) {
                nextBlock.classList.add('active');
                setTimeout(() => { nextBlock.style.opacity = '1'; }, 50);
            }

            const navArrows = document.getElementById('nav-arrows');
            navArrows.style.display = (nextId === 'block-hall') ? 'flex' : 'none';
        }

        function explodeDoor() {
            const door = document.getElementById('main-door');
            door.classList.add('door-exploded');
            setTimeout(() => {
                portalTransition('block-hall');
            }, 500);
        }
    </script>
</body>
</html>
