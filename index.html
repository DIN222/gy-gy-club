<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club - Block 1 12: Entrance</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #FFD700; --door-wood: #3E2723; --violet: #8A2BE2; }
        
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000000 !important; margin: 0; padding: 0; overflow: hidden; position: fixed; }
        body { color: var(--gold); font-family: 'Share Tech Mono', monospace; }

        /* Блоки и переходы */
        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000000; z-index: 10; }
        .block.active { display: flex !important; z-index: 5000 !important; }

        .quote-text { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; text-align: center; max-width: 85%; margin-bottom: 6px; }
        .btn-gy { min-width: 240px; padding: 9px 16px; background: #000000; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 700; margin: 3px 0; font-family: 'Montserrat', sans-serif; font-size: 11px; }
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; cursor: not-allowed; }

        #main-door { display: block; height: 48vh; max-height: 400px; width: auto; max-width: 100%; object-fit: contain; cursor: pointer; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease-out; }
        .door-exploded { transform: scale(3.5) !important; opacity: 0 !important; }

        /* Скрываем техническую панель Google Translate */
        .goog-te-banner-frame, .goog-te-balloon-frame { display: none !important; }
        body { top: 0 !important; }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Скрытый элемент для Google Translate -->
    <div id="google_translate_element" style="display:none;"></div>

    <!-- Аудио сопровождение -->
    <audio id="snd-door" src="door_open.mp3" preload="auto"></audio>
    <audio id="snd-ambient" src="bar_ambient.mp3" loop preload="auto"></audio>

    <!-- Блок 1А: Входная дверь и Слот под Языковой модуль -->
    <div id="block-entrance" class="block active">
        <!-- Сюда динамически подгрузится выпадающий список из модульной системы -->
        <div id="lang-container"></div>
        
        <img src="door_1.jpg?v=2" id="main-door" onclick="handleDoor()" onerror="this.src='https://images.unsplash.com/photo-1513694203232-719a280e022f?w=600'">
    </div>

    <!-- Блок 1Б: Приветствие Чарли -->
    <div id="block-welcome" class="block">
        <div class="quote-text">I'M CHARLIE</div>
        <div class="quote-text">In every joke there is a share of whisky</div>
        <img src="horse_welcome.png" alt="Charlie" style="max-height: 34vh; margin: 4px 0;" onerror="this.src='https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=300'">
        <div style="font-size: 22px; font-weight: 700; letter-spacing: 8px; font-style: italic; margin-bottom: 4px; font-family: 'Cinzel', serif;">WELCOME</div>
        <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">PROCEED TO HALL</button>
        <button class="btn-gy" onclick="portalTransition('block-identity')">GET ID</button>
    </div>

    <!-- Подключаем скрипт Google Translate -->
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Подключаем наш языковой модуль как ES-модуль -->
    <script type="module">
        import { LanguageModule } from './modules/language.js';

        document.addEventListener("DOMContentLoaded", () => {
            // Инициализируем языковой модуль в наш контейнер
            LanguageModule.init('lang-container');
        });
    </script>

    <script>
        function handleDoor() {
            const sndDoor = document.getElementById('snd-door');
            const mainDoor = document.getElementById('main-door');
            if (sndDoor) { sndDoor.play().catch(e => {}); }
            if (mainDoor) mainDoor.classList.add('door-exploded');
            setTimeout(() => { portalTransition('block-welcome'); }, 700);
        }

        function portalTransition(nextId) {
            document.querySelectorAll('.block').forEach(b => {
                b.classList.remove('active');
            });
            const target = document.getElementById(nextId);
            if (target) {
                target.classList.add('active');
            }
        }
    </script>
</body>
</html>
