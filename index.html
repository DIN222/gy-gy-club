<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club - Block 1: Entrance</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --gold: #FFD700; --door-wood: #3E2723; --violet: #8A2BE2; }
        
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000000 !important; margin: 0; padding: 0; overflow: hidden; position: fixed; }
        body { color: var(--gold); font-family: 'Share Tech Mono', monospace; }

        /* Языковая панель */
        .club-lang-dropdown-wrapper { position: absolute; top: 18px; left: 20px; z-index: 1000001; width: 165px; }
        .club-lang-current { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.95); border: 2px solid var(--gold); padding: 5px 8px; border-radius: 10px; cursor: pointer; }
        .club-lang-current-content { display: flex; align-items: center; gap: 7px; min-width: 0; }
        .club-lang-current .item-avatar { width: 20px; height: 20px; border-radius: 50%; overflow: hidden; border: 1px solid var(--gold); background: #111; }
        .club-lang-current .item-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .club-lang-current .item-flag { width: 16px; height: 11px; object-fit: cover; border: 1px solid var(--gold); }
        .club-lang-current .item-text { color: var(--gold); font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .club-lang-list { position: absolute; top: calc(100% + 5px); left: 0; background: rgba(0,0,0,0.95); border: 2px solid var(--gold); border-radius: 10px; width: 100%; max-height: 260px; overflow-y: auto; display: none; z-index: 1000002; }
        .club-lang-list.open { display: block !important; }
        .club-lang-item { display: flex; align-items: center; gap: 7px; padding: 6px 8px; cursor: pointer; border-bottom: 1px solid rgba(255,215,0,0.15); }
        .club-lang-item:hover { background: rgba(255,215,0,0.15); }

        /* Блоки и переходы */
        .block { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: #000000; z-index: 10; }
        .block.active { display: flex !important; z-index: 5000 !important; }

        .quote-text { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; text-align: center; max-width: 85%; margin-bottom: 6px; }
        .btn-gy { min-width: 240px; padding: 9px 16px; background: #000000; border: 2px solid var(--gold); color: var(--gold); cursor: pointer; text-transform: uppercase; font-weight: 700; margin: 3px 0; font-family: 'Montserrat', sans-serif; font-size: 11px; }
        .btn-sleep { opacity: 0.15 !important; pointer-events: none !important; cursor: not-allowed; }

        #main-door { display: block; height: 48vh; max-height: 400px; width: auto; max-width: 100%; object-fit: contain; cursor: pointer; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease-out; }
        .door-exploded { transform: scale(3.5) !important; opacity: 0 !important; }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Аудио сопровождение -->
    <audio id="snd-door" src="door_open.mp3" preload="auto"></audio>
    <audio id="snd-ambient" src="bar_ambient.mp3" loop preload="auto"></audio>

    <!-- Блок 1А: Входная дверь и языки -->
    <div id="block-entrance" class="block active">
        <div class="club-lang-dropdown-wrapper notranslate">
            <div class="club-lang-current" onclick="toggleLangDropdown(event)">
                <div class="club-lang-current-content">
                    <div class="item-avatar"><img id="current-avatar" src="horse_welcome.png" alt="Charlie"></div>
                    <img id="current-flag" class="item-flag" src="https://flagcdn.com/w20/gb.png" alt="Flag">
                    <span id="current-lang-name" class="item-text">English</span>
                </div>
                <span class="arrow-down">▼</span>
            </div>
            <div id="club-lang-list" class="club-lang-list"></div>
        </div>
        <img src="door_1.jpg?v=2" id="main-door" onclick="handleDoor()">
    </div>

    <!-- Блок 1Б: Приветствие Чарли -->
    <div id="block-welcome" class="block">
        <div class="quote-text">I'M CHARLIE</div>
        <div class="quote-text">In every joke there is a share of whisky</div>
        <img src="horse_welcome.png" alt="Charlie" style="max-height: 34vh; margin: 4px 0;">
        <div style="font-size: 22px; font-weight: 700; letter-spacing: 8px; font-style: italic; margin-bottom: 4px; font-family: 'Cinzel', serif;">WELCOME</div>
        <button id="btn-w-hall" class="btn-gy btn-sleep" onclick="portalTransition('block-hall')">PROCEED TO HALL</button>
        <button class="btn-gy" onclick="portalTransition('block-identity')">GET ID</button>
    </div>

    <script>
        const clubLanguages = [
            { code: 'en', name: 'English', flag: 'https://flagcdn.com/w20/gb.png', avatar: 'horse_welcome.png' },
            { code: 'ru', name: 'Русский', flag: 'https://flagcdn.com/w20/ru.png', avatar: 'horse_welcome.png' },
            { code: 'es', name: 'Español', flag: 'https://flagcdn.com/w20/es.png', avatar: 'horse_welcome.png' }
        ];

        function toggleLangDropdown(event) {
            if (event) event.stopPropagation();
            document.getElementById('club-lang-list').classList.toggle('open');
        }

        function handleDoor() {
            const sndDoor = document.getElementById('snd-door');
            const mainDoor = document.getElementById('main-door');
            if (sndDoor) { sndDoor.play().catch(e => {}); }
            if (mainDoor) mainDoor.classList.add('door-exploded');
            setTimeout(() => { portalTransition('block-welcome'); }, 700);
        }

        function portalTransition(nextId) {
            document.querySelectorAll('.block').forEach(b => {
                b.classList.remove('active');
            });
            const target = document.getElementById(nextId);
            if (target) {
                target.classList.add('active');
            }
        }
    </script>
</body>
</html>
