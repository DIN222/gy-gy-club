<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GY-GY Club v4.6.3 CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Montserrat:wght@700&family=Playfair+Display:ital,wght@0,700;1,700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #FFD700; --door-wood: #3E2723; --violet: #8A2BE2; --neon-glow: rgba(138, 43, 226, 0.6); }
        
        * { -webkit-tap-highlight-color: transparent !important; box-sizing: border-box; }
        body, button, input, div, img, span { pointer-events: auto !important; }
        img { -webkit-user-drag: none !important; }

        html, body { 
            width: 100%; height: 100%; background: #000000; color: var(--gold); 
            font-family: 'Share Tech Mono', monospace; overflow: hidden; position: fixed; margin: 0; padding: 0;
        }
        
        button, .ui-user-badge, .arrow-item, #main-door { transition: all 0.3s ease !important; }
        button:hover, .ui-user-badge:hover, .arrow-item:hover, #main-door:hover { filter: brightness(1.1); }

        /* ЛОГОТИП GY-GY */
        .ui-header-right { 
            position: fixed; top: 18px; right: 25px; z-index: 1000000; 
            font-size: 24px; letter-spacing: 5px; font-weight: bold; font-family: 'Cinzel', serif;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        /* КОМПАКТНЫЙ ЯЗЫКОВЫЙ БЛОК */
        .club-lang-dropdown-wrapper {
            position: absolute; top: 18px; left: 20px; z-index: 1000001; width: 155px;
        }
        .club-lang-current {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold);
            padding: 5px 8px; border-radius: 10px; cursor: pointer; width: 100%;
        }
        .club-lang-current-content { display: flex; align-items: center; gap: 7px; min-width: 0; }
        .club-lang-current .item-text { color: var(--gold); font-size: 11px; font-weight: bold; white-space: nowrap; }
        .club-lang-current .arrow-down { color: var(--gold); font-size: 10px; font-weight: bold; }

        .club-lang-list {
            position: absolute; top: calc(100% + 5px); left: 0;
            background: rgba(0,0,0,0.95); border: 2px solid var(--gold);
            border-radius: 10px; width: 100%; display: none; z-index: 1000002;
        }
        .club-lang-list.open { display: block; }
        .club-lang-item {
            display: flex; align-items: center; gap: 7px; padding: 6px 8px; 
            cursor: pointer; border-bottom: 1px solid rgba(255,215,0,0.15);
        }
        .club-lang-item:hover { background: rgba(255,215,0,0.15); }
        .club-lang-item .item-text { color: var(--gold); font-size: 11px; font-weight: bold; }

        /* ОТЛАДОЧНЫЙ МОДУЛЬ СТАТУСОВ (НОВИЧОК / ЗАВСЕГДАТАЙ) */
        .debug-status-panel {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000003; display: flex; gap: 10px; background: rgba(0,0,0,0.85);
            border: 1px solid var(--gold); padding: 8px 12px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        .debug-btn {
            background: #000; border: 1px solid var(--gold); color: var(--gold);
            padding: 4px 10px; font-size: 10px; cursor: pointer; font-family: 'Share Tech Mono', monospace;
            border-radius: 4px; text-transform: uppercase;
        }
        .debug-btn.active-status { background: var(--gold); color: #000; font-weight: bold; }

        /* УНИВЕРСАЛЬНЫЙ КЛАСС БЛОКОВ */
        .block { 
            position: fixed; inset: 0; display: none; flex-direction: column; 
            align-items: center; justify-content: center; background: #000; 
            z-index: 10; opacity: 0; transition: opacity 1.2s ease-in-out; 
        }
        .block.active { display: flex !important; opacity: 1 !important; z-index: 5000 !important; }

        .quote-text { 
            font-family: 'Cormorant Garamond', serif; font-style: italic; 
            font-size: 20px; text-align: center; max-width: 85%; margin-bottom: 15px; 
        }
        .btn-gy { 
            min-width: 240px; padding: 10px 18px; background: #000; 
            border: 2px solid var(--gold); color: var(--gold); cursor: pointer; 
            text-transform: uppercase; font-weight: 700; margin: 4px 0; 
            font-family: 'Montserrat', sans-serif; font-size: 12px; 
        }

        /* ГЛАВНАЯ ДВЕРЬ */
        #main-door {
            display: block; height: 45vh; max-height: 380px; width: auto; max-width: 90vw;
            object-fit: contain; margin: 10px auto; cursor: pointer;
            background: radial-gradient(circle, #3E2723 0%, #111 80%);
            border: 3px solid var(--gold); border-radius: 8px;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease-out;
        }
        .door-exploded { transform: scale(3.5) !important; opacity: 0 !important; }

        /* НАВИГАЦИОННЫЕ СТРЕЛКИ */
        .ui-nav-arrows {
            position: fixed; top: 18px; left: 185px; z-index: 999999; 
            display: flex; gap: 15px; background: transparent; border: none;
        }
        .arrow-item { background: transparent; border: none; color: var(--gold); cursor: pointer; font-size: 24px; font-weight: 900; }

        body { opacity: 0; transition: opacity 1.2s ease-in-out; }
        body.page-loaded { opacity: 1; }
    </style>
</head>
<body class="page-loaded" oncontextmenu="return false;">

    <!-- Логотип -->
    <div class="ui-header-right">GY-GY</div>
    
    <!-- Языковой селектор -->
    <div class="club-lang-dropdown-wrapper" id="lang-dropdown">
        <div class="club-lang-current" onclick="toggleLangDropdown()">
            <div class="club-lang-current-content">
                <span class="item-text" id="current-lang-name">English</span>
            </div>
            <span class="arrow-down">▼</span>
        </div>
        <div class="club-lang-list" id="lang-list-container">
            <div class="club-lang-item" onclick="setLanguage('English')"><span class="item-text">English</span></div>
            <div class="club-lang-item" onclick="setLanguage('Русский')"><span class="item-text">Русский</span></div>
        </div>
    </div>

    <!-- Стрелки навигации -->
    <div class="ui-nav-arrows" id="nav-arrows" style="display: none;">
        <button class="arrow-item" onclick="portalTransition('block-welcome')">&#10094;</button>
    </div>

    <!-- ОТЛАДОЧНЫЙ МОДУЛЬ СТАТУСОВ -->
    <div class="debug-status-panel">
        <button class="debug-btn active-status" id="btn-novice" onclick="setUserStatus('novice')">Новичок</button>
        <button class="debug-btn" id="btn-regular" onclick="setUserStatus('regular')">Завсегдатай</button>
    </div>

    <!-- БЛОК 1: WELCOME -->
    <div id="block-welcome" class="block active">
        <div class="quote-text" id="welcome-quote">"The door is open for those who dare to step through."</div>
        <img src="door_closed.png" alt="Door" id="main-door" onclick="explodeDoor()" onerror="this.style.opacity='0.9'">
        <button class="btn-gy" style="margin-top: 15px;" onclick="portalTransition('block-hall')">Enter Club</button>
    </div>

    <!-- БЛОК 2: HALL -->
    <div id="block-hall" class="block">
        <div class="quote-text" style="position: absolute; top: 15vh;" id="hall-title">Welcome to the Inner Sanctum</div>
        <button class="btn-gy" onclick="portalTransition('block-welcome')">Back to Door</button>
    </div>

    <script>
        let currentStatus = 'novice';

        function toggleLangDropdown() {
            document.getElementById('lang-list-container').classList.toggle('open');
        }

        function setLanguage(name) {
            document.getElementById('current-lang-name').innerText = name;
            toggleLangDropdown();
        }

        window.addEventListener('click', function(e) {
            const dropdown = document.getElementById('lang-dropdown');
            if (!dropdown.contains(e.target)) {
                document.getElementById('lang-list-container').classList.remove('open');
            }
        });

        // Логика отладочных модулей статуса
        function setUserStatus(status) {
            currentStatus = status;
            document.getElementById('btn-novice').classList.toggle('active-status', status === 'novice');
            document.getElementById('btn-regular').classList.toggle('active-status', status === 'regular');
            
            // Динамическое изменение текста в зависимости от статуса для проверки
            if (status === 'novice') {
                document.getElementById('welcome-quote').innerText = '"The door is open for those who dare to step through."';
            } else {
                document.getElementById('welcome-quote').innerText = '"Welcome back, Insider. The club remembers you."';
            }
        }

        function portalTransition(nextId) {
            const currentActive = document.querySelector('.block.active');
            const nextBlock = document.getElementById(nextId);

            if (currentActive) {
                currentActive.style.opacity = '0';
                setTimeout(() => {
                    currentActive.classList.remove('active');
                    if (nextBlock) {
                        nextBlock.classList.add('active');
                        setTimeout(() => { nextBlock.style.opacity = '1'; }, 50);
                    }
                }, 600);
            } else if (nextBlock) {
                nextBlock.classList.add('active');
                setTimeout(() => { nextBlock.style.opacity = '1'; }, 50);
            }

            document.getElementById('nav-arrows').style.display = (nextId === 'block-hall') ? 'flex' : 'none';
        }

        function explodeDoor() {
            const door = document.getElementById('main-door');
            door.classList.add('door-exploded');
            setTimeout(() => { portalTransition('block-hall'); }, 500);
        }
    </script>
</body>
</html>
