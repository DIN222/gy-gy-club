<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club v4.6.15</title>
    <style>
        /* Базовые стили для языкового блока */
        .club-lang-dropdown-wrapper {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9998;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }
        .club-lang-current {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(11, 11, 11, 0.9);
            border: 1px solid var(--gold, #FFD700);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            color: #fff;
            font-size: 13px;
        }
        .club-lang-current img#current-flag {
            width: 20px;
            height: auto;
            border-radius: 2px;
        }
        .club-lang-list {
            position: absolute;
            top: 110%;
            right: 0;
            background: rgba(11, 11, 11, 0.95);
            border: 1px solid var(--gold, #FFD700);
            border-radius: 8px;
            width: 220px;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            z-index: 9999;
        }
        .club-lang-list.open {
            display: flex;
        }
        .club-lang-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            color: #fff;
            font-size: 12px;
        }
        .club-lang-item:hover {
            background: rgba(255, 215, 0, 0.15);
        }
        .club-lang-item .item-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid var(--gold, #FFD700);
        }
        .club-lang-item .item-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .club-lang-item .item-flag {
            width: 18px;
            height: auto;
        }
    </style>
</head>
<body>

    <!-- Блоки интерфейса -->
    <div class="block active" id="block-entrance" style="display: flex;">
        <div id="main-door" onclick="handleDoor()" style="cursor: pointer; padding: 20px; background: #222; color: #fff;">Main Door (Click Me)</div>
    </div>

    <div class="block" id="block-welcome" style="display: none;">
        Welcome Block
    </div>

    <!-- Языковой блок (Выпадающее меню) -->
    <div class="club-lang-dropdown-wrapper">
        <div class="club-lang-current" onclick="toggleLangDropdown()">
            <img id="current-flag" src="https://flagcdn.com/w20/gb.png" alt="Flag">
            <span id="current-lang-name">English</span>
            <span style="font-size: 10px; margin-left: auto;">▼</span>
        </div>
        <div id="club-lang-list" class="club-lang-list"></div>
    </div>

    <!-- Основной скрипт -->
    <script>
    /* ==========================================================================
       CLUB v4.6.15 CORE - BEGINNER LANGUAGE LOCK & STABLE FIX
       ========================================================================== */

    (function() {
        'use strict';

        setTimeout(() => {
            document.body.classList.add('page-loaded');
        }, 50);

        let currentID = "";
        let currentUserImage = "";
        let currentBlockId = 'block-entrance';
        let selectedNickType = 'own';
        let userChosenNickname = '';

        const allLanguages = [
            { code: 'en', name: 'English', flag: 'https://flagcdn.com/w20/gb.png' },
            { code: 'ru', name: 'Русский', flag: 'https://flagcdn.com/w20/ru.png' },
            { code: 'es', name: 'Español', flag: 'https://flagcdn.com/w20/es.png' },
            { code: 'de', name: 'Deutsch', flag: 'https://flagcdn.com/w20/de.png' },
            { code: 'fr', name: 'Français', flag: 'https://flagcdn.com/w20/fr.png' },
            { code: 'it', name: 'Italiano', flag: 'https://flagcdn.com/w20/it.png' },
            { code: 'zh-CN', name: '中文', flag: 'https://flagcdn.com/w20/cn.png' },
            { code: 'ja', name: '日本語', flag: 'https://flagcdn.com/w20/jp.png' },
            { code: 'ar', name: 'العربية', flag: 'https://flagcdn.com/w20/sa.png' },
            { code: 'pt', name: 'Português', flag: 'https://flagcdn.com/w20/pt.png' },
            { code: 'uk', name: 'Українська', flag: 'https://flagcdn.com/w20/ua.png' },
            { code: 'pl', name: 'Polski', flag: 'https://flagcdn.com/w20/pl.png' }
        ];

        function safeStorageGet(key, fallback = "") { 
            try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } 
        }

        function safeStorageSet(key, value) { 
            try { localStorage.setItem(key, value); } catch (e) {} 
        }

        function flagCodeToCountry(code) {
            const map = { 'en': 'gb', 'ru': 'ru', 'es': 'es', 'de': 'de', 'fr': 'fr', 'it': 'it', 'zh-CN': 'cn', 'ja': 'jp', 'ar': 'sa', 'pt': 'pt', 'uk': 'ua', 'pl': 'pl' };
            return map[code] || 'gb';
        }

        function checkBeginnerLanguageLock() {
            const devLevel = safeStorageGet('gygy_dev_level');
            if (devLevel === 'beginner') {
                safeStorageSet('gygy_lang_code', 'en');
                safeStorageSet('gygy_lang_name', 'English');
                safeStorageSet('gygy_flag', 'gb');
                safeStorageSet('gy_user_flag', 'gb');
            }
        }

        function syncGTranslateWidget() {
            checkBeginnerLanguageLock();
            const savedLangCode = safeStorageGet('gygy_lang_code') || 'en';
            const combo = document.querySelector('.goog-te-combo');
            if (combo) {
                if (combo.value !== savedLangCode) {
                    combo.value = savedLangCode;
                    combo.dispatchEvent(new Event('change'));
                }
            } else {
                setTimeout(syncGTranslateWidget, 100);
            }
        }

        function updateGlobalFlagUI() {
            checkBeginnerLanguageLock();
            const savedLangCode = safeStorageGet('gygy_lang_code') || 'en';
            const targetLang = allLanguages.find(l => l.code === savedLangCode) || allLanguages[0];
            
            const countryCode = flagCodeToCountry(targetLang.code);
            const flagUrl = `https://flagcdn.com/w20/${countryCode}.png`;
            
            const currentFlagEl = document.getElementById('current-flag');
            if (currentFlagEl) currentFlagEl.src = flagUrl;

            const langNameEl = document.getElementById('current-lang-name');
            if (langNameEl) langNameEl.innerText = targetLang.name;
        }

        function toggleLangDropdown() {
            if (safeStorageGet('gygy_dev_level') === 'beginner') {
                return;
            }

            const list = document.getElementById('club-lang-list');
            if (!list) return;

            const currentActiveCode = safeStorageGet('gygy_lang_code') || 'en';
            list.innerHTML = '';
            const userAvatarSrc = safeStorageGet('gygy_avatar') || safeStorageGet('gy_user_img') || 'https://via.placeholder.com/24';

            allLanguages.forEach(lang => {
                if (lang.code !== currentActiveCode) {
                    const item = document.createElement('div');
                    item.className = 'club-lang-item';
                    item.onclick = () => selectClubLanguage(lang.code, lang.name, lang.flag);
                    item.innerHTML = `
                        <div class="item-avatar"><img src="${userAvatarSrc}" alt="Avatar"></div>
                        <img class="item-flag" src="${lang.flag}" alt="Flag">
                        <span class="item-text">${lang.name}</span>
                        <span id="count-badge-${lang.code}" style="margin-left:auto; font-size:11px; color:var(--gold);"></span>
                    `;
                    list.appendChild(item);
                }
            });

            list.classList.toggle('open');
            updateCountryCounters();
        }

        function selectClubLanguage(langCode, langName, flagUrl) {
            if (safeStorageGet('gygy_dev_level') === 'beginner') return;

            const countryCode = flagCodeToCountry(langCode);
            safeStorageSet('gygy_flag', countryCode);
            safeStorageSet('gy_user_flag', countryCode);
            safeStorageSet('gygy_lang_code', langCode);
            safeStorageSet('gygy_lang_name', langName);
            
            updateGlobalFlagUI();

            const listContainer = document.getElementById('club-lang-list');
            if (listContainer) {
                listContainer.classList.remove('open');
            }

            const combo = document.querySelector('.goog-te-combo');
            if (combo) {
                combo.value = langCode;
                combo.dispatchEvent(new Event('change'));
            }
            updateCountryCounters();
        }

        window.addEventListener('click', (e) => {
            const wrapper = document.querySelector('.club-lang-dropdown-wrapper');
            const list = document.getElementById('club-lang-list');
            if (wrapper && list && !wrapper.contains(e.target)) {
                list.classList.remove('open');
            }
        });

        function setNickType(type) {
            selectedNickType = type;
            const boxOwn = document.getElementById('box-own-nick');
            const boxClub = document.getElementById('box-club-nick');
            if (type === 'own') {
                if (boxOwn) boxOwn.classList.add('selected');
                if (boxClub) boxClub.classList.remove('selected');
            } else {
                if (boxClub) boxClub.classList.add('selected');
                if (boxOwn) boxOwn.classList.remove('selected');
            }
        }

        function updateNicknameValue(val, type) {
            if (type === 'own') {
                userChosenNickname = val;
                safeStorageSet('gygy_nickname', val);
            }
        }

        function toggleManifest(boxId) {
            document.querySelectorAll('.manifest-btn-box').forEach(box => {
                if(box.id === boxId) {
                    const isOpened = box.getAttribute('data-opened') === "true";
                    box.style.opacity = isOpened ? "0" : "1";
                    box.style.pointerEvents = isOpened ? "none" : "auto";
                    box.setAttribute('data-opened', isOpened ? "false" : "true");
                    box.style.bottom = isOpened ? "-45px" : "-32px";
                } else {
                    box.style.opacity = "0"; box.style.pointerEvents = "none"; box.setAttribute('data-opened', "false"); box.style.bottom = "-45px";
                }
            });
        }

        function renderUserPassports(targetID) {
            const idLabel = document.getElementById('id-label');
            const passIdVal = document.getElementById('pass-id-val');
            const qrBoxReg = document.getElementById('qr-box-reg');
            const passQrBox = document.getElementById('pass-qr-box');
            if (idLabel) idLabel.innerText = targetID;
            if (passIdVal) passIdVal.innerText = targetID;
            if (qrBoxReg && typeof QRCode !== 'undefined') { qrBoxReg.innerHTML = ""; new QRCode(qrBoxReg, { text: targetID, width: 75, height: 75 }); }
            if (passQrBox && typeof QRCode !== 'undefined') { passQrBox.innerHTML = ""; new QRCode(passQrBox, { text: targetID, width: 90, height: 90 }); }
        }

        function checkAndFillRegistrationForm() {
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                const tgUser = window.Telegram.WebApp.initDataUnsafe.user;
                if (tgUser.first_name) {
                    safeStorageSet('gygy_nickname', tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : ''));
                }
            }

            const savedAvatar = safeStorageGet('gy_user_img') || safeStorageGet('gygy_avatar');
            currentID = safeStorageGet('gygy_id') || safeStorageGet('gy_user_id') || safeStorageGet('gy_trace');

            if (currentID) { renderUserPassports(currentID); }
            
            const clubNickLabel = document.getElementById('club-nick-label');
            if (clubNickLabel && currentID) clubNickLabel.innerText = currentID;

            if (savedAvatar) {
                currentUserImage = savedAvatar;
                const badgeImg = document.getElementById('badge-avatar-img');
                const passImg = document.getElementById('pass-avatar-img');
                if (badgeImg) badgeImg.src = savedAvatar;
                if (passImg) passImg.src = savedAvatar;

                if (savedAvatar.startsWith('data:image/svg+xml')) {
                    const avatarImg = document.getElementById('avatar-img'); if (avatarImg) { avatarImg.src = savedAvatar; avatarImg.style.display = "block"; }
                    const txtAvatar = document.getElementById('txt-avatar'); if (txtAvatar) txtAvatar.style.display = "none";
                } else { 
                    const ppImg = document.getElementById('pp'); if (ppImg) { ppImg.src = savedAvatar; ppImg.style.display = "block"; }
                    const txtPhoto = document.getElementById('txt-photo'); if (txtPhoto) txtPhoto.style.display = "none";
                }
                const btnWHall = document.getElementById('btn-w-hall'); if(btnWHall) btnWHall.classList.remove('btn-sleep');
                const btnPass = document.getElementById('btn-pass'); if(btnPass) btnPass.classList.remove('btn-sleep');
            }

            const currentNickname = safeStorageGet('gygy_nickname') || '';
            if (currentNickname.toLowerCase() === 'модермех') {
                safeStorageSet('gygy_is_boss', 'true');
            }
            
            const isBoss = safeStorageGet('gygy_is_boss') === 'true';
            const staffBtn = document.getElementById('btn-staff-room');
            if (isBoss && staffBtn) staffBtn.style.display = 'block';
        }

        function enterStudio() { window.location.href = 'studio.html'; }
        function enterStaffOffice() { window.location.href = 'staff_office.html'; }

        function portalTransition(nextId) {
            if (nextId === 'block-server') { window.location.href = 'verses.html'; return; }
            if (nextId === 'block-bar') { window.location.href = 'bar.html'; return; }
            if (nextId === 'block-tables') { window.location.href = 'tables.html'; return; } 
            if (nextId === 'block-office') { window.location.href = 'office.html'; return; }

            const targetBlock = document.getElementById(nextId);
            if (!targetBlock) return;

            currentBlockId = nextId;
            document.querySelectorAll('.block').forEach(b => {
                b.classList.remove('active');
                b.style.display = 'none';
            });

            targetBlock.style.display = 'flex';
            setTimeout(() => { targetBlock.classList.add('active'); }, 20);
        }

        function handleDoor() {
            const mainDoor = document.getElementById('main-door');
            if (mainDoor) mainDoor.classList.add('door-exploded');
            setTimeout(() => {
                portalTransition('block-welcome');
            }, 700);
        }

        function getGlobalRegistry() {
            try {
                const stored = localStorage.getItem('gygy_global_registry');
                return stored ? JSON.parse(stored) : [];
            } catch (e) { return []; }
        }

        function saveGlobalRegistry(registry) {
            try { localStorage.setItem('gygy_global_registry', JSON.stringify(registry)); } catch (e) {}
        }

        function syncUserToGlobalRegistry() {
            const id = safeStorageGet('gygy_id') || safeStorageGet('gy_user_id') || "GY-000000";
            const nickname = safeStorageGet('gygy_nickname') || 'Guest';
            const flag = safeStorageGet('gygy_flag') || safeStorageGet('gy_user_flag') || 'gb';
            const avatar = safeStorageGet('gygy_avatar') || safeStorageGet('gy_user_img') || '';
            const isBoss = safeStorageGet('gygy_is_boss') === 'true';

            let registry = getGlobalRegistry();
            const existingIndex = registry.findIndex(user => user.id === id);

            const userData = {
                id: id, nickname: nickname, flag: flag.toLowerCase(),
                avatar: avatar, role: isBoss ? 'Boss / Staff' : 'Resident', lastActive: Date.now()
            };

            if (existingIndex >= 0) registry[existingIndex] = userData;
            else registry.push(userData);

            saveGlobalRegistry(registry);
            updateCountryCounters();
        }

        function updateCountryCounters() {
            const registry = getGlobalRegistry();
            const counts = {};
            registry.forEach(user => {
                const f = (user.flag || 'gb').toLowerCase();
                counts[f] = (counts[f] || 0) + 1;
            });

            allLanguages.forEach(lang => {
                const country = flagCodeToCountry(lang.code).toLowerCase();
                const count = counts[country] || 0;
                const badgeEl = document.getElementById(`count-badge-${lang.code}`);
                if (badgeEl) badgeEl.innerText = count > 0 ? `(${count})` : '';
            });
        }

        function initDebugPanel() {
            if (document.getElementById('club-debug-panel')) return;
            const panel = document.createElement('div');
            panel.id = 'club-debug-panel';
            panel.innerHTML = `
                <div class="debug-title">DEBUG MODE</div>
                <button onclick="setDevLevel('beginner')">Новичок</button>
                <button onclick="setDevLevel('experienced')">Бывалый</button>
            `;
            document.body.appendChild(panel);
        }

        window.setDevLevel = function(level) {
            safeStorageSet('gygy_dev_level', level);
            if (level === 'beginner') {
                safeStorageSet('gygy_lang_code', 'en');
                safeStorageSet('gygy_lang_name', 'English');
                safeStorageSet('gygy_flag', 'gb');
                safeStorageSet('gy_user_flag', 'gb');
            }
            location.reload();
        };

        const registryStyles = document.createElement('style');
        registryStyles.innerHTML = `
            #club-debug-panel {
                position: fixed; bottom: 15px; right: 15px; z-index: 10000;
                background: rgba(11, 11, 11, 0.9); border: 1px solid var(--gold, #FFD700);
                padding: 8px 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px;
                box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); font-family: 'Montserrat', sans-serif;
            }
            #club-debug-panel .debug-title {
                color: var(--gold, #FFD700); font-size: 10px; font-weight: bold; text-align: center; letter-spacing: 1px;
            }
            #club-debug-panel button {
                background: transparent !important; background-color: transparent !important;
                border: 1px solid rgba(255, 215, 0, 0.5); color: #fff;
                padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; transition: all 0.2s;
            }
            #club-debug-panel button:hover {
                border-color: var(--gold, #FFD700); color: var(--gold, #FFD700); background: transparent !important;
            }
        `;
        document.head.appendChild(registryStyles);

        window.toggleLangDropdown = toggleLangDropdown;
        window.selectClubLanguage = selectClubLanguage;

        window.addEventListener('DOMContentLoaded', () => {
            checkBeginnerLanguageLock();
            if (!currentID) {
                currentID = "GY-" + Math.floor(100000 + Math.random() * 900000);
                safeStorageSet('gygy_id', currentID);
            }
            checkAndFillRegistrationForm();
            updateGlobalFlagUI();
            syncGTranslateWidget();
            syncUserToGlobalRegistry();
            initDebugPanel();
        });

    })();
    </script>
</body>
</html>
